name: Play release bundle

# Builds a signed Android App Bundle for the Play Console. Manual only: it
# needs the upload key, and the upload key is not something a push should
# reach for.
#
# The .aab is left as a workflow artifact rather than published to a GitHub
# release. A debug APK is meant to be downloadable from a phone; an upload
# bundle is meant to be downloaded once, by you, and handed to Play.

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name shown on Play, e.g. 1.0.1'
        required: true
        default: '1.0'
      versionCode:
        description: 'Version code — must be higher than every previous upload'
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make sure the SDK has what compileSdk 34 needs
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true
          fi

      - name: The gate has to pass before anything is sold
        working-directory: android
        run: ./gradlew --no-daemon test

      # Written outside the workspace so no later step can commit it, and
      # removed again whatever happens.
      - name: Unpack the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 is not set. See STORE.md — create the key locally, never in this repo."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build the bundle
        working-directory: android
        env:
          NONSENSE_KEYSTORE: ${{ runner.temp }}/upload.jks
          NONSENSE_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          NONSENSE_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          NONSENSE_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          NONSENSE_VERSION_CODE: ${{ inputs.versionCode }}
          NONSENSE_VERSION_NAME: ${{ inputs.versionName }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: It must not have come out unsigned
        working-directory: android
        run: |
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          test -n "$AAB" || { echo "::error::no bundle was produced"; exit 1; }
          # An unsigned bundle has no META-INF signature block; Play rejects it
          # with a message that does not say which of a dozen things went wrong.
          unzip -l "$AAB" | grep -qE 'META-INF/.*\.(RSA|EC|DSA)' || {
            echo "::error::the bundle is unsigned — check the UPLOAD_* secrets"; exit 1; }
          ls -la "$AAB"

      - uses: actions/upload-artifact@v4
        with:
          name: nonsense-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
