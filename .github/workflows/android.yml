name: Android debug APK

# The Android app has never been built on a developer machine. This builds it
# on CI, where the SDK is already installed, and publishes the APK as a
# prerelease so it can be installed straight from a phone browser — a workflow
# artifact would arrive as a zip, which is awkward to open on a device.

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make sure the SDK has what compileSdk 34 needs
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Test the simulation
        working-directory: android
        run: ./gradlew --no-daemon test --stacktrace

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Where did it land
        working-directory: android
        run: |
          find . -name '*.apk' -print
          ls -la app/build/outputs/apk/debug/

      - name: The APK must be signed by the committed key
        working-directory: android
        run: |
          python3 tools/apk-signer.py \
            app/build/outputs/apk/debug/app-debug.apk \
            "$(cat app/debug-keystore.sha256)"

      - name: Keep the test report when it goes wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Keep it as a run artifact too
        uses: actions/upload-artifact@v4
        with:
          name: nonsense-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish it where a phone can reach it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-debug --yes --cleanup-tag 2>/dev/null || true
          gh release create android-debug \
            --target "$GITHUB_SHA" \
            --title "Nonsense — debug APK" \
            --prerelease \
            --notes "Debug build of the Android app, signed with the throwaway debug key. Open this page on your phone and tap the .apk to install; Android will ask you to allow installs from your browser. Built from ${GITHUB_SHA}." \
            android/app/build/outputs/apk/debug/app-debug.apk
