<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;   /* the scrim is painted by the canvas now */
    cursor: default;
    user-select: none;
  }
  canvas { display: block; position: fixed; inset: 0; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Nonsense desktop renderer — five toys.
//   BALL    : click-drag anywhere and release to flick; bounces off edges.
//             G turns on catching — then you have to land on the ball to
//             grab it, and it stays where you caught it.
//   DIAL    : drag around center to spin, or scroll wheel from anywhere.
//   BUMPERS : the ball plus a table of bumpers that kick it back. The table
//             is editable (E) — move, pull, turn, reshape (outlines and the
//             alphabet), add, delete —
//             and the ball can paint while it plays (P).
//   PAINT   : the ball leaves a trail; colour, size and shape along the
//             bottom, C clears the canvas.
// The ball has eight sizes and six shapes, live in every mode: [ and ] resize
// it, S cycles its shape, the wheel resizes it in ball and bumpers. A
// non-round ball tumbles — impacts impart spin.
// The palette drawer (,) holds fifty-six inks, five levels of translucency
// for the ink, and the screen tint — how sheer the whole pane is.
// Tab cycles modes. 1-4 jumps to a mode. Esc quits.

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// Persistent trail layer, plus a scratch layer for the stroke being laid down
// right now. Translucent ink has to be composited once per stroke: stroking
// segment by segment at low alpha makes every round cap overlap the last and
// re-darken it, so a 15% trail comes out looking solid and beaded.
const trailCanvas = document.createElement("canvas");
const trailCtx = trailCanvas.getContext("2d");
const strokeCanvas = document.createElement("canvas");
const strokeCtx = strokeCanvas.getContext("2d");
let strokeLive = false;

const GRAPHITE = "#3a3a3c";
const RIM = "rgba(0,0,0,0.35)";

// ---- the palette ---------------------------------------------------------
// Nine families, four tones each. The middle tone of each family is a hand
// picked colour — the original six are still in here, in their own columns —
// and the rest are mixed toward white or black from it, so a family holds its
// hue across the range and nothing turns garish.
const FAMILIES = [
  { name: "graphite", base: "#3a3a3c" },
  { name: "bone",     base: "#c9c0ab" },
  { name: "oxblood",  base: "#702929" },
  { name: "rust",     base: "#9c5b3c" },
  { name: "ochre",    base: "#b08940" },
  { name: "moss",     base: "#5c6e4a" },
  { name: "teal",     base: "#3f6b68" },
  { name: "slate",    base: "#465a78" },
  { name: "plum",     base: "#5c3f5e" },
  // Five more. The first nine keep their places: a saved ink is an index, and
  // appending is the only change that does not quietly repaint a bumper table
  // somebody built.
  { name: "cobalt",   base: "#2f4a86" },
  { name: "rose",     base: "#a9596b" },
  { name: "fern",     base: "#3f8248" },
  { name: "umber",    base: "#6d4c33" },
  { name: "ink",      base: "#1d2530" },
];
const TONE_MIX = [0.58, 0.28, 0, -0.38];   // + toward white, - toward black
function hexToRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mix(rgb, target, amount) {
  return rgb.map((v, i) => Math.round(v + (target[i] - v) * amount));
}
function toHex(rgb) {
  return "#" + rgb.map(v => clamp(v, 0, 255).toString(16).padStart(2, "0")).join("");
}
const PALETTE = FAMILIES.map(f => {
  const base = hexToRgb(f.base);
  return TONE_MIX.map(m =>
    toHex(m >= 0 ? mix(base, [255, 255, 255], m) : mix(base, [0, 0, 0], -m)));
});

// How solid the ink is, and how sheer the whole pane is. Both are the point of
// the app rather than decoration: Fidget is a sheer thing over your screen.
const ALPHAS = [0.15, 0.3, 0.5, 0.75, 1];
const SCRIMS = [0, 0.06, 0.12, 0.18, 0.25, 0.34];

// What the toy sits on. Sheer is no ground at all — over a transparent
// Electron window your desktop shows through, which is the reason the thing
// exists. The rest are solid, for a screen that cannot float an app over its
// home screen, or for when you just want a colour to draw on.
const CANVASES = [
  { name: "sheer", color: null },
  { name: "paper", color: "#f4f1ea" },
  { name: "linen", color: "#e2d9c6" },
  { name: "sage",  color: "#b9c0ab" },
  { name: "slate", color: "#59636d" },
  { name: "ink",   color: "#23262b" },
  { name: "black", color: "#0b0c0e" },
];

// A browser can buzz a phone but not a laptop, so the control only appears
// where it would do something. Desktop Chrome has navigator.vibrate and does
// nothing with it, so the presence of the function is not enough on its own —
// it has to be a touch screen as well. That leaves the row hidden on a laptop
// and hidden on an iPhone, where Safari has no vibrate at all.
const CAN_BUZZ = typeof navigator !== "undefined" &&
  typeof navigator.vibrate === "function" && (navigator.maxTouchPoints || 0) > 0;
const HAPTICS = ["off", "soft", "firm"];
const HAPTIC_SCALES = [0, 0.55, 1];

// Slate rather than sheer. The see-through window is what the desktop build
// is for, but it is not what most of the toys look best on, and a ground you
// can see is a better first impression than one you cannot.
const DEFAULT_CANVAS = 4;
const ink = { family: 0, tone: 2, alpha: 4, scrim: 2, canvas: DEFAULT_CANVAS, haptic: 2 };
function canvasColor() { return CANVASES[ink.canvas].color; }
function sheer() { return !canvasColor(); }
function hapticScale() { return HAPTIC_SCALES[ink.haptic]; }
function buzz(ms) {
  if (!CAN_BUZZ) return;
  const scaled = Math.round(ms * hapticScale());
  if (scaled > 0) { try { navigator.vibrate(scaled); } catch (e) {} }
}
function inkColor() { return PALETTE[ink.family][ink.tone]; }
function inkAlpha() { return ALPHAS[ink.alpha]; }

// Eight steps, from a bead to a grapefruit, as multiples of the base radius.
const SIZES = [0.12, 0.2, 0.3, 0.5, 0.7, 1.0, 1.45, 2.1];
const DEFAULT_SIZE = 5;   // 1.0 — the original ball

const MODES = ["ball", "dial", "bumpers", "bolt", "glass", "paint"];
let mode = "ball";

// The app opens on its own name and a list of what it can do, rather than
// dropping you straight into whichever toy you left running. None of them
// announce themselves from the inside — a field with a ball in it looks the
// same whether or not it will let you paint.
let screen = "title";

// ---- free, or bought once ------------------------------------------------
// The Android build sells this; here it is the reference implementation and
// the demo, so it runs unlocked. Add ?free=1 to see exactly what the free
// tier gets — which is how the paywall gets looked at without a phone.
const FREE_FAMILIES = 3;      // graphite, bone, oxblood
const FREE_CANVASES = 2;      // sheer, and one to draw on
let tier = (typeof location !== "undefined" &&
            new URLSearchParams(location.search).has("free")) ? "free" : "full";
function full() { return tier === "full"; }
// The ball is the free toy. Everything else — the dial, the table,
// lightning, paint — is the unlock.
function modeLocked(m) { return !full() && m !== "ball"; }
function editLocked() { return !full(); }
function familyLocked(i) { return !full() && i >= FREE_FAMILIES; }
// The ground the app opens on is free whatever tier you are on: a default
// nobody can use is not a default.
function canvasLocked(i) {
  return !full() && i >= FREE_CANVASES && i !== DEFAULT_CANVAS;
}

let paywallFrom = "title";
function showPaywall() {
  if (screen === "paywall") return;
  paywallFrom = screen;
  screen = "paywall";
}
function dismissPaywall() { screen = paywallFrom; }
function unlockEverything() {
  tier = "full";
  if (screen === "paywall") dismissPaywall();
}
const PAYWALL_LINES = [
  "the dial, the bumper table and lightning",
  "paint — the ball leaves ink wherever it goes",
  "arrange the table, and colour every bumper",
  "all fifty-six inks and all seven canvases",
  "no account, no ads, nothing collected",
];
const PAYWALL_LABELS = ["subscribe", "restore", "not now"];
const PRICE_FALLBACK = "$1.99";
// There is no store behind a web page, so the price is only ever the list
// one here. On a phone it comes from Play or StoreKit, localised.
let priceText = null;
function unlockLabel() { return "subscribe  ·  " + (priceText || PRICE_FALLBACK) + "/mo"; }
const CODE_PROMPT = "have a code?";
// The unlock code, stored as a hash rather than as itself, so reading this
// file does not hand it over. Obfuscation and not security: four digits is
// ten thousand guesses and the gate is a client-side boolean either way. It
// exists so a code can be handed to a tester without handing over the app.
const CODE_HASH = 553159795;
const CODE_LENGTH = 4;
function codeHash(entry) {
  let h = -2128831035;
  const t = "nonsense/" + entry;
  for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h | 0;
}
const code = { open: false, entry: "", wrong: false };
function openCode() { code.open = true; code.entry = ""; code.wrong = false; }
function closeCode() { code.open = false; code.entry = ""; code.wrong = false; }
function typeCode(key) {
  code.wrong = false;
  if (key === "del") { code.entry = code.entry.slice(0, -1); return false; }
  if (code.entry.length >= CODE_LENGTH) return false;
  code.entry += key;
  if (code.entry.length < CODE_LENGTH) return false;
  if (codeHash(code.entry) === CODE_HASH) { closeCode(); unlockEverything(); return true; }
  code.wrong = true;
  code.entry = "";
  return false;
}
const KEYPAD_KEYS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "del"];
function keypadCells() {
  const cw = Math.min(W * 0.74, 420);
  const gap = cw * 0.04;
  const bw = (cw - gap * 2) / 3;
  const bh = Math.min(bw * 0.62, H * 0.082, 56);
  const x = (W - cw) / 2;
  const top = H - bh * 0.5 - 4 * bh - 3 * gap;
  return KEYPAD_KEYS.map((label, i) => ({
    i, label, x: x + (bw + gap) * (i % 3), y: top + (bh + gap) * Math.floor(i / 3),
    w: bw, h: bh,
  }));
}
function keypadHit(px, py) {
  for (const c of keypadCells())
    if (c.label && px >= c.x && px <= c.x + c.w && py >= c.y && py <= c.y + c.h) return c.label;
  return null;
}
function codePromptCell() {
  const b = paywallButtons()[0];
  const h = Math.min(H * 0.05, b.h * 0.7);
  return { x: b.x, y: b.y - h - h * 0.35, w: b.w, h };
}
// The terms, on the paywall itself. Apple's 3.1.2 wants the length of the
// subscription, what it costs per period, and that it renews, on the screen
// that sells it — and rejects the ones that leave it to the store sheet.
function subscriptionTerms() {
  return [(priceText || PRICE_FALLBACK) + " per month, renews until cancelled",
          "cancel any time in your store account"];
}
function paywallButtons() {
  const bh = Math.min(H * 0.072, W * 0.145, 56);
  const gap = bh * 0.22;
  const cw = Math.min(W * 0.74, 420);
  const x = (W - cw) / 2;
  const top = H - bh * 0.5 - PAYWALL_LABELS.length * bh - (PAYWALL_LABELS.length - 1) * gap;
  return PAYWALL_LABELS.map((label, i) => ({ i, label, x, y: top + (bh + gap) * i, w: cw, h: bh }));
}
function paywallHit(px, py) {
  for (const c of paywallButtons())
    if (px >= c.x && px <= c.x + c.w && py >= c.y && py <= c.y + c.h) return c.label;
  return null;
}
const MENU = [
  { key: "ball",    label: "ball",         blurb: "throw it and let it ring",   glyph: "circle" },
  { key: "dial",    label: "dial",         blurb: "a knurled wheel that clicks", glyph: "circle" },
  { key: "bumpers", label: "bumpers",      blurb: "a table to bounce through",  glyph: "hexagon" },
  { key: "bolt",    label: "lightning",    blurb: "a strike that stays etched", glyph: "bolt" },
  { key: "glass",   label: "glass",        blurb: "press it and it breaks",  glyph: "glass" },
  { key: "paint",   label: "paint",        blurb: "a ball that leaves ink",     glyph: "bar" },
  { key: "ink",     label: "ink & canvas", blurb: "colour, sheerness, ground",  glyph: "square" },
];
function menuItems() {
  const items = MENU.slice();
  // Named on the front door rather than sprung on you behind a control.
  if (!full()) items.push({ key: "unlock", label: "unlock everything",
                            blurb: "everything but the ball", glyph: "square" });
  return items;
}
function menuLocked(key) { return MODES.includes(key) && modeLocked(key); }
function titleBaseline() { return H * 0.26; }
function menuRowH() {
  // Adding lightning made a seventh row, and at a fixed height seven of them
  // overflowed a phone-shaped screen — invisible until someone cannot reach
  // the last entry.
  const n = menuItems().length;
  const top = titleBaseline() + H * 0.075;
  const room = Math.max(H - top - H * 0.02, 1);
  return Math.min(H * 0.082, W * 0.16, 92, room / (n + (n - 1) * 0.18));
}
function menuRows() {
  const rh = menuRowH(), gap = rh * 0.18;
  const cw = Math.min(W * 0.78, 620);
  const x = (W - cw) / 2;
  const top = titleBaseline() + H * 0.075;
  return menuItems().map((item, i) => ({ i, item, x, y: top + (rh + gap) * i, w: cw, h: rh }));
}
function menuHit(px, py) {
  for (const c of menuRows())
    if (px >= c.x && px <= c.x + c.w && py >= c.y && py <= c.y + c.h) return c.item.key;
  return null;
}
function openFromMenu(key) {
  if (key === "unlock") { showPaywall(); return true; }
  if (key === "ink") { screen = "play"; drawerOpen = true; return true; }
  if (!MODES.includes(key)) return false;
  if (modeLocked(key)) { showPaywall(); return true; }
  mode = key; screen = "play"; edit.on = false;
  return true;
}
// A way back, drawn rather than remembered: bottom right, clear of the strip
// and of whatever the host puts at the top of the page.
function menuButton() {
  const w = Math.min(W * 0.2, 96), h = Math.min(H * 0.05, 30);
  const lift = mode === "dial" ? 14 : paint.stripH() + 14;
  return { x: W - w - 14, y: H - lift - h, w, h };
}
function menuButtonHit(px, py) {
  const b = menuButton();
  return px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
}
// Arranging the table was reachable only by a key or a chip the page around
// the canvas happened to be drawing. It is a button now, next to MENU, in the
// mode that has a table.
function editButton() {
  const m = menuButton();
  const w = Math.min(W * 0.16, 74);
  return { x: m.x - w - 8, y: m.y, w, h: m.h };
}
function editButtonHit(px, py) {
  if (mode !== "bumpers") return false;
  const b = editButton();
  return px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
}

let W = 0, H = 0, DPR = 1;

// ---- shapes --------------------------------------------------------------
// One table, shared by the ball and the bumpers. Every entry is a convex
// outline on a unit circumradius, so "size" means the same thing whatever
// shape is wearing it.
function ngon(n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
    pts.push([Math.cos(a), Math.sin(a)]);
  }
  return pts;
}
const SHAPES = ["circle", "triangle", "square", "pentagon", "hexagon", "bar"];
const UNIT = {
  circle: null,
  triangle: ngon(3),
  square: [[-0.707, -0.707], [0.707, -0.707], [0.707, 0.707], [-0.707, 0.707]],
  pentagon: ngon(5),
  hexagon: ngon(6),
  bar: [[-1.35, -0.5], [1.35, -0.5], [1.35, 0.5], [-1.35, 0.5]],
};
// A circle pulled out of round is an ellipse, and an ellipse is not a circle
// to bounce off. Sixteen sides at a unit circumradius is close enough that the
// seam between what is drawn and what is hit never shows, and every side of it
// is still convex.
const ELLIPSE = ngon(16);
// How much ground a shape actually covers, as a fraction of its circumradius
// — the inradius. A bar is long but narrow, and should not ink a stripe as
// wide as it is long.
const COVER = { circle: 1, triangle: 0.5, square: 0.707, pentagon: 0.809,
              hexagon: 0.866, bar: 0.5 };
function inkWidth() { return ballR() * 2 * (COVER[ball.shape] || 1); }

// World-space outline, or null for a circle.
function shapePoints(shape, cx, cy, r, rot) {
  const u = UNIT[shape];
  if (!u) return null;
  const cos = Math.cos(rot), sin = Math.sin(rot);
  return u.map(([x, y]) => {
    const px = x * r, py = y * r;
    return [cx + px * cos - py * sin, cy + px * sin + py * cos];
  });
}

// ---- ball (shared by ball, bumpers, paint) -------------------------------
const ball = {
  x: 0, y: 0,
  vx: 0, vy: 0,
  baseR: 0,
  sizeIndex: DEFAULT_SIZE,
  shape: "circle",
  spin: 0, omega: 0,
  placed: false,
  dragging: false,
  mustCatch: false,      // ball mode only: you have to catch it to throw it
  grabDX: 0, grabDY: 0,
  friction: 0.55,
  restitution: 0.82,
  spinFriction: 0.45,
  samples: [],
};
function ballR() { return ball.baseR * SIZES[ball.sizeIndex]; }
function ballPoints() { return shapePoints(ball.shape, ball.x, ball.y, ballR(), ball.spin); }

// A hit off a surface with normal n spins the ball by the tangential part of
// the blow — the reason a square tumbles instead of sliding.
function impartSpin(nx, ny) {
  // Below the floor it is not worth feeling: a ball settling against an edge
  // should not buzz.
  const speed = Math.hypot(ball.vx, ball.vy);
  if (speed > 200) buzz(9 + 15 * clamp((speed - 200) / 2400, 0, 1));
  const r = Math.max(ballR(), 1);
  const t = ball.vx * -ny + ball.vy * nx;      // velocity along the surface
  ball.omega = clamp(ball.omega + (t / r) * 0.5, -30, 30);
}

// With catching on you have to actually land on the ball. Small balls get a
// bit of slack so a bead is not a pixel-hunt; a big one you simply have to
// hit. Measured against the real outline, so a bar is caught along the bar.
function catchSlack() { return Math.max(0, 20 - ballR() * 0.35); }
function withinCatch(px, py) {
  const pts = ballPoints();
  const slack = catchSlack();
  if (!pts) return Math.hypot(px - ball.x, py - ball.y) <= ballR() + slack;
  if (pointInPoly(px, py, pts)) return true;
  let best = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
    const [qx, qy] = closestOnSegment(px, py, ax, ay, bx, by);
    best = Math.min(best, Math.hypot(px - qx, py - qy));
  }
  return best <= slack;
}
// A missed grab leaves a ring for a moment. No sound, no score — just enough
// to tell you that you reached and the ball was not there.
const miss = { x: 0, y: 0, t: -1e9 };
function catching() { return mode === "ball" && ball.mustCatch && !edit.on; }

// ---- dial ----------------------------------------------------------------
// A knurled wheel coasts. The old friction shed two thirds of its speed
// every second and was still before you had finished letting go of it, which
// is why it never looked like it was spinning at all.
const DIAL_RIBS = 18;
const MAX_DIAL_OMEGA = 14;      // 40 rib passes a second against a 60Hz screen
const DIAL_WINDOW = 120;        // ms of drag a flick is measured over
const dial = {
  angle: 0, omega: 0,
  r: 0,
  grab: false,
  lastAngle: 0, lastTime: 0,
  friction: 0.78,
  samples: [],                  // {d, dt} newest last
  detent: 0, detentIndex: 0,
};

// Every rib crossing the index bumps the count, turning or coasting.
function dialDetents() {
  const step = (2 * Math.PI) / DIAL_RIBS;
  const idx = Math.floor(dial.angle / step);
  if (idx !== dial.detentIndex) {
    dial.detent += Math.abs(idx - dial.detentIndex);
    dial.detentIndex = idx;
    // lighter the faster it goes: forty firm clicks a second is a buzz
    buzz(9 - 5 * dialSpeed());
  }
}
function dialSpeed() { return clamp(Math.abs(dial.omega) / MAX_DIAL_OMEGA, 0, 1); }

/** Turn rate over the last DIAL_WINDOW, rather than over the last sample. */
function dialWindowOmega() {
  let turned = 0, seconds = 0;
  for (const s of dial.samples) { turned += s.d; seconds += s.dt; }
  return seconds <= 0 ? 0 : turned / seconds;
}

// ---- lightning -----------------------------------------------------------
// A struck bolt is a head travelling in a straight line and the zigzag it has
// left behind it. The zigzag is laid down as the head travels rather than
// generated at draw time, for one reason: a bolt redrawn from fresh
// randomness every frame shimmers like television static instead of hanging
// in the air. Each kink is displaced once and never moves again.
const BOLT_MIN_SPEED = 420;      // below this a flick is a nudge, not a strike
const BOLT_SPEED = 2.0;          // a bolt leaves faster than your finger did
const BOLT_MAX_SPEED = 9000;
// A bolt ends at the wall, not at a stopwatch. This is the failsafe for one
// that somehow never gets there, so it is generous.
const BOLT_LIFE = 1.6;
const BOLT_GLOW = 0.42;          // how long a struck bolt stays hot
const MAX_BOLTS = 40;            // live bolts, branches included
const BOLT_BRANCH = 0.19;        // chance a kink throws a fork
const BOLT_BRANCH_SPREAD = 0.62; // and how far off the fork leaves, in radians
const BOLT_BRANCH_SPEED = 0.7;   // a fork is slower than what threw it
const BOLT_MAX_GEN = 3;          // and can fork twice more
// A strike fans out rather than leaving as one line. Not decoration: a single
// line thrown from near an edge met a wall in a tenth of the screen and died
// there, so lightning only ever looked like lightning when it was thrown from
// the middle. A fan means some arm always has room to run.
const BOLT_ARC = 1.15;
// How many arms. The harder you flick the more there are, which is also where
// the extra knocks come from: every arm that reaches a wall is its own impact.
const BOLT_ARMS_MIN = 3;
const BOLT_ARMS_MAX = 9;
const BOLT_ARMS_FULL = 5200;
// How far a strike leans away from a wall it is thrown at. Without this the
// fan had to be almost a half-disc to give an edge flick anywhere to go, and
// a half-disc reads as a starburst rather than as lightning. Leaning keeps
// the strike pointed where you threw it and still gives it room to run.
const BOLT_LEAN = 0.8;
const BOLT_LEAN_REACH = 0.42;
// The shortest signed way round from a to b, so the lean never takes the
// long way about.
function angleDelta(a, b) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
}
/** The throw direction, leaned away from whichever wall is closest. */
function boltAim(px, py, vx, vy) {
  const short = Math.min(W, H);
  const near = Math.min(px, W - px, py, H - py);
  const lean = clamp(1 - near / Math.max(short * BOLT_LEAN_REACH, 1), 0, 1) * BOLT_LEAN;
  const a0 = Math.atan2(vy, vx);
  const inward = Math.atan2(H / 2 - py, W / 2 - px);
  return a0 + angleDelta(a0, inward) * lean;
}
function boltArms(flick) {
  const t = clamp((flick - BOLT_MIN_SPEED) / Math.max(BOLT_ARMS_FULL - BOLT_MIN_SPEED, 1), 0, 1);
  return BOLT_ARMS_MIN + Math.floor((BOLT_ARMS_MAX - BOLT_ARMS_MIN) * t);
}
const MAX_ETCHED = 220;          // etchings kept before the oldest is rubbed out
const ETCH_ALPHA = 0.62;         // how cool an etching sits under a live strike
// A live strike is white-hot; a cooled etching keeps its hue, because on this
// toy the colour is the point and a near-white core washes it out.
const BOLT_CORE_HOT = 0.9;
const BOLT_CORE_COOL = 0.26;
function boltWeight(gen) { return 1 - 0.25 * gen; }
const BOLT_NODE = 0.045;         // kink spacing, as a fraction of the short edge
const BOLT_JAG = 0.9;            // sideways throw, as a fraction of that
// A bolt runs from your finger to the wall and stops, so its whole path is
// the drawing and nothing rolls off the back of it. This is only a ceiling.
const BOLT_MAX_NODES = 96;

const bolts = [];
// Every bolt that has arrived, in the order it landed.
const etched = [];
let boltSeed = 0x5eed;

// A plain linear congruential step, identical in Kotlin, Swift and here,
// because the zigzag is part of the simulation rather than part of the
// drawing. Kept to 32-bit signed arithmetic so all three agree.
function nextRand(s) { return Math.imul(s, 1664525) + 1013904223 | 0; }
function rand01(s) { return ((s >>> 9) & 0xffff) / 65535; }
function randUnit(s) { return rand01(s) * 2 - 1; }

function fireBolt(px, py, flingX, flingY) {
  const flick = Math.hypot(flingX, flingY);
  if (flick < BOLT_MIN_SPEED) return false;
  let vx = flingX * BOLT_SPEED, vy = flingY * BOLT_SPEED;
  const sp = Math.hypot(vx, vy);
  if (sp > BOLT_MAX_SPEED) { vx *= BOLT_MAX_SPEED / sp; vy *= BOLT_MAX_SPEED / sp; }
  // The ink is read at the strike, not at the drawing, so an etching keeps
  // the colour it was thrown in however you change the palette afterwards.
  const argb = inkColor();
  const arms = boltArms(flick);
  const aim = boltAim(px, py, vx, vy);
  const speed = Math.hypot(vx, vy);
  for (let i = 0; i < arms; i++) {
    // The first arm goes where you threw it; the rest fan out either side,
    // alternating, so the spread stays centred on the throw.
    const step = i === 0 ? 0 : Math.floor((i + 1) / 2) / ((arms - 1) / 2 + 0.001);
    const turn = (i % 2 === 0 ? -1 : 1) * clamp(step, 0, 1) * BOLT_ARC;
    boltSeed = nextRand(boltSeed);
    // A little speed apart, so the arms do not all arrive at once and the
    // knocks land as a volley rather than a single thud.
    const f = 0.72 + 0.28 * rand01(boltSeed);
    const a = aim + turn;
    bolts.push({ x: px, y: py, vx: Math.cos(a) * speed * f, vy: Math.sin(a) * speed * f,
                 rng: boltSeed, life: 1, struck: false, sinceNode: 0, side: 1,
                 argb, gen: 0, nodes: [[px, py]] });
  }
  while (bolts.length > MAX_BOLTS) bolts.shift();
  return true;
}

/** A fork, leaving at an angle to whatever threw it. */
function branchBolt(b) {
  if (b.gen >= BOLT_MAX_GEN || bolts.length >= MAX_BOLTS) return;
  b.rng = nextRand(b.rng);
  // Off to the side the last kink threw, and never by a little: a uniform
  // turn puts most forks within a few degrees of their parent, which draws
  // parallel streaks rather than a tree.
  const turn = b.side * (0.45 + 0.55 * Math.abs(randUnit(b.rng))) * BOLT_BRANCH_SPREAD;
  const c = Math.cos(turn), si = Math.sin(turn), f = BOLT_BRANCH_SPEED;
  bolts.push({
    x: b.x, y: b.y,
    vx: (b.vx * c - b.vy * si) * f,
    vy: (b.vx * si + b.vy * c) * f,
    rng: nextRand(b.rng), life: 1, struck: false, sinceNode: 0, side: 1,
    argb: b.argb, gen: b.gen + 1, nodes: [[b.x, b.y]],
  });
}

function etchBolt(b) {
  if (b.nodes.length < 2) return;
  etched.push({ nodes: b.nodes.slice(), argb: b.argb, gen: b.gen });
  while (etched.length > MAX_ETCHED) etched.shift();
}

/** Everything that has arrived, wiped. */
function clearEtched() { etched.length = 0; }

function addBoltNode(b, node, exact) {
  while (b.nodes.length >= BOLT_MAX_NODES) b.nodes.shift();
  if (exact) {
    b.nodes.push([b.x, b.y]);
  } else {
    b.rng = nextRand(b.rng);
    // Alternating, not random. A displacement with a random sign is a random
    // walk: it drifts, and draws a wobbling rope. Lightning throws to one
    // side and then the other, and only the size of the throw varies.
    // Carried on the bolt, not read off the node count: the count stops
    // changing once the rolling window is full, and a constant side draws a
    // smooth arc rather than a zigzag.
    b.side = -b.side;
    const jag = b.side * (0.45 + 0.55 * Math.abs(randUnit(b.rng))) * node * BOLT_JAG;
    const sp = Math.max(Math.hypot(b.vx, b.vy), 1);
    // Clamped: the head reflecting off a wall is not the whole story, and a
    // kink displaced sideways near an edge lands outside the field.
    b.nodes.push([clamp(b.x + (-b.vy / sp) * jag, 0, W),
                  clamp(b.y + (b.vx / sp) * jag, 0, H)]);
  }
  b.sinceNode = 0;
}

function stepBolts(dt) {
  const node = Math.max(Math.min(W, H) * BOLT_NODE, 1);
  // By index, because a fork is appended to this same list as it is walked,
  // and a fork thrown this frame should start travelling the next one.
  const live = bolts.length;
  for (let bi = 0; bi < live; bi++) {
    const b = bolts[bi];
    if (b.struck) { b.life -= dt / BOLT_GLOW; continue; }
    const speed = Math.hypot(b.vx, b.vy);
    const steps = clamp(Math.ceil((speed * dt) / Math.max(node * 0.5, 1)), 1, 48);
    const h = dt / steps;
    for (let i = 0; i < steps; i++) {
      if (b.struck) break;
      b.x += b.vx * h;
      b.y += b.vy * h;
      b.sinceNode += Math.hypot(b.vx, b.vy) * h;
      // The wall is the end of the journey, not a cushion. A bolt that
      // bounced was a ball with a zigzag drawn on it; this one arrives,
      // knocks, and stays where it landed.
      if (b.x <= 0 || b.x >= W || b.y <= 0 || b.y >= H) {
        b.x = clamp(b.x, 0, W);
        b.y = clamp(b.y, 0, H);
        b.struck = true;
        buzz(9 + 15 * clamp((speed - 200) / 2400, 0, 1));
        addBoltNode(b, node, true);
        etchBolt(b);
      } else if (b.sinceNode >= node) {
        addBoltNode(b, node, false);
        b.rng = nextRand(b.rng);
        if (rand01(b.rng) < BOLT_BRANCH) branchBolt(b);
      }
    }
    if (!b.struck) {
      b.life -= dt / BOLT_LIFE;
      // Out of road without ever reaching a wall: it still counts as arrived,
      // or a stray fork would simply blink out.
      if (b.life <= 0) etchBolt(b);
    }
  }
  for (let i = bolts.length - 1; i >= 0; i--) if (bolts[i].life <= 0) bolts.splice(i, 1);
}

function boltAlpha(b) { return Math.pow(clamp(b.life, 0, 1), 0.55); }

/**
 * A wide dim wash of the ink under a hairline of near-white. One stroke reads
 * as a wire; it is the trio that reads as a glow, and it costs three strokes
 * rather than a blur filter.
 *
 * The etchings go down first, cool, so a fresh strike is plainly the bright
 * one and the scene behind it is a record rather than a crowd.
 */
function drawBolts() {
  const short = Math.min(W, H);
  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  // Etchings get two passes rather than three: a fan lands a lot of them, and
  // the middle sheath is what makes a live strike sit on a pale ground, not
  // what makes a cooled one readable.
  for (const e of etched)
    boltPath(e.nodes, null, e.argb, short, ETCH_ALPHA, boltWeight(e.gen), BOLT_CORE_COOL, true);
  for (const b of bolts) {
    boltPath(b.nodes, b.struck ? null : [b.x, b.y], b.argb, short,
             boltAlpha(b), boltWeight(b.gen), BOLT_CORE_HOT);
  }
  ctx.restore();
}

/** One path, three widths. `head` extends it to a bolt still travelling. */
function boltPath(nodes, head, argb, short, a, weight, hot, cool) {
  if (nodes.length < 2) return;
  const core = toHex(mix(hexToRgb(argb), [255, 255, 255], hot));
  ctx.beginPath();
  ctx.moveTo(nodes[0][0], nodes[0][1]);
  for (let i = 1; i < nodes.length; i++) ctx.lineTo(nodes[i][0], nodes[i][1]);
  if (head) ctx.lineTo(head[0], head[1]);
  // Three passes, and the middle one is the reason it reads on a pale ground
  // as well as a dark one: a white filament laid straight on paper is
  // invisible, so it gets its own dark sheath to sit against.
  ctx.globalAlpha = a * 0.28;
  ctx.strokeStyle = argb;
  ctx.lineWidth = short * 0.026 * weight;
  ctx.stroke();
  if (!cool) {
    ctx.globalAlpha = a * 0.7;
    ctx.lineWidth = short * 0.013 * weight;
    ctx.stroke();
  }
  ctx.globalAlpha = a * 0.95;
  ctx.strokeStyle = core;
  ctx.lineWidth = short * 0.005 * weight;
  ctx.stroke();
  if (head) {
    ctx.globalAlpha = a;
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(head[0], head[1], short * 0.011 * a * weight, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---- glass ---------------------------------------------------------------
// A crack is the same idea as a bolt's zigzag — nodes laid once and never
// moved — because glass and lightning break the same way: a line that jags as
// it runs. The jag is much smaller here: a fracture runs nearly straight, and
// the difference between nearly and exactly is the whole look of it.
const GLASS_RADIALS_MIN = 7;
const GLASS_RADIALS_MAX = 13;
const GLASS_RINGS_MIN = 2;
const GLASS_RINGS_MAX = 4;
const GLASS_STEP = 0.05;          // node spacing, as a fraction of the short edge
const GLASS_JAG = 0.34;           // wander, as a fraction of that
const GLASS_RING_FIRST = 0.1;
const GLASS_RING_STEP = 0.13;
const GLASS_RING_POINTS = 15;
const MAX_BREAKS = 14;

const breaks = [];
let glassSeed = 0x91a5;
function clearGlass() { breaks.length = 0; }

function crackOut(x0, y0, angle, depth) {
  const step = Math.max(Math.min(W, H) * GLASS_STEP, 1);
  const nodes = [[x0, y0]];
  let x = x0, y = y0, side = 1;
  const dx = Math.cos(angle), dy = Math.sin(angle);
  const limit = Math.floor(Math.hypot(W, H) / step) + 2;
  for (let i = 0; i < limit; i++) {
    x += dx * step; y += dy * step;
    if (x < 0 || x > W || y < 0 || y > H) {
      // A crack ends at the edge of the pane, which is where the pane ends.
      nodes.push([clamp(x, 0, W), clamp(y, 0, H)]);
      break;
    }
    glassSeed = nextRand(glassSeed);
    side = -side;
    const jag = side * (0.4 + 0.6 * Math.abs(randUnit(glassSeed))) * step * GLASS_JAG;
    nodes.push([clamp(x + -dy * jag, 0, W), clamp(y + dx * jag, 0, H)]);
  }
  return { nodes, ring: false, depth };
}

function crackRing(x0, y0, r, depth) {
  const nodes = [];
  for (let i = 0; i <= GLASS_RING_POINTS; i++) {
    const a = (i / GLASS_RING_POINTS) * Math.PI * 2;
    glassSeed = nextRand(glassSeed);
    const rr = r * (0.86 + 0.28 * rand01(glassSeed));
    nodes.push([clamp(x0 + Math.cos(a) * rr, 0, W), clamp(y0 + Math.sin(a) * rr, 0, H)]);
  }
  return { nodes, ring: true, depth };
}

function breakGlass(px, py) {
  if (W <= 0 || H <= 0) return false;
  const short = Math.min(W, H);
  glassSeed = nextRand(glassSeed);
  const radials = GLASS_RADIALS_MIN +
    Math.floor((GLASS_RADIALS_MAX - GLASS_RADIALS_MIN) * rand01(glassSeed));
  glassSeed = nextRand(glassSeed);
  const rings = GLASS_RINGS_MIN +
    Math.floor((GLASS_RINGS_MAX - GLASS_RINGS_MIN) * rand01(glassSeed));

  const cracks = [];
  const start = randUnit(glassSeed) * Math.PI;
  for (let i = 0; i < radials; i++) {
    glassSeed = nextRand(glassSeed);
    // Evenly spaced then nudged: perfectly even spokes read as a wheel.
    const a = start + (i / radials) * Math.PI * 2 +
      randUnit(glassSeed) * (Math.PI / radials) * 0.55;
    cracks.push(crackOut(px, py, a, i % 3));
  }
  for (let k = 0; k < rings; k++) {
    cracks.push(crackRing(px, py, short * (GLASS_RING_FIRST + GLASS_RING_STEP * k), k));
  }
  breaks.push({ x: px, y: py, argb: inkColor(), cracks });
  while (breaks.length > MAX_BREAKS) breaks.shift();
  buzz(24);
  return true;
}

/**
 * The seam is dark and the edge beside it is the ink you chose — that pair is
 * the whole illusion: a fracture face catching the light, in a colour,
 * against the dark of the crack itself.
 */
function drawGlass() {
  const short = Math.min(W, H);
  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  for (const b of breaks) {
    const edge = toHex(mix(hexToRgb(b.argb), [255, 255, 255], 0.34));
    for (const c of b.cracks) {
      if (c.nodes.length < 2) continue;
      ctx.beginPath();
      ctx.moveTo(c.nodes[0][0], c.nodes[0][1]);
      for (let i = 1; i < c.nodes.length; i++) ctx.lineTo(c.nodes[i][0], c.nodes[i][1]);
      // The seam: the gap itself, darker than anything around it.
      ctx.globalAlpha = c.ring ? 0.35 : 0.47;
      ctx.strokeStyle = "#000";
      ctx.lineWidth = short * (c.ring ? 0.006 : 0.008);
      ctx.stroke();
      // The exposed edge, offset by a hair so it reads as a face rather than
      // as an outline.
      ctx.save();
      ctx.translate(short * 0.0022, -short * 0.0022);
      ctx.globalAlpha = c.ring ? 0.59 : 0.8;
      ctx.strokeStyle = edge;
      ctx.lineWidth = short * (c.ring ? 0.0028 : 0.0038);
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = toHex(mix(hexToRgb(b.argb), [255, 255, 255], 0.5));
    ctx.beginPath();
    ctx.arc(b.x, b.y, short * 0.012, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ---- paint ---------------------------------------------------------------
const paint = {
  lastX: 0, lastY: 0, started: false,
  onBumpers: true,          // the ball paints while the bumper table plays
  stripH: () => H * 0.07,
};
// Paint is live in paint mode, and in bumpers mode when it's switched on.
// Never while editing the table — the strip would eat the edit taps.
function painting() {
  if (edit.on) return false;
  return mode === "paint" || (mode === "bumpers" && paint.onBumpers);
}

// ---- bumpers -------------------------------------------------------------
// Each bumper is normalised: nx/ny are fractions of the field, size is a
// fraction of its short edge, so a table survives a resize or a new display.
// Each bumper carries its own ink, from the same fifty-six as everything
// else, and is drawn not quite solid so a painting still shows faintly
// through the table rather than being walled off by it.
const BUMPER_ALPHA = 0.72;
const DEFAULT_BUMPERS = [
  { nx: 0.25, ny: 0.30, size: 0.055, shape: "circle",  rot: 0, family: 2, tone: 2 },
  { nx: 0.75, ny: 0.30, size: 0.055, shape: "circle",  rot: 0, family: 7, tone: 2 },
  { nx: 0.50, ny: 0.50, size: 0.068, shape: "hexagon", rot: 0, family: 4, tone: 2 },
  { nx: 0.25, ny: 0.72, size: 0.055, shape: "bar",     rot: 0, family: 5, tone: 2 },
  { nx: 0.75, ny: 0.72, size: 0.055, shape: "bar",     rot: 0, family: 6, tone: 2 },
];
function bumperColor(b) { return PALETTE[b.family][b.tone]; }
const KICK = 1.06;
const MAX_SPEED = 6000;
const MIN_SIZE = 0.018, MAX_SIZE = 0.30;
// A bumper can be pulled to a quarter of itself or four times it. Past that a
// letter stops being legible in one direction and stops being hittable in the
// other, and neither is a shape anyone meant to make.
const MIN_STRETCH = 0.25, MAX_STRETCH = 4;
// How head-on a hit on a round surface has to be before it comes off it.
// Below this the ball keeps the speed it had along the surface and only loses
// what it had into it — so it follows the curve round instead of ricocheting,
// and a ball sent past a round bumper at a shallow angle wraps rather than
// kicks. Measured as |v·n| over |v|: zero is a graze, one is dead-on.
const CURVE_BITE = 0.55;

let table = loadTable();

const edit = {
  on: false,
  sel: -1,
  drag: null,       // "move" | "pull" | "rotate"
  grabDX: 0, grabDY: 0,
};

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function loadTable() {
  try {
    const raw = localStorage.getItem("nonsense.bumpers") ||
                localStorage.getItem("fidget.bumpers");   // carried over from the old name
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length) return parsed.map(sane);
    }
  } catch (e) { /* private mode, blocked storage — defaults are fine */ }
  return DEFAULT_BUMPERS.map(sane);
}
function saveTable() {
  try { localStorage.setItem("nonsense.bumpers", JSON.stringify(table)); } catch (e) {}
}
function saveBall() {
  try {
    localStorage.setItem("nonsense.ball",
      JSON.stringify({ shape: ball.shape, sizeIndex: ball.sizeIndex,
                       mustCatch: ball.mustCatch }));
  } catch (e) {}
}
function saveInk() {
  try { localStorage.setItem("nonsense.ink", JSON.stringify({ ...ink, v: 2 })); } catch (e) {}
}
function loadInk() {
  try {
    const raw = localStorage.getItem("nonsense.ink") || localStorage.getItem("fidget.ink");
    if (!raw) return;
    const p = JSON.parse(raw);
    ink.family = clamp(p.family | 0, 0, FAMILIES.length - 1);
    ink.tone   = clamp(p.tone   | 0, 0, TONE_MIX.length - 1);
    ink.alpha  = clamp(p.alpha  | 0, 0, ALPHAS.length - 1);
    ink.scrim  = clamp(p.scrim  | 0, 0, SCRIMS.length - 1);
    // The ground the app opens on changed from sheer to slate. Anything saved
    // before that is taken back to the new default once, rather than leaving
    // an old install on a ground it was never asked about.
    ink.canvas = (p.v | 0) >= 2 ? clamp(p.canvas | 0, 0, CANVASES.length - 1)
                                : DEFAULT_CANVAS;
    ink.haptic = clamp(p.haptic == null ? 2 : p.haptic | 0, 0, HAPTICS.length - 1);
  } catch (e) {}
}
function loadBall() {
  try {
    const raw = localStorage.getItem("nonsense.ball") || localStorage.getItem("fidget.ball");
    if (!raw) return;
    const p = JSON.parse(raw);
    if (SHAPES.includes(p.shape)) ball.shape = p.shape;
    if (Number.isInteger(p.sizeIndex) && p.sizeIndex >= 0 && p.sizeIndex < SIZES.length)
      ball.sizeIndex = p.sizeIndex;
    ball.mustCatch = !!p.mustCatch;
  } catch (e) {}
}
function sane(b) {
  return {
    nx: clamp(+b.nx || 0.5, 0, 1),
    ny: clamp(+b.ny || 0.5, 0, 1),
    size: clamp(+b.size || 0.055, MIN_SIZE, MAX_SIZE),
    shape: SHAPES.includes(b.shape) ? b.shape : "circle",
    rot: +b.rot || 0,
    // Tables saved before bumpers had a colour have neither field. They load
    // in graphite: an arrangement is not worth discarding over a new field.
    family: clamp(b.family | 0, 0, FAMILIES.length - 1),
    tone: clamp(b.tone == null ? 2 : b.tone | 0, 0, TONE_MIX.length - 1),
    // Two axes rather than one: a bumper that can only grow evenly cannot be
    // a bar you pull long, and a letter that cannot be pulled is a sticker.
    sx: clamp(+b.sx || 1, MIN_STRETCH, MAX_STRETCH),
    sy: clamp(+b.sy || 1, MIN_STRETCH, MAX_STRETCH),
    glyph: typeof b.glyph === "string" && b.glyph.length === 1 &&

  };
}
loadBall();
loadInk();

// Pixel geometry for a bumper: a circle, or a convex polygon in world space.
// Block letters, five wide and seven tall, one bit per cell. Two hex digits
// per row, seven rows per letter, A to Z in order — one literal, so the three
// ports can be checked against each other by comparing a single string.
//
// A letter is drawn and collided as the boxes its set cells make, which is
// what lets a concave shape work at all in a world of convex polygons: each
// box is convex, and a letter is just several of them.
const LETTER_GRID_W = 5;
const LETTER_GRID_H = 7;
const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const LETTER_FONT =
  "0e11111f1111111e11111e11111e0e11101010110e1e11111111111e1f10101e10101f1f10101e1010100e11101711110e1111111f1111111f04040404041f0702020202120c111214181412111010101010101f111b1515111111111915131111110e11111111110e1e11111e1010100e11111115120d1e11111e1412110f10100e01011e1f0404040404041111111111110e11111111110a0411111115151b1111110a040a111111110a040404041f01020408101f";
function letterRow(letter, r) {
  const i = ALPHABET.indexOf(letter);
  if (i < 0) return 0;
  const at = (i * LETTER_GRID_H + r) * 2;
  return parseInt(LETTER_FONT.slice(at, at + 2), 16);
}
function letterOn(letter, col, r) {
  return ((letterRow(letter, r) >> (LETTER_GRID_W - 1 - col)) & 1) === 1;
}
/**
 * The boxes a letter is made of, in unit space: x and y from -1 to 1.
 * Horizontal runs, then merged downward where a run repeats — a stem drawn as
 * seven stacked boxes shows seams, and one box does not.
 */
function letterBoxes(letter) {
  const out = [];
  const taken = Array.from({ length: LETTER_GRID_H }, () => new Array(LETTER_GRID_W).fill(false));
  for (let r = 0; r < LETTER_GRID_H; r++) {
    let c = 0;
    while (c < LETTER_GRID_W) {
      if (!letterOn(letter, c, r) || taken[r][c]) { c++; continue; }
      let end = c;
      while (end + 1 < LETTER_GRID_W && letterOn(letter, end + 1, r) && !taken[r][end + 1]) end++;
      let last = r;
      const spanClear = (rr) => {
        for (let cc = c; cc <= end; cc++) if (!letterOn(letter, cc, rr) || taken[rr][cc]) return false;
        if (c > 0 && letterOn(letter, c - 1, rr)) return false;
        if (end < LETTER_GRID_W - 1 && letterOn(letter, end + 1, rr)) return false;
        return true;
      };
      while (last + 1 < LETTER_GRID_H && spanClear(last + 1)) last++;

  if (edit.on && mode === "bumpers") {
    const b = table[edit.sel];
    if (!b || !edit.drag) return;
    if (edit.drag === "move") {
      b.nx = clamp((p.x - edit.grabDX) / W, 0, 1);
      b.ny = clamp((p.y - edit.grabDY) / H, 0, 1);
    } else if (edit.drag === "pull") {
      pullTo(b, p.x, p.y);
    } else if (edit.drag === "rotate") {
      b.rot = Math.atan2(p.y - b.ny * H, p.x - b.nx * W) - Math.PI / 2;
    }
    return;
  }

  if (mode === "dial") {
    if (!dial.grab) return;
    const a = angleTo(p.x, p.y);
    let d = a - dial.lastAngle;
    while (d > Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    const now = performance.now();
    const dt = Math.max(now - dial.lastTime, 1) / 1000;
    dial.angle += d;
    dial.lastAngle = a;
    dial.lastTime = now;
    // A finger nearly always stalls for a frame before it lifts, so reading
    // the last sample alone handed a hard flick back a wheel at rest.
    dial.samples.push({ d, dt });
    let held = dial.samples.reduce((t, s) => t + s.dt, 0);
    while (held > DIAL_WINDOW / 1000 && dial.samples.length > 1)
      held -= dial.samples.shift().dt;
    dial.omega = clamp(dialWindowOmega(), -MAX_DIAL_OMEGA, MAX_DIAL_OMEGA);
    dialDetents();
  } else if (ball.dragging) {
    ball.x = p.x + ball.grabDX; ball.y = p.y + ball.grabDY;
    const now = performance.now();
    ball.samples.push({ x: p.x, y: p.y, t: now });
    while (ball.samples.length > 2 && now - ball.samples[0].t > 100)
      ball.samples.shift();
    if (painting()) layTrail();
  }
});

canvas.addEventListener("pointerup", () => {
  if (screen !== "play") return;

  if (mode === "bolt") {
    boltAiming = false;
    const s = ball.samples;
    if (s.length >= 2) {
      const a = s[0], b = s[s.length - 1];
      const dt = Math.max(b.t - a.t, 1) / 1000;
      fireBolt(b.x, b.y, (b.x - a.x) / dt, (b.y - a.y) / dt);
    }
    return;
  }

  if (edit.on) { if (edit.drag) saveTable(); edit.drag = null; return; }
  if (mode !== "dial" && ball.dragging) {
    ball.dragging = false;
    const s = ball.samples;
    if (s.length >= 2) {
      const a = s[0], b = s[s.length - 1];
      const dt = Math.max(b.t - a.t, 1) / 1000;
      ball.vx = (b.x - a.x) / dt;
      ball.vy = (b.y - a.y) / dt;
      // a flick sets it turning, the way a thrown object does
      ball.omega = clamp(ball.omega + (ball.vx / Math.max(ballR(), 1)) * 0.25, -30, 30);
    }
  }
  if (dial.grab) {
    // letting go of a moving wheel throws it, rather than handing it back
    dial.omega = clamp(dialWindowOmega() * 1.4, -MAX_DIAL_OMEGA, MAX_DIAL_OMEGA);
    dial.samples.length = 0;
  }
  dial.grab = false;
});

window.addEventListener("wheel", (e) => {
  if (screen !== "play") return;
  if (mode === "dial") {
    dial.omega = clamp(dial.omega + e.deltaY * 0.02, -MAX_DIAL_OMEGA, MAX_DIAL_OMEGA);
    return;
  }
  if (edit.on) return;
  // the wheel resizes the ball wherever the ball is the toy
  const dir = e.deltaY > 0 ? -1 : 1;
  ball.sizeIndex = clamp(ball.sizeIndex + dir, 0, SIZES.length - 1);
  stripFlash = performance.now() + 2200;
  saveBall();
});

window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();

  if (screen === "paywall") {
    if (code.open) {
      if (e.key === "Escape") closeCode();
      else if (e.key === "Backspace") typeCode("del");
      else if (/^[0-9]$/.test(e.key)) typeCode(e.key);
      return;
    }
    if (e.key === "Escape") dismissPaywall();
    return;
  }

  if (screen === "title") {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= MODES.length) { openFromMenu(MODES[n - 1]); return; }
    if (e.key === "Enter" || e.key === " ") { openFromMenu("ball"); return; }
    if (e.key === "Escape") { window.nonsense ? window.nonsense.quit() : window.close(); }
    return;
  }

  if (e.key === "Escape") {
    if (drawerOpen) { closeDrawer(); return; }
    if (edit.on) { edit.on = false; edit.sel = -1; return; }
    // Out to the menu first. Escape only leaves once there is nowhere left.
    settleStroke();
    screen = "title";
    return;
  }
  if (e.key === ",") { drawerOpen = !drawerOpen; return; }
  if (drawerOpen) {
    // while the drawer is up the number keys pick a tone
    const t = parseInt(e.key, 10);
    if (t >= 1 && t <= TONE_MIX.length) { settleStroke(); ink.tone = t - 1; saveInk(); }
    if (k === "a") { settleStroke(); ink.alpha = (ink.alpha + 1) % ALPHAS.length; saveInk(); }
    if (k === "t") { ink.scrim = (ink.scrim + 1) % SCRIMS.length; saveInk(); }
    if (k === "k") { ink.canvas = (ink.canvas + 1) % CANVASES.length; saveInk(); }
    return;
  }
  if (e.key === "Tab") {
    e.preventDefault();
    edit.on = false;
    // Skip past anything locked: being ambushed by a shop mid-fidget is
    // worse than having three toys in the rotation.
    let next = mode;
    for (let i = 0; i < MODES.length; i++) {
      next = MODES[(MODES.indexOf(next) + 1) % MODES.length];
      if (!modeLocked(next)) { mode = next; break; }
    }
  }

  const n = parseInt(e.key, 10);
  if (edit.on && mode === "bumpers") {
    // while editing, the number keys pick a bumper shape instead of a mode
    if (n >= 1 && n <= SHAPES.length && table[edit.sel]) {
      table[edit.sel].shape = SHAPES[n - 1];
      table[edit.sel].glyph = "";      // a number picks an outline, not a letter
      saveTable();
    }
    // Shift and a letter sets that letter, because plain "a" is already add
    // and a keyboard is the one place a whole alphabet can be reached at once.
    if (e.shiftKey && ALPHABET.includes(e.key) && table[edit.sel]) {
      table[edit.sel].glyph = e.key; saveTable();
    }
    if (k === "a" && !e.shiftKey) doToolbar("+ add");
    if (e.key === "Delete" || e.key === "Backspace") doToolbar("delete");
    if (k === "r") doToolbar("rotate");
    if (k === "[") doToolbar("size -");
    if (k === "]") doToolbar("size +");
  } else {
    if (n >= 1 && n <= MODES.length) {
      if (modeLocked(MODES[n - 1])) showPaywall(); else mode = MODES[n - 1];
    }
    // the ball's own size and shape, live in every mode
    if (k === "[" || k === "]") {
      ball.sizeIndex = clamp(ball.sizeIndex + (k === "]" ? 1 : -1), 0, SIZES.length - 1);
      stripFlash = performance.now() + 2200;
      saveBall();
    }
    if (k === "g" && mode === "ball") { ball.mustCatch = !ball.mustCatch; saveBall(); }
    if (k === "a") {
      settleStroke();
      ink.alpha = (ink.alpha + (e.shiftKey ? -1 : 1) + ALPHAS.length) % ALPHAS.length;
      saveInk();
    }
    if (k === "t") {
      ink.scrim = (ink.scrim + (e.shiftKey ? -1 : 1) + SCRIMS.length) % SCRIMS.length;
      saveInk();
    }
    if (k === "s") {
      const step = e.shiftKey ? -1 : 1;
      ball.shape = SHAPES[(SHAPES.indexOf(ball.shape) + step + SHAPES.length) % SHAPES.length];
      ball.spin = 0;
      stripFlash = performance.now() + 2200;
      saveBall();
    }
  }

  if (k === "e" && mode === "bumpers") {
    if (editLocked()) showPaywall();
    else { edit.on = !edit.on; edit.sel = -1; }
  }
  if (k === "p" && mode === "bumpers") { paint.onBumpers = !paint.onBumpers; }
  if (k === "c") {
    if (painting()) clearTrail();
    if (mode === "bolt") clearEtched();
    if (mode === "glass") clearGlass();
  }
});

// ---- edit toolbar --------------------------------------------------------
// Drawn on the canvas rather than in the DOM: it can't be covered by whatever
// chrome is hosting the page, and it works the same in Electron and a browser.
function toolbar() {
  const pad = 10, h = 30, y = 14;
  const labels = ["+ add", "shape", "rotate", "size -", "size +", "ink", "delete", "reset", "done"];
  ctx.font = "500 12px ui-monospace, Menlo, Consolas, monospace";
  let x = 14;
  return labels.map((label) => {
    const w = ctx.measureText(label).width + pad * 2;
    const r = { label, x, y, w, h };
    x += w + 6;
    return r;
  });
}
function toolbarHit(px, py) {
  return toolbar().find(b => px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h);
}
/**
 * The two handles, in the bumper's own frame. The red one sits on the corner
 * of the stretched box and pulls both axes at once, so making a bar long and
 * thin needs no third handle and no modifier key — neither of which a phone
 * has anywhere to put.
 */
function handles(b) {
  const g = geom(b);
  const cos = Math.cos(b.rot), sin = Math.sin(b.rot);
  const hx = g.r * (b.sx ?? 1), hy = g.r * (b.sy ?? 1);
  const reach = Math.max(hx, hy) + Math.min(W, H) * 0.06;
  return {
    pull: [g.cx + hx * cos - hy * sin, g.cy + hx * sin + hy * cos],
    rotate: [g.cx - reach * sin, g.cy + reach * cos],

}

/**
 * Pull the bumper to a point: the drag is taken into the bumper's own frame,
 * so the axis you pull along is the axis that grows however far round the
 * thing has been turned.
 */
function pullTo(b, px, py) {
  const r = Math.max(b.size * Math.min(W, H), 1e-4);
  const cos = Math.cos(-b.rot), sin = Math.sin(-b.rot);
  const dx = px - b.nx * W, dy = py - b.ny * H;
  b.sx = clamp(Math.abs(dx * cos - dy * sin) / r, MIN_STRETCH, MAX_STRETCH);
  b.sy = clamp(Math.abs(dx * sin + dy * cos) / r, MIN_STRETCH, MAX_STRETCH);
}

/**
 * One button, six outlines then the alphabet, then round again. A second
 * button would need a name, and there is nowhere on a phone to put it.
 */
function nextGlyph(b) {
  if (!b.glyph) {
    const i = SHAPES.indexOf(b.shape) + 1;
    if (i < SHAPES.length) { b.shape = SHAPES[i]; return ""; }
    return ALPHABET[0];
  }
  const i = ALPHABET.indexOf(b.glyph) + 1;
  if (i >= ALPHABET.length) { b.shape = SHAPES[0]; return ""; }
  return ALPHABET[i];
}
function doToolbar(label) {
  const b = table[edit.sel];
  if (label === "+ add") {
    table.push(sane({ nx: 0.5, ny: 0.4, size: 0.06, shape: "circle", rot: 0 }));
    edit.sel = table.length - 1;
  } else if (label === "shape" && b) {
    b.glyph = nextGlyph(b);
  } else if (label === "rotate" && b) {
    b.rot += Math.PI / 12;
  } else if (label === "ink" && b) {
    // Cycling fourteen families one tap at a time is no way to pick a colour
    // when the whole palette already exists.
    drawerOpen = true; drawerTarget = "bumper";
    return;
  } else if (label === "size -" && b) {
    b.size = clamp(b.size * 0.88, MIN_SIZE, MAX_SIZE);
  } else if (label === "size +" && b) {
    b.size = clamp(b.size * 1.14, MIN_SIZE, MAX_SIZE);
  } else if (label === "delete" && b) {
    // the drawer cannot stay pointed at a bumper that is going away
    table.splice(edit.sel, 1); edit.sel = -1; closeDrawer();
  } else if (label === "reset") {
    table = DEFAULT_BUMPERS.map(sane); edit.sel = -1; closeDrawer();
  } else if (label === "done") {
    edit.on = false; edit.sel = -1; closeDrawer();
  }
  saveTable();
}

// ---- loop ----------------------------------------------------------------
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (!W || !H) { requestAnimationFrame(frame); return; }
  ctx.clearRect(0, 0, W, H);

  // The sheer scrim. It used to be a CSS background on the body; painting it
  // here instead means one adjustable value, and it behaves the same over a
  // transparent Electron window as it does inside a page.
  // The ground. Sheer paints nothing, so a transparent window keeps showing
  // your desktop through it; any other canvas is laid down solid first. The
  // tint then washes over either one, so it means the same thing in both.
  const ground = canvasColor();
  if (ground) { ctx.fillStyle = ground; ctx.fillRect(0, 0, W, H); }
  if (SCRIMS[ink.scrim] > 0) {
    ctx.fillStyle = "rgba(0,0,0," + SCRIMS[ink.scrim] + ")";
    ctx.fillRect(0, 0, W, H);
  }

  if (screen === "paywall") {
    if (code.open) drawKeypad(); else drawPaywall();
    requestAnimationFrame(frame);
    return;
  }

  if (screen === "title") {
    drawTitle();
    requestAnimationFrame(frame);
    return;
  }

  if (mode === "glass") {
    drawGlass();
    if (stripVisible(now)) drawStrip(now);
    drawMenuButton();
    if (drawerOpen) drawDrawer();
    requestAnimationFrame(frame);
    return;
  }

  if (mode === "bolt") {
    stepBolts(dt);
    drawBolts();
    if (stripVisible(now)) drawStrip(now);
    drawMenuButton();
    if (drawerOpen) drawDrawer();
    requestAnimationFrame(frame);
    return;
  }

  if (mode === "dial") {
    if (!dial.grab) {
      dial.omega *= Math.pow(dial.friction, dt);
      if (Math.abs(dial.omega) < 0.05) dial.omega = 0;
      dial.angle += dial.omega * dt;
      dialDetents();
    }
    drawDial();
  } else {
    const r = ballR();
    const frozen = edit.on && mode === "bumpers";

    if (!ball.dragging && !frozen) {
      const decay = Math.pow(ball.friction, dt);
      ball.vx *= decay; ball.vy *= decay;
      if (Math.hypot(ball.vx, ball.vy) < 4) { ball.vx = 0; ball.vy = 0; }

      // Substep, so a quick flick can't jump a wall or skip a bumper between
      // frames, and so contacts are caught shallow — a deep one picks its
      // escape direction badly.
      const reach = Math.hypot(ball.vx, ball.vy) * dt;
      const steps = clamp(Math.ceil(reach / Math.max(r * 0.25, 1)), 1, 16);
      const h = dt / steps;
      for (let i = 0; i < steps; i++) {
        ball.spin += ball.omega * h;          // turn first, then resolve
        ball.x += ball.vx * h;
        ball.y += ball.vy * h;
        walls();
        if (mode === "bumpers") for (const b of table) bounce(b);
        if (painting()) layTrail();
      }
      // a stroke is finished once the ball is at rest
      if (strokeLive && ball.vx === 0 && ball.vy === 0) settleStroke();
    } else {
      ball.spin += ball.omega * dt;
    }

    // spin runs down on its own, and stops dead while you're holding it
    if (ball.dragging) ball.omega *= Math.pow(0.02, dt);
    ball.omega *= Math.pow(ball.spinFriction, dt);
    if (Math.abs(ball.omega) < 0.02) ball.omega = 0;

    if (painting()) {
      ctx.drawImage(trailCanvas, 0, 0, W, H);
      if (strokeLive) {
        // the live stroke shows at its translucency until it settles
        ctx.save();
        ctx.globalAlpha = inkAlpha();
        ctx.drawImage(strokeCanvas, 0, 0, W, H);
        ctx.restore();
      }
    }
    if (mode === "bumpers") drawTable();

    ctx.save();
    ctx.globalAlpha = inkAlpha();
    drawShape(ball.shape, ball.x, ball.y, r, ball.spin, inkColor(), false);
    ctx.globalAlpha = Math.max(0.5, inkAlpha());
    drawShape(ball.shape, ball.x, ball.y, r, ball.spin, null, true);
    ctx.restore();

    drawMiss(now);
    if (stripVisible(now)) drawStrip(now);
    if (frozen) drawEditUI();
  }

  if (drawerOpen) drawDrawer();
  else drawMenuButton();

  requestAnimationFrame(frame);
}

// Walls, honouring the ball's real outline rather than a circle around it.
function walls() {
  const pts = ballPoints();
  const r = ballR();
  const e = ball.restitution;
  // Extent of the real outline, which for a tumbling polygon changes every
  // frame. Reflect only when the ball is actually heading into the wall: a
  // corner that rotates back into contact would otherwise flip the velocity
  // a second time and pin the ball to the edge.
  let lo0, hi0, lo1, hi1;
  if (!pts) {
    lo0 = ball.x - r; hi0 = ball.x + r; lo1 = ball.y - r; hi1 = ball.y + r;
  } else {
    lo0 = lo1 = Infinity; hi0 = hi1 = -Infinity;
    for (const [x, y] of pts) {
      if (x < lo0) lo0 = x;
      if (x > hi0) hi0 = x;
      if (y < lo1) lo1 = y;
      if (y > hi1) hi1 = y;
    }
  }
  if (lo0 < 0) { ball.x -= lo0;     if (ball.vx < 0) { ball.vx = -ball.vx * e; impartSpin(1, 0); } }
  if (hi0 > W) { ball.x -= hi0 - W; if (ball.vx > 0) { ball.vx = -ball.vx * e; impartSpin(-1, 0); } }
  if (lo1 < 0) { ball.y -= lo1;     if (ball.vy < 0) { ball.vy = -ball.vy * e; impartSpin(0, 1); } }
  if (hi1 > H) { ball.y -= hi1 - H; if (ball.vy > 0) { ball.vy = -ball.vy * e; impartSpin(0, -1); } }
}

// Reflect the ball off one bumper — any convex shape against any other.
/** A round bumper, and a round one pulled out of round. */
function isRound(b) { return !b.glyph && b.shape === "circle"; }

/**
 * How much of a bounce a hit gets, from none at a graze to all of it once it
 * is square enough. Eased at both ends, because a hard edge between following
 * the curve and coming off it is a thing you can feel.
 */
function grip(dot) {
  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp < 1e-4) return 1;
  const t = clamp(Math.abs(dot) / sp / CURVE_BITE, 0, 1);
  return t * t * (3 - 2 * t);
}

function bounce(b) {
  const g = geom(b);
  const bp = ballPoints();
  const r = ballR();
  let hit;
  if (g.kind === "circle") {
    if (!bp) hit = circleVsCircle(ball.x, ball.y, r, g.cx, g.cy, g.r);
    else {
      const inv = circleVsPoly(g.cx, g.cy, g.r, bp);      // bumper against ball
      hit = inv && { nx: -inv.nx, ny: -inv.ny, depth: inv.depth };
    }
  } else {
    // A letter is several convex parts, and the deepest contact is the one
    // that counts.
    const parts = g.kind === "letter" ? g.parts : [g.pts];
    for (const pts of parts) {
      const one = bp ? satPolyPoly(bp, pts) : circleVsPoly(ball.x, ball.y, r, pts);
      if (one && (!hit || one.depth > hit.depth)) hit = one;
    }
  }
  if (!hit) return;

  ball.x += hit.nx * hit.depth;
  ball.y += hit.ny * hit.depth;

  const dot = ball.vx * hit.nx + ball.vy * hit.ny;
  if (dot >= 0) return;
  impartSpin(hit.nx, hit.ny);
  // A flat side is a flat side: it reflects. A round one is followed when it
  // is barely touched, and reflects when it is hit squarely.
  const curve = isRound(b) ? grip(dot) : 1;
  const keep = 1 + (KICK - 1) * curve;      // along the surface
  const give = KICK * curve;                // into it
  const nx = dot * hit.nx, ny = dot * hit.ny;
  ball.vx = (ball.vx - nx) * keep - nx * give;
  ball.vy = (ball.vy - ny) * keep - ny * give;
  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp > MAX_SPEED) { ball.vx *= MAX_SPEED / sp; ball.vy *= MAX_SPEED / sp; }
}

// ---- drawing -------------------------------------------------------------
function circle(x, y, r, fill, rim) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (rim) { ctx.lineWidth = 2; ctx.strokeStyle = RIM; ctx.stroke(); }
}
// Lightning gets a stroke rather than an outline: a triangle said nothing
// about what the row does, and every other glyph is the thing itself.
const BOLT_GLYPH = [[-0.5, -0.9], [0.3, -0.3], [-0.3, 0.3], [0.5, 0.9]];
// A pane with a break in it: a square, and three cracks leaving one point.
const GLASS_GLYPH = [[-0.75, -0.55], [0.8, 0.3], [-0.2, 0.85]];
function drawGlassGlyph(cx, cy, r, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = r * 0.16;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.strokeRect(cx - r * 0.85, cy - r * 0.85, r * 1.7, r * 1.7);
  ctx.beginPath();
  for (const [x, y] of GLASS_GLYPH) {
    ctx.moveTo(cx - r * 0.1, cy - r * 0.05);
    ctx.lineTo(cx + x * r, cy + y * r);
  }
  ctx.stroke();
  ctx.restore();
}

function drawBoltGlyph(cx, cy, r, color) {
  ctx.save();
  ctx.beginPath();
  BOLT_GLYPH.forEach(([x, y], i) =>
    (i ? ctx.lineTo(cx + x * r, cy + y * r) : ctx.moveTo(cx + x * r, cy + y * r)));

  ctx.lineWidth = r * 0.3;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.stroke();
  ctx.restore();
}

function drawShape(shape, cx, cy, r, rot, fill, rim) {
  const pts = shapePoints(shape, cx, cy, r, rot);
  if (!pts) return circle(cx, cy, r, fill, rim);
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();

  if (rim) { ctx.lineWidth = 2; ctx.strokeStyle = RIM; ctx.stroke(); }
}
function outline(g, fill, rim) {

  ctx.beginPath();
  const parts = g.kind === "letter" ? g.loops : [g.pts];
  for (const pts of parts) {
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.closePath();
  }
  // Even-odd, so the counter in an A or an O stays a hole.

}
function drawTable() {
  table.forEach((b) => {
    const g = geom(b);
    ctx.save();

      // shows where two boxes meet and the counter in an A stays a hole.
      ctx.beginPath();
      for (const p of g.loops) {
        p.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
        ctx.closePath();
