<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;   /* the scrim is painted by the canvas now */
    cursor: default;
    user-select: none;
  }
  canvas { display: block; position: fixed; inset: 0; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Nonsense desktop renderer — four toys.
//   BALL    : click-drag anywhere and release to flick; bounces off edges.
//             G turns on catching — then you have to land on the ball to
//             grab it, and it stays where you caught it.
//   DIAL    : drag around center to spin, or scroll wheel from anywhere.
//   BUMPERS : the ball plus a table of bumpers that kick it back. The table
//             is editable (E) — move, resize, rotate, reshape, add, delete —
//             and the ball can paint while it plays (P).
//   PAINT   : the ball leaves a trail; colour, size and shape along the
//             bottom, C clears the canvas.
// The ball has eight sizes and six shapes, live in every mode: [ and ] resize
// it, S cycles its shape, the wheel resizes it in ball and bumpers. A
// non-round ball tumbles — impacts impart spin.
// The palette drawer (,) holds thirty-six inks, five levels of translucency
// for the ink, and the screen tint — how sheer the whole pane is.
// Tab cycles modes. 1-4 jumps to a mode. Esc quits.

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// Persistent trail layer, plus a scratch layer for the stroke being laid down
// right now. Translucent ink has to be composited once per stroke: stroking
// segment by segment at low alpha makes every round cap overlap the last and
// re-darken it, so a 15% trail comes out looking solid and beaded.
const trailCanvas = document.createElement("canvas");
const trailCtx = trailCanvas.getContext("2d");
const strokeCanvas = document.createElement("canvas");
const strokeCtx = strokeCanvas.getContext("2d");
let strokeLive = false;

const GRAPHITE = "#3a3a3c";
const RIM = "rgba(0,0,0,0.35)";

// ---- the palette ---------------------------------------------------------
// Nine families, four tones each. The middle tone of each family is a hand
// picked colour — the original six are still in here, in their own columns —
// and the rest are mixed toward white or black from it, so a family holds its
// hue across the range and nothing turns garish.
const FAMILIES = [
  { name: "graphite", base: "#3a3a3c" },
  { name: "bone",     base: "#c9c0ab" },
  { name: "oxblood",  base: "#702929" },
  { name: "rust",     base: "#9c5b3c" },
  { name: "ochre",    base: "#b08940" },
  { name: "moss",     base: "#5c6e4a" },
  { name: "teal",     base: "#3f6b68" },
  { name: "slate",    base: "#465a78" },
  { name: "plum",     base: "#5c3f5e" },
];
const TONE_MIX = [0.58, 0.28, 0, -0.38];   // + toward white, - toward black
function hexToRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mix(rgb, target, amount) {
  return rgb.map((v, i) => Math.round(v + (target[i] - v) * amount));
}
function toHex(rgb) {
  return "#" + rgb.map(v => clamp(v, 0, 255).toString(16).padStart(2, "0")).join("");
}
const PALETTE = FAMILIES.map(f => {
  const base = hexToRgb(f.base);
  return TONE_MIX.map(m =>
    toHex(m >= 0 ? mix(base, [255, 255, 255], m) : mix(base, [0, 0, 0], -m)));
});

// How solid the ink is, and how sheer the whole pane is. Both are the point of
// the app rather than decoration: Fidget is a sheer thing over your screen.
const ALPHAS = [0.15, 0.3, 0.5, 0.75, 1];
const SCRIMS = [0, 0.06, 0.12, 0.18, 0.25, 0.34];
const ink = { family: 0, tone: 2, alpha: 4, scrim: 2 };   // graphite, solid, 12%
function inkColor() { return PALETTE[ink.family][ink.tone]; }
function inkAlpha() { return ALPHAS[ink.alpha]; }

// Eight steps, from a bead to a grapefruit, as multiples of the base radius.
const SIZES = [0.12, 0.2, 0.3, 0.5, 0.7, 1.0, 1.45, 2.1];
const DEFAULT_SIZE = 5;   // 1.0 — the original ball

const MODES = ["ball", "dial", "bumpers", "paint"];
let mode = "ball";

let W = 0, H = 0, DPR = 1;

// ---- shapes --------------------------------------------------------------
// One table, shared by the ball and the bumpers. Every entry is a convex
// outline on a unit circumradius, so "size" means the same thing whatever
// shape is wearing it.
function ngon(n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
    pts.push([Math.cos(a), Math.sin(a)]);
  }
  return pts;
}
const SHAPES = ["circle", "triangle", "square", "pentagon", "hexagon", "bar"];
const UNIT = {
  circle: null,
  triangle: ngon(3),
  square: [[-0.707, -0.707], [0.707, -0.707], [0.707, 0.707], [-0.707, 0.707]],
  pentagon: ngon(5),
  hexagon: ngon(6),
  bar: [[-1.35, -0.5], [1.35, -0.5], [1.35, 0.5], [-1.35, 0.5]],
};
// How much ground a shape actually covers, as a fraction of its circumradius
// — the inradius. A bar is long but narrow, and should not ink a stripe as
// wide as it is long.
const COVER = { circle: 1, triangle: 0.5, square: 0.707, pentagon: 0.809,
              hexagon: 0.866, bar: 0.5 };
function inkWidth() { return ballR() * 2 * (COVER[ball.shape] || 1); }

// World-space outline, or null for a circle.
function shapePoints(shape, cx, cy, r, rot) {
  const u = UNIT[shape];
  if (!u) return null;
  const cos = Math.cos(rot), sin = Math.sin(rot);
  return u.map(([x, y]) => {
    const px = x * r, py = y * r;
    return [cx + px * cos - py * sin, cy + px * sin + py * cos];
  });
}

// ---- ball (shared by ball, bumpers, paint) -------------------------------
const ball = {
  x: 0, y: 0,
  vx: 0, vy: 0,
  baseR: 0,
  sizeIndex: DEFAULT_SIZE,
  shape: "circle",
  spin: 0, omega: 0,
  placed: false,
  dragging: false,
  mustCatch: false,      // ball mode only: you have to catch it to throw it
  grabDX: 0, grabDY: 0,
  friction: 0.55,
  restitution: 0.82,
  spinFriction: 0.45,
  samples: [],
};
function ballR() { return ball.baseR * SIZES[ball.sizeIndex]; }
function ballPoints() { return shapePoints(ball.shape, ball.x, ball.y, ballR(), ball.spin); }

// A hit off a surface with normal n spins the ball by the tangential part of
// the blow — the reason a square tumbles instead of sliding.
function impartSpin(nx, ny) {
  const r = Math.max(ballR(), 1);
  const t = ball.vx * -ny + ball.vy * nx;      // velocity along the surface
  ball.omega = clamp(ball.omega + (t / r) * 0.5, -30, 30);
}

// With catching on you have to actually land on the ball. Small balls get a
// bit of slack so a bead is not a pixel-hunt; a big one you simply have to
// hit. Measured against the real outline, so a bar is caught along the bar.
function catchSlack() { return Math.max(0, 20 - ballR() * 0.35); }
function withinCatch(px, py) {
  const pts = ballPoints();
  const slack = catchSlack();
  if (!pts) return Math.hypot(px - ball.x, py - ball.y) <= ballR() + slack;
  if (pointInPoly(px, py, pts)) return true;
  let best = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
    const [qx, qy] = closestOnSegment(px, py, ax, ay, bx, by);
    best = Math.min(best, Math.hypot(px - qx, py - qy));
  }
  return best <= slack;
}
// A missed grab leaves a ring for a moment. No sound, no score — just enough
// to tell you that you reached and the ball was not there.
const miss = { x: 0, y: 0, t: -1e9 };
function catching() { return mode === "ball" && ball.mustCatch && !edit.on; }

// ---- dial ----------------------------------------------------------------
const dial = {
  angle: 0, omega: 0,
  r: 0,
  grab: false,
  lastAngle: 0, lastTime: 0,
  friction: 0.35,
};

// ---- paint ---------------------------------------------------------------
const paint = {
  lastX: 0, lastY: 0, started: false,
  onBumpers: true,          // the ball paints while the bumper table plays
  stripH: () => H * 0.07,
};
// Paint is live in paint mode, and in bumpers mode when it's switched on.
// Never while editing the table — the strip would eat the edit taps.
function painting() {
  if (edit.on) return false;
  return mode === "paint" || (mode === "bumpers" && paint.onBumpers);
}

// ---- bumpers -------------------------------------------------------------
// Each bumper is normalised: nx/ny are fractions of the field, size is a
// fraction of its short edge, so a table survives a resize or a new display.
const DEFAULT_BUMPERS = [
  { nx: 0.25, ny: 0.30, size: 0.055, shape: "circle", rot: 0 },
  { nx: 0.75, ny: 0.30, size: 0.055, shape: "circle", rot: 0 },
  { nx: 0.50, ny: 0.50, size: 0.068, shape: "hexagon", rot: 0 },
  { nx: 0.25, ny: 0.72, size: 0.055, shape: "bar",    rot: 0 },
  { nx: 0.75, ny: 0.72, size: 0.055, shape: "bar",    rot: 0 },
];
const KICK = 1.06;
const MAX_SPEED = 6000;
const MIN_SIZE = 0.018, MAX_SIZE = 0.30;

let table = loadTable();

const edit = {
  on: false,
  sel: -1,
  drag: null,       // "move" | "resize" | "rotate"
  grabDX: 0, grabDY: 0,
};

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function loadTable() {
  try {
    const raw = localStorage.getItem("nonsense.bumpers") ||
                localStorage.getItem("fidget.bumpers");   // carried over from the old name
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length) return parsed.map(sane);
    }
  } catch (e) { /* private mode, blocked storage — defaults are fine */ }
  return DEFAULT_BUMPERS.map(sane);
}
function saveTable() {
  try { localStorage.setItem("nonsense.bumpers", JSON.stringify(table)); } catch (e) {}
}
function saveBall() {
  try {
    localStorage.setItem("nonsense.ball",
      JSON.stringify({ shape: ball.shape, sizeIndex: ball.sizeIndex,
                       mustCatch: ball.mustCatch }));
  } catch (e) {}
}
function saveInk() {
  try { localStorage.setItem("nonsense.ink", JSON.stringify(ink)); } catch (e) {}
}
function loadInk() {
  try {
    const raw = localStorage.getItem("nonsense.ink") || localStorage.getItem("fidget.ink");
    if (!raw) return;
    const p = JSON.parse(raw);
    ink.family = clamp(p.family | 0, 0, FAMILIES.length - 1);
    ink.tone   = clamp(p.tone   | 0, 0, TONE_MIX.length - 1);
    ink.alpha  = clamp(p.alpha  | 0, 0, ALPHAS.length - 1);
    ink.scrim  = clamp(p.scrim  | 0, 0, SCRIMS.length - 1);
  } catch (e) {}
}
function loadBall() {
  try {
    const raw = localStorage.getItem("nonsense.ball") || localStorage.getItem("fidget.ball");
    if (!raw) return;
    const p = JSON.parse(raw);
    if (SHAPES.includes(p.shape)) ball.shape = p.shape;
    if (Number.isInteger(p.sizeIndex) && p.sizeIndex >= 0 && p.sizeIndex < SIZES.length)
      ball.sizeIndex = p.sizeIndex;
    ball.mustCatch = !!p.mustCatch;
  } catch (e) {}
}
function sane(b) {
  return {
    nx: clamp(+b.nx || 0.5, 0, 1),
    ny: clamp(+b.ny || 0.5, 0, 1),
    size: clamp(+b.size || 0.055, MIN_SIZE, MAX_SIZE),
    shape: SHAPES.includes(b.shape) ? b.shape : "circle",
    rot: +b.rot || 0,
  };
}
loadBall();
loadInk();

// Pixel geometry for a bumper: a circle, or a convex polygon in world space.
function geom(b) {
  const m = Math.min(W, H);
  const cx = b.nx * W, cy = b.ny * H, r = b.size * m;
  const pts = shapePoints(b.shape, cx, cy, r, b.rot);
  return pts ? { kind: "poly", cx, cy, r, pts } : { kind: "circle", cx, cy, r };
}

// ---- convex collision ----------------------------------------------------
function closestOnSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  if (len2 < 1e-9) return [ax, ay];
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / len2, 0, 1);
  return [ax + t * dx, ay + t * dy];
}
function pointInPoly(px, py, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > py) !== (yj > py) &&
        px < ((xj - xi) * (py - yi)) / (yj - yi + 1e-12) + xi) inside = !inside;
  }
  return inside;
}
function pointInBumper(px, py, b) {
  const g = geom(b);
  if (g.kind === "circle") return Math.hypot(px - g.cx, py - g.cy) <= g.r;
  return pointInPoly(px, py, g.pts);
}
function project(pts, nx, ny) {
  let lo = Infinity, hi = -Infinity;
  for (const [x, y] of pts) {
    const d = x * nx + y * ny;
    if (d < lo) lo = d;
    if (d > hi) hi = d;
  }
  return [lo, hi];
}
function centroid(pts) {
  let x = 0, y = 0;
  for (const p of pts) { x += p[0]; y += p[1]; }
  return [x / pts.length, y / pts.length];
}

// Separating-axis test. Returns the shallowest push that frees A from B.
function satPolyPoly(A, B) {
  let depth = Infinity, nx = 0, ny = 0;
  for (const pts of [A, B]) {
    for (let i = 0; i < pts.length; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
      let ex = -(by - ay), ey = bx - ax;
      const len = Math.hypot(ex, ey);
      if (len < 1e-9) continue;
      ex /= len; ey /= len;
      const [aLo, aHi] = project(A, ex, ey);
      const [bLo, bHi] = project(B, ex, ey);
      if (aHi < bLo || bHi < aLo) return null;      // a gap: no contact
      const o = Math.min(aHi - bLo, bHi - aLo);
      if (o < depth) { depth = o; nx = ex; ny = ey; }
    }
  }
  const [acx, acy] = centroid(A), [bcx, bcy] = centroid(B);
  if ((acx - bcx) * nx + (acy - bcy) * ny < 0) { nx = -nx; ny = -ny; }
  return { nx, ny, depth };
}
function circleVsPoly(cx, cy, r, pts) {
  let qx = 0, qy = 0, best = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
    const [px, py] = closestOnSegment(cx, cy, ax, ay, bx, by);
    const d = Math.hypot(cx - px, cy - py);
    if (d < best) { best = d; qx = px; qy = py; }
  }
  const inside = pointInPoly(cx, cy, pts);
  if (!inside && best >= r) return null;
  if (best < 1e-6) return null;
  const s = inside ? -1 : 1;
  return { nx: s * (cx - qx) / best, ny: s * (cy - qy) / best,
           depth: inside ? r + best : r - best };
}
function circleVsCircle(ax, ay, ar, bx, by, br) {
  const dx = ax - bx, dy = ay - by;
  const d = Math.hypot(dx, dy);
  if (d >= ar + br || d <= 0.001) return null;
  return { nx: dx / d, ny: dy / d, depth: ar + br - d };
}

// ---- coordinates ---------------------------------------------------------
// The Electron window owns the whole display, so the original read e.clientX
// straight through. Inside a page the canvas can sit at an offset or be
// scaled by a parent, so map every pointer through the canvas's own box.
function local(e) {
  const r = canvas.getBoundingClientRect();
  const sx = r.width  ? W / r.width  : 1;
  const sy = r.height ? H / r.height : 1;
  return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
}

function resize() {
  DPR = window.devicePixelRatio || 1;
  const w = canvas.offsetWidth || window.innerWidth;
  const h = canvas.offsetHeight || window.innerHeight;
  if (!w || !h) return;              // laid out at zero (hidden pane) — wait
  const had = W > 0 && H > 0;

  // keep whatever has been painted across the resize
  let keep = null, keepStroke = null;
  if (had && trailCanvas.width) {
    keep = document.createElement("canvas");
    keep.width = trailCanvas.width; keep.height = trailCanvas.height;
    keep.getContext("2d").drawImage(trailCanvas, 0, 0);
    keepStroke = document.createElement("canvas");
    keepStroke.width = strokeCanvas.width; keepStroke.height = strokeCanvas.height;
    keepStroke.getContext("2d").drawImage(strokeCanvas, 0, 0);
  }

  W = w; H = h;
  canvas.width = Math.max(1, Math.round(W * DPR));
  canvas.height = Math.max(1, Math.round(H * DPR));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  trailCanvas.width = Math.max(1, Math.round(W * DPR));
  trailCanvas.height = Math.max(1, Math.round(H * DPR));
  trailCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  strokeCanvas.width = trailCanvas.width;
  strokeCanvas.height = trailCanvas.height;
  strokeCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (keep) trailCtx.drawImage(keep, 0, 0, W, H);
  if (keepStroke) strokeCtx.drawImage(keepStroke, 0, 0, W, H);

  // Derived sizes have to follow the field. Computing them once at load meant
  // a pane that was hidden or zero-width at startup got a radius of 0 — an
  // invisible ball with nothing to grab.
  ball.baseR = Math.min(W, H) * 0.05;
  dial.r = Math.min(W, H) * 0.22;
  if (!ball.placed) { ball.x = W / 2; ball.y = H / 2; ball.placed = true; }
}
window.addEventListener("resize", resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
resize();

function layTrail() {
  if (!paint.started) {
    paint.lastX = ball.x; paint.lastY = ball.y; paint.started = true;
    return;
  }
  if (ball.x === paint.lastX && ball.y === paint.lastY) return;
  // full opacity into the scratch layer; the alpha is applied when the whole
  // stroke settles, so overlapping caps never stack up
  strokeCtx.strokeStyle = inkColor();
  strokeCtx.lineWidth = inkWidth();
  strokeCtx.lineCap = "round";
  strokeCtx.beginPath();
  strokeCtx.moveTo(paint.lastX, paint.lastY);
  strokeCtx.lineTo(ball.x, ball.y);
  strokeCtx.stroke();
  paint.lastX = ball.x; paint.lastY = ball.y;
  strokeLive = true;
}
// Fold the live stroke down onto the trail at its translucency. Called when
// the ball comes to rest, and before anything that would change the ink.
function settleStroke() {
  if (!strokeLive) return;
  trailCtx.save();
  trailCtx.globalAlpha = inkAlpha();
  trailCtx.drawImage(strokeCanvas, 0, 0, W, H);
  trailCtx.restore();
  strokeCtx.clearRect(0, 0, W, H);
  strokeLive = false;
}
function clearTrail() {
  trailCtx.clearRect(0, 0, W, H);
  strokeCtx.clearRect(0, 0, W, H);
  strokeLive = false;
  paint.started = false;
}

function angleTo(x, y) {
  return Math.atan2(y - H / 2, x - W / 2);
}

// ---- the bottom strip ----------------------------------------------------
// In paint it carries colours, sizes and shapes. Everywhere else the ball
// controls surface only for a moment after you touch them, so the field goes
// back to being empty.
let stripFlash = 0;
function stripVisible(now) {
  if (drawerOpen) return false;      // the drawer supersedes it
  return painting() || now < stripFlash;
}
// The ball carries the ink in every mode now, so the strip shows all three
// everywhere — colour, size, shape. Colour is one swatch per family at the
// tone you are on; the drawer holds the whole palette.
function stripLayout() {
  return [{ kind: "color", x0: 0,        x1: W * 0.46, items: FAMILIES },
          { kind: "size",  x0: W * 0.46, x1: W * 0.73, items: SIZES },
          { kind: "shape", x0: W * 0.73, x1: W,        items: SHAPES }];
}
function stripTap(x) {
  for (const z of stripLayout()) {
    if (x < z.x0 || x > z.x1) continue;
    const i = clamp(Math.floor(((x - z.x0) / (z.x1 - z.x0)) * z.items.length),
                    0, z.items.length - 1);
    if (z.kind === "color") {
      // tapping the family you are already on opens the full palette
      if (i === ink.family) drawerOpen = true;
      else { settleStroke(); ink.family = i; saveInk(); }
    }
    if (z.kind === "size") { ball.sizeIndex = i; saveBall(); }
    if (z.kind === "shape") { ball.shape = SHAPES[i]; ball.spin = 0; saveBall(); }
    return true;
  }
  return false;
}

// ---- the palette drawer --------------------------------------------------
// Canvas-drawn like the edit toolbar, for the same reason: nothing hosting the
// page can cover it, and Electron and the browser get the identical thing.
let drawerOpen = false;
function drawerBox() {
  const cols = FAMILIES.length, rows = TONE_MIX.length;
  const w = Math.min(W * 0.94, 760);
  const pad = 18, label = 15, rowH = 30, gap = 14;
  const cell = Math.min((w - pad * 2) / cols, 44);
  const gridW = cell * cols, gridH = cell * rows;
  const h = pad + label + gridH + gap + label + rowH + gap + label + rowH + pad;
  const x = (W - w) / 2, y = clamp(H - h - 14, 8, H);
  const gx = x + (w - gridW) / 2;
  const gy = y + pad + label;
  const ay = gy + gridH + gap + label;
  const sy = ay + rowH + gap + label;
  return { x, y, w, h, pad, cell, cols, rows, gx, gy, gridW, gridH, ay, sy, rowH, label };
}
function drawerChips(y, n, box) {
  const w = Math.min(box.gridW / n - 6, 96);
  const step = box.gridW / n;
  return Array.from({ length: n }, (_, i) => ({
    i, x: box.gx + step * i + (step - w) / 2, y, w, h: box.rowH,
  }));
}
function drawerHit(px, py) {
  const b = drawerBox();
  if (px < b.x || px > b.x + b.w || py < b.y || py > b.y + b.h) return "outside";
  if (px >= b.gx && px <= b.gx + b.gridW && py >= b.gy && py <= b.gy + b.gridH) {
    const c = clamp(Math.floor((px - b.gx) / b.cell), 0, b.cols - 1);
    const r = clamp(Math.floor((py - b.gy) / b.cell), 0, b.rows - 1);
    settleStroke();
    ink.family = c; ink.tone = r; saveInk();
    return "ink";
  }
  for (const c of drawerChips(b.ay, ALPHAS.length, b))
    if (px >= c.x && px <= c.x + c.w && py >= c.y && py <= c.y + c.h) {
      settleStroke(); ink.alpha = c.i; saveInk(); return "alpha";
    }
  for (const c of drawerChips(b.sy, SCRIMS.length, b))
    if (px >= c.x && px <= c.x + c.w && py >= c.y && py <= c.y + c.h) {
      ink.scrim = c.i; saveInk(); return "scrim";
    }
  return "panel";
}

// ---- input ---------------------------------------------------------------
canvas.addEventListener("pointerdown", (e) => {
  canvas.setPointerCapture(e.pointerId);
  const p = local(e);

  if (drawerOpen) {
    if (drawerHit(p.x, p.y) === "outside") drawerOpen = false;
    return;
  }

  if (edit.on && mode === "bumpers") {
    const hit = toolbarHit(p.x, p.y);
    if (hit) { doToolbar(hit.label); return; }
    if (edit.sel >= 0 && table[edit.sel]) {
      const hs = handles(table[edit.sel]);
      if (Math.hypot(p.x - hs.resize[0], p.y - hs.resize[1]) < 14) { edit.drag = "resize"; return; }
      if (Math.hypot(p.x - hs.rotate[0], p.y - hs.rotate[1]) < 14) { edit.drag = "rotate"; return; }
    }
    for (let i = table.length - 1; i >= 0; i--) {
      if (pointInBumper(p.x, p.y, table[i])) {
        edit.sel = i; edit.drag = "move";
        edit.grabDX = p.x - table[i].nx * W;
        edit.grabDY = p.y - table[i].ny * H;
        return;
      }
    }
    edit.sel = -1;
    return;
  }

  if (mode !== "dial" && stripVisible(performance.now()) && p.y > H - paint.stripH()) {
    if (stripTap(p.x)) { stripFlash = performance.now() + 2200; return; }
  }
  if (mode === "dial") {
    dial.grab = true;
    dial.omega = 0;
    dial.lastAngle = angleTo(p.x, p.y);
    dial.lastTime = performance.now();
  } else {
    if (catching() && !withinCatch(p.x, p.y)) {
      miss.x = p.x; miss.y = p.y; miss.t = performance.now();
      return;                       // reached for it and it wasn't there
    }
    // Caught, so it stays where you caught it. Snapping it to the cursor
    // would undo the catch you just made.
    const caught = catching();
    ball.grabDX = caught ? ball.x - p.x : 0;
    ball.grabDY = caught ? ball.y - p.y : 0;
    ball.dragging = true;
    if (!caught) { ball.x = p.x; ball.y = p.y; }
    ball.vx = 0; ball.vy = 0;
    ball.omega = 0;
    ball.samples = [{ x: p.x, y: p.y, t: performance.now() }];
    if (painting()) {
      paint.lastX = ball.x; paint.lastY = ball.y; paint.started = true;
    }
  }
});

canvas.addEventListener("pointermove", (e) => {
  const p = local(e);

  if (edit.on && mode === "bumpers") {
    const b = table[edit.sel];
    if (!b || !edit.drag) return;
    if (edit.drag === "move") {
      b.nx = clamp((p.x - edit.grabDX) / W, 0, 1);
      b.ny = clamp((p.y - edit.grabDY) / H, 0, 1);
    } else if (edit.drag === "resize") {
      const d = Math.hypot(p.x - b.nx * W, p.y - b.ny * H);
      b.size = clamp(d / Math.min(W, H), MIN_SIZE, MAX_SIZE);
    } else if (edit.drag === "rotate") {
      b.rot = Math.atan2(p.y - b.ny * H, p.x - b.nx * W) - Math.PI / 2;
    }
    return;
  }

  if (mode === "dial") {
    if (!dial.grab) return;
    const a = angleTo(p.x, p.y);
    let d = a - dial.lastAngle;
    while (d > Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    const now = performance.now();
    const dt = Math.max(now - dial.lastTime, 1) / 1000;
    dial.angle += d;
    dial.omega = d / dt;
    dial.lastAngle = a;
    dial.lastTime = now;
  } else if (ball.dragging) {
    ball.x = p.x + ball.grabDX; ball.y = p.y + ball.grabDY;
    const now = performance.now();
    ball.samples.push({ x: p.x, y: p.y, t: now });
    while (ball.samples.length > 2 && now - ball.samples[0].t > 100)
      ball.samples.shift();
    if (painting()) layTrail();
  }
});

canvas.addEventListener("pointerup", () => {
  if (edit.on) { if (edit.drag) saveTable(); edit.drag = null; return; }
  if (mode !== "dial" && ball.dragging) {
    ball.dragging = false;
    const s = ball.samples;
    if (s.length >= 2) {
      const a = s[0], b = s[s.length - 1];
      const dt = Math.max(b.t - a.t, 1) / 1000;
      ball.vx = (b.x - a.x) / dt;
      ball.vy = (b.y - a.y) / dt;
      // a flick sets it turning, the way a thrown object does
      ball.omega = clamp(ball.omega + (ball.vx / Math.max(ballR(), 1)) * 0.25, -30, 30);
    }
  }
  dial.grab = false;
});

window.addEventListener("wheel", (e) => {
  if (mode === "dial") { dial.omega += e.deltaY * 0.02; return; }
  if (edit.on) return;
  // the wheel resizes the ball wherever the ball is the toy
  const dir = e.deltaY > 0 ? -1 : 1;
  ball.sizeIndex = clamp(ball.sizeIndex + dir, 0, SIZES.length - 1);
  stripFlash = performance.now() + 2200;
  saveBall();
});

window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();

  if (e.key === "Escape") {
    if (drawerOpen) { drawerOpen = false; return; }
    if (edit.on) { edit.on = false; edit.sel = -1; return; }
    window.nonsense ? window.nonsense.quit() : window.close();
  }
  if (e.key === ",") { drawerOpen = !drawerOpen; return; }
  if (drawerOpen) {
    // while the drawer is up the number keys pick a tone
    const t = parseInt(e.key, 10);
    if (t >= 1 && t <= TONE_MIX.length) { settleStroke(); ink.tone = t - 1; saveInk(); }
    if (k === "a") { settleStroke(); ink.alpha = (ink.alpha + 1) % ALPHAS.length; saveInk(); }
    if (k === "t") { ink.scrim = (ink.scrim + 1) % SCRIMS.length; saveInk(); }
    return;
  }
  if (e.key === "Tab") {
    e.preventDefault();
    edit.on = false;
    mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
  }

  const n = parseInt(e.key, 10);
  if (edit.on && mode === "bumpers") {
    // while editing, the number keys pick a bumper shape instead of a mode
    if (n >= 1 && n <= SHAPES.length && table[edit.sel]) {
      table[edit.sel].shape = SHAPES[n - 1]; saveTable();
    }
    if (k === "a") doToolbar("+ add");
    if (e.key === "Delete" || e.key === "Backspace") doToolbar("delete");
    if (k === "r") doToolbar("rotate");
    if (k === "[") doToolbar("size -");
    if (k === "]") doToolbar("size +");
  } else {
    if (n >= 1 && n <= MODES.length) mode = MODES[n - 1];
    // the ball's own size and shape, live in every mode
    if (k === "[" || k === "]") {
      ball.sizeIndex = clamp(ball.sizeIndex + (k === "]" ? 1 : -1), 0, SIZES.length - 1);
      stripFlash = performance.now() + 2200;
      saveBall();
    }
    if (k === "g" && mode === "ball") { ball.mustCatch = !ball.mustCatch; saveBall(); }
    if (k === "a") {
      settleStroke();
      ink.alpha = (ink.alpha + (e.shiftKey ? -1 : 1) + ALPHAS.length) % ALPHAS.length;
      saveInk();
    }
    if (k === "t") {
      ink.scrim = (ink.scrim + (e.shiftKey ? -1 : 1) + SCRIMS.length) % SCRIMS.length;
      saveInk();
    }
    if (k === "s") {
      const step = e.shiftKey ? -1 : 1;
      ball.shape = SHAPES[(SHAPES.indexOf(ball.shape) + step + SHAPES.length) % SHAPES.length];
      ball.spin = 0;
      stripFlash = performance.now() + 2200;
      saveBall();
    }
  }

  if (k === "e" && mode === "bumpers") { edit.on = !edit.on; edit.sel = -1; }
  if (k === "p" && mode === "bumpers") { paint.onBumpers = !paint.onBumpers; }
  if (k === "c" && painting()) clearTrail();
});

// ---- edit toolbar --------------------------------------------------------
// Drawn on the canvas rather than in the DOM: it can't be covered by whatever
// chrome is hosting the page, and it works the same in Electron and a browser.
function toolbar() {
  const pad = 10, h = 30, y = 14;
  const labels = ["+ add", "shape", "rotate", "size -", "size +", "delete", "reset", "done"];
  ctx.font = "500 12px ui-monospace, Menlo, Consolas, monospace";
  let x = 14;
  return labels.map((label) => {
    const w = ctx.measureText(label).width + pad * 2;
    const r = { label, x, y, w, h };
    x += w + 6;
    return r;
  });
}
function toolbarHit(px, py) {
  return toolbar().find(b => px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h);
}
function handles(b) {
  const g = geom(b);
  const cos = Math.cos(b.rot), sin = Math.sin(b.rot);
  return {
    resize: [g.cx + g.r * cos, g.cy + g.r * sin],
    rotate: [g.cx - (g.r + 26) * sin, g.cy + (g.r + 26) * cos],
  };
}
function doToolbar(label) {
  const b = table[edit.sel];
  if (label === "+ add") {
    table.push(sane({ nx: 0.5, ny: 0.4, size: 0.06, shape: "circle", rot: 0 }));
    edit.sel = table.length - 1;
  } else if (label === "shape" && b) {
    b.shape = SHAPES[(SHAPES.indexOf(b.shape) + 1) % SHAPES.length];
  } else if (label === "rotate" && b) {
    b.rot += Math.PI / 12;
  } else if (label === "size -" && b) {
    b.size = clamp(b.size * 0.88, MIN_SIZE, MAX_SIZE);
  } else if (label === "size +" && b) {
    b.size = clamp(b.size * 1.14, MIN_SIZE, MAX_SIZE);
  } else if (label === "delete" && b) {
    table.splice(edit.sel, 1); edit.sel = -1;
  } else if (label === "reset") {
    table = DEFAULT_BUMPERS.map(sane); edit.sel = -1;
  } else if (label === "done") {
    edit.on = false; edit.sel = -1;
  }
  saveTable();
}

// ---- loop ----------------------------------------------------------------
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (!W || !H) { requestAnimationFrame(frame); return; }
  ctx.clearRect(0, 0, W, H);

  // The sheer scrim. It used to be a CSS background on the body; painting it
  // here instead means one adjustable value, and it behaves the same over a
  // transparent Electron window as it does inside a page.
  if (SCRIMS[ink.scrim] > 0) {
    ctx.fillStyle = "rgba(0,0,0," + SCRIMS[ink.scrim] + ")";
    ctx.fillRect(0, 0, W, H);
  }

  if (mode === "dial") {
    if (!dial.grab) {
      dial.omega *= Math.pow(dial.friction, dt);
      if (Math.abs(dial.omega) < 0.05) dial.omega = 0;
      dial.angle += dial.omega * dt;
    }
    const cx = W / 2, cy = H / 2;
    ctx.save();
    ctx.globalAlpha = inkAlpha();
    circle(cx, cy, dial.r, inkColor(), false);
    ctx.globalAlpha = Math.max(0.5, inkAlpha());
    circle(cx, cy, dial.r, null, true);
    circle(cx + Math.cos(dial.angle) * dial.r * 0.8,
           cy + Math.sin(dial.angle) * dial.r * 0.8,
           dial.r * 0.06, null, true);
    ctx.restore();
  } else {
    const r = ballR();
    const frozen = edit.on && mode === "bumpers";

    if (!ball.dragging && !frozen) {
      const decay = Math.pow(ball.friction, dt);
      ball.vx *= decay; ball.vy *= decay;
      if (Math.hypot(ball.vx, ball.vy) < 4) { ball.vx = 0; ball.vy = 0; }

      // Substep, so a quick flick can't jump a wall or skip a bumper between
      // frames, and so contacts are caught shallow — a deep one picks its
      // escape direction badly.
      const reach = Math.hypot(ball.vx, ball.vy) * dt;
      const steps = clamp(Math.ceil(reach / Math.max(r * 0.25, 1)), 1, 16);
      const h = dt / steps;
      for (let i = 0; i < steps; i++) {
        ball.spin += ball.omega * h;          // turn first, then resolve
        ball.x += ball.vx * h;
        ball.y += ball.vy * h;
        walls();
        if (mode === "bumpers") for (const b of table) bounce(b);
        if (painting()) layTrail();
      }
      // a stroke is finished once the ball is at rest
      if (strokeLive && ball.vx === 0 && ball.vy === 0) settleStroke();
    } else {
      ball.spin += ball.omega * dt;
    }

    // spin runs down on its own, and stops dead while you're holding it
    if (ball.dragging) ball.omega *= Math.pow(0.02, dt);
    ball.omega *= Math.pow(ball.spinFriction, dt);
    if (Math.abs(ball.omega) < 0.02) ball.omega = 0;

    if (painting()) {
      ctx.drawImage(trailCanvas, 0, 0, W, H);
      if (strokeLive) {
        // the live stroke shows at its translucency until it settles
        ctx.save();
        ctx.globalAlpha = inkAlpha();
        ctx.drawImage(strokeCanvas, 0, 0, W, H);
        ctx.restore();
      }
    }
    if (mode === "bumpers") drawTable();

    ctx.save();
    ctx.globalAlpha = inkAlpha();
    drawShape(ball.shape, ball.x, ball.y, r, ball.spin, inkColor(), false);
    ctx.globalAlpha = Math.max(0.5, inkAlpha());
    drawShape(ball.shape, ball.x, ball.y, r, ball.spin, null, true);
    ctx.restore();

    drawMiss(now);
    if (stripVisible(now)) drawStrip(now);
    if (frozen) drawEditUI();
  }

  if (drawerOpen) drawDrawer();

  requestAnimationFrame(frame);
}

// Walls, honouring the ball's real outline rather than a circle around it.
function walls() {
  const pts = ballPoints();
  const r = ballR();
  const e = ball.restitution;
  // Extent of the real outline, which for a tumbling polygon changes every
  // frame. Reflect only when the ball is actually heading into the wall: a
  // corner that rotates back into contact would otherwise flip the velocity
  // a second time and pin the ball to the edge.
  let lo0, hi0, lo1, hi1;
  if (!pts) {
    lo0 = ball.x - r; hi0 = ball.x + r; lo1 = ball.y - r; hi1 = ball.y + r;
  } else {
    lo0 = lo1 = Infinity; hi0 = hi1 = -Infinity;
    for (const [x, y] of pts) {
      if (x < lo0) lo0 = x;
      if (x > hi0) hi0 = x;
      if (y < lo1) lo1 = y;
      if (y > hi1) hi1 = y;
    }
  }
  if (lo0 < 0) { ball.x -= lo0;     if (ball.vx < 0) { ball.vx = -ball.vx * e; impartSpin(1, 0); } }
  if (hi0 > W) { ball.x -= hi0 - W; if (ball.vx > 0) { ball.vx = -ball.vx * e; impartSpin(-1, 0); } }
  if (lo1 < 0) { ball.y -= lo1;     if (ball.vy < 0) { ball.vy = -ball.vy * e; impartSpin(0, 1); } }
  if (hi1 > H) { ball.y -= hi1 - H; if (ball.vy > 0) { ball.vy = -ball.vy * e; impartSpin(0, -1); } }
}

// Reflect the ball off one bumper — any convex shape against any other.
function bounce(b) {
  const g = geom(b);
  const bp = ballPoints();
  const r = ballR();
  let hit;
  if (!bp && g.kind === "circle")      hit = circleVsCircle(ball.x, ball.y, r, g.cx, g.cy, g.r);
  else if (!bp)                        hit = circleVsPoly(ball.x, ball.y, r, g.pts);
  else if (g.kind === "circle") {
    const inv = circleVsPoly(g.cx, g.cy, g.r, bp);      // bumper against ball
    hit = inv && { nx: -inv.nx, ny: -inv.ny, depth: inv.depth };
  } else                               hit = satPolyPoly(bp, g.pts);
  if (!hit) return;

  ball.x += hit.nx * hit.depth;
  ball.y += hit.ny * hit.depth;

  const dot = ball.vx * hit.nx + ball.vy * hit.ny;
  if (dot >= 0) return;
  impartSpin(hit.nx, hit.ny);
  ball.vx = (ball.vx - 2 * dot * hit.nx) * KICK;
  ball.vy = (ball.vy - 2 * dot * hit.ny) * KICK;
  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp > MAX_SPEED) { ball.vx *= MAX_SPEED / sp; ball.vy *= MAX_SPEED / sp; }
}

// ---- drawing -------------------------------------------------------------
function circle(x, y, r, fill, rim) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (rim) { ctx.lineWidth = 2; ctx.strokeStyle = RIM; ctx.stroke(); }
}
function drawShape(shape, cx, cy, r, rot, fill, rim) {
  const pts = shapePoints(shape, cx, cy, r, rot);
  if (!pts) return circle(cx, cy, r, fill, rim);
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (rim) { ctx.lineWidth = 2; ctx.strokeStyle = RIM; ctx.stroke(); }
}
function outline(g, fill, rim) {
  if (g.kind === "circle") return circle(g.cx, g.cy, g.r, fill, rim);
  ctx.beginPath();
  g.pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (rim) { ctx.lineWidth = 2; ctx.strokeStyle = RIM; ctx.stroke(); }
}
function drawTable() {
  table.forEach((b, i) => {
    outline(geom(b), edit.on && i === edit.sel ? "rgba(112,41,41,0.14)" : null, true);
  });
}

function drawEditUI() {
  const b = table[edit.sel];
  if (b) {
    const g = geom(b), hs = handles(b);
    ctx.save();
    ctx.setLineDash([5, 4]);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#702929";
    outline(g, null, false);
    ctx.stroke();
    ctx.restore();
    circle(hs.resize[0], hs.resize[1], 6, "#702929", true);
    if (b.shape !== "circle") {
      // tether the rotate handle so it reads as attached, not adrift
      ctx.save();
      ctx.strokeStyle = "rgba(70,90,120,0.55)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(g.cx, g.cy);
      ctx.lineTo(hs.rotate[0], hs.rotate[1]);
      ctx.stroke();
      ctx.restore();
      circle(hs.rotate[0], hs.rotate[1], 6, "#465a78", true);
    }
  }

  ctx.font = "500 12px ui-monospace, Menlo, Consolas, monospace";
  ctx.textBaseline = "middle";
  for (const t of toolbar()) {
    const live = t.label === "+ add" || t.label === "reset" || t.label === "done" || edit.sel >= 0;
    ctx.fillStyle = "rgba(226,220,205,0.92)";
    ctx.strokeStyle = RIM;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(t.x, t.y, t.w, t.h, 3);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = live ? GRAPHITE : "rgba(58,58,60,0.35)";
    ctx.fillText(t.label, t.x + 10, t.y + t.h / 2 + 1);
  }
  ctx.fillStyle = "rgba(58,58,60,0.75)";
  ctx.fillText(
    edit.sel >= 0
      ? "drag to move · red handle resizes · blue handle rotates · 1-6 shape"
      : "tap a bumper to select it, or + add a new one",
    14, 14 + 30 + 16);
}

// Text that stays readable on a swatch, whatever it is filled with.
function contrastOn(hex, alpha) {
  const c = mix([255, 255, 255], hexToRgb(hex), alpha == null ? 1 : alpha);
  const lum = (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255;
  return lum > 0.55 ? "#3a3a3c" : "#f2efe8";
}

function drawDrawer() {
  const b = drawerBox();
  ctx.save();
  ctx.font = "500 10px ui-monospace, Menlo, Consolas, monospace";
  ctx.textBaseline = "middle";

  ctx.fillStyle = "rgba(232,228,220,0.97)";
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 6);
  ctx.fill(); ctx.stroke();

  const heading = (text, x, y, right) => {
    ctx.fillStyle = "rgba(58,58,60,0.55)";
    ctx.textAlign = right ? "right" : "left";
    ctx.fillText(text, x, y);
    ctx.textAlign = "left";
  };
  heading("INK  ·  " + FAMILIES[ink.family].name, b.gx, b.gy - 9);
  heading("1-4 tone · A translucency · T tint · esc closes",
          b.gx + b.gridW, b.gy - 9, true);

  // the whole palette: a column per family, a row per tone
  PALETTE.forEach((tones, c) => {
    tones.forEach((hex, r) => {
      const x = b.gx + c * b.cell, y = b.gy + r * b.cell;
      ctx.fillStyle = hex;
      ctx.fillRect(x + 2, y + 2, b.cell - 4, b.cell - 4);
      // a hairline, or the palest tones dissolve into the panel
      ctx.strokeStyle = "rgba(0,0,0,0.18)";
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 2.5, y + 2.5, b.cell - 5, b.cell - 5);
      if (c === ink.family && r === ink.tone) {
        ctx.strokeStyle = contrastOn(hex);
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 4, y + 4, b.cell - 8, b.cell - 8);
      }
    });
  });

  const chipRow = (y, items, selected, fill, label) => {
    heading(label, b.gx, y - 9);
    for (const c of drawerChips(y, items.length, b)) {
      ctx.fillStyle = "rgba(255,255,255,0.8)";
      ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 3); ctx.fill();
      fill(c);
      ctx.strokeStyle = c.i === selected ? "#3a3a3c" : "rgba(0,0,0,0.18)";
      ctx.lineWidth = c.i === selected ? 2 : 1;
      ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 3); ctx.stroke();
    }
  };

  // how solid the ink is
  chipRow(b.ay, ALPHAS, ink.alpha, (c) => {
    ctx.save();
    ctx.globalAlpha = ALPHAS[c.i];
    ctx.fillStyle = inkColor();
    ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 3); ctx.fill();
    ctx.restore();
    ctx.fillStyle = contrastOn(inkColor(), ALPHAS[c.i]);
    ctx.textAlign = "center";
    ctx.fillText(Math.round(ALPHAS[c.i] * 100) + "%", c.x + c.w / 2, c.y + c.h / 2);
    ctx.textAlign = "left";
  }, "TRANSLUCENCY");

  // how sheer the pane over your screen is
  chipRow(b.sy, SCRIMS, ink.scrim, (c) => {
    ctx.fillStyle = "rgba(0,0,0," + SCRIMS[c.i] + ")";
    ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 3); ctx.fill();
    ctx.fillStyle = contrastOn("#000000", SCRIMS[c.i]);
    ctx.textAlign = "center";
    ctx.fillText(Math.round(SCRIMS[c.i] * 100) + "%", c.x + c.w / 2, c.y + c.h / 2);
    ctx.textAlign = "left";
  }, "SCREEN TINT");

  ctx.restore();
}

function drawMiss(now) {
  const age = (now - miss.t) / 420;
  if (age < 0 || age > 1) return;
  ctx.save();
  ctx.globalAlpha = (1 - age) * 0.45;
  ctx.strokeStyle = inkColor();
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(miss.x, miss.y, 7 + age * 24, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawStrip(now) {
  const sh = paint.stripH();
  const cy = H - sh / 2;
  const chipR = sh * 0.28;
  // the transient version fades out over its last half second
  const fade = painting() ? 1 : clamp((stripFlash - now) / 500, 0, 1);
  ctx.save();
  ctx.globalAlpha = fade;
  for (const z of stripLayout()) {
    const step = (z.x1 - z.x0) / z.items.length;
    z.items.forEach((item, i) => {
      const cx = z.x0 + step * (i + 0.5);
      if (z.kind === "color") {
        circle(cx, cy, chipR, PALETTE[i][ink.tone], i === ink.family);
      } else if (z.kind === "size") {
        // each chip is the ball at that size, in miniature
        const rr = chipR * (0.3 + 0.85 * (item / SIZES[SIZES.length - 1]));
        drawShape(ball.shape, cx, cy, rr, 0, "rgba(58,58,60,0.55)", i === ball.sizeIndex);
      } else {
        drawShape(item, cx, cy, chipR * 0.92, 0,
                  item === ball.shape ? GRAPHITE : "rgba(58,58,60,0.35)",
                  item === ball.shape);
      }
    });
  }
  ctx.restore();
}

requestAnimationFrame(frame);
</script>
</body>
