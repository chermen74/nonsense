<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;   /* the scrim is painted by the canvas now */
    cursor: default;
    user-select: none;
  }
  canvas { display: block; position: fixed; inset: 0; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Nonsense desktop renderer — four toys.
//   BALL    : click-drag anywhere and release to flick; bounces off edges.
//             G turns on catching — then you have to land on the ball to
//             grab it, and it stays where you caught it.
//   DIAL    : drag around center to spin, or scroll wheel from anywhere.
//   BUMPERS : the ball plus a table of bumpers that kick it back. The table
//             is editable (E) — move, resize, rotate, reshape, add, delete —
//             and the ball can paint while it plays (P).
//   PAINT   : the ball leaves a trail; colour, size and shape along the
//             bottom, C clears the canvas.
// The ball has eight sizes and six shapes, live in every mode: [ and ] resize
// it, S cycles its shape, the wheel resizes it in ball and bumpers. A
// non-round ball tumbles — impacts impart spin.
// The palette drawer (,) holds thirty-six inks, five levels of translucency
// for the ink, and the screen tint — how sheer the whole pane is.
// Tab cycles modes. 1-4 jumps to a mode. Esc quits.

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// Persistent trail layer, plus a scratch layer for the stroke being laid down
// right now. Translucent ink has to be composited once per stroke: stroking
// segment by segment at low alpha makes every round cap overlap the last and
// re-darken it, so a 15% trail comes out looking solid and beaded.
const trailCanvas = document.createElement("canvas");
const trailCtx = trailCanvas.getContext("2d");
const strokeCanvas = document.createElement("canvas");
const strokeCtx = strokeCanvas.getContext("2d");
let strokeLive = false;

const GRAPHITE = "#3a3a3c";
const RIM = "rgba(0,0,0,0.35)";

// ---- the palette ---------------------------------------------------------
// Nine families, four tones each. The middle tone of each family is a hand
// picked colour — the original six are still in here, in their own columns —
// and the rest are mixed toward white or black from it, so a family holds its
// hue across the range and nothing turns garish.
const FAMILIES = [
  { name: "graphite", base: "#3a3a3c" },
  { name: "bone",     base: "#c9c0ab" },
  { name: "oxblood",  base: "#702929" },
  { name: "rust",     base: "#9c5b3c" },
  { name: "ochre",    base: "#b08940" },
  { name: "moss",     base: "#5c6e4a" },
  { name: "teal",     base: "#3f6b68" },
  { name: "slate",    base: "#465a78" },
  { name: "plum",     base: "#5c3f5e" },
];
const TONE_MIX = [0.58, 0.28, 0, -0.38];   // + toward white, - toward black
function hexToRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mix(rgb, target, amount) {
  return rgb.map((v, i) => Math.round(v + (target[i] - v) * amount));
}
function toHex(rgb) {
  return "#" + rgb.map(v => clamp(v, 0, 255).toString(16).padStart(2, "0")).join("");
}
const PALETTE = FAMILIES.map(f => {
  const base = hexToRgb(f.base);
  return TONE_MIX.map(m =>
    toHex(m >= 0 ? mix(base, [255, 255, 255], m) : mix(base, [0, 0, 0], -m)));
});

// How solid the ink is, and how sheer the whole pane is. Both are the point of
// the app rather than decoration: Fidget is a sheer thing over your screen.
const ALPHAS = [0.15, 0.3, 0.5, 0.75, 1];
const SCRIMS = [0, 0.06, 0.12, 0.18, 0.25, 0.34];

// What the toy sits on. Sheer is no ground at all — over a transparent
// Electron window your desktop shows through, which is the reason the thing
// exists. The rest are solid, for a screen that cannot float an app over its
// home screen, or for when you just want a colour to draw on.
const CANVASES = [
  { name: "sheer", color: null },
  { name: "paper", color: "#f4f1ea" },
  { name: "linen", color: "#e2d9c6" },
  { name: "sage",  color: "#b9c0ab" },
  { name: "slate", color: "#59636d" },
  { name: "ink",   color: "#23262b" },
  { name: "black", color: "#0b0c0e" },
];

// A browser can buzz a phone but not a laptop, so the control only appears
// where it would do something. Desktop Chrome has navigator.vibrate and does
// nothing with it, so the presence of the function is not enough on its own —
// it has to be a touch screen as well. That leaves the row hidden on a laptop
// and hidden on an iPhone, where Safari has no vibrate at all.
const CAN_BUZZ = typeof navigator !== "undefined" &&
  typeof navigator.vibrate === "function" && (navigator.maxTouchPoints || 0) > 0;
const HAPTICS = ["off", "soft", "firm"];
const HAPTIC_SCALES = [0, 0.55, 1];

const ink = { family: 0, tone: 2, alpha: 4, scrim: 2, canvas: 0, haptic: 2 };
function canvasColor() { return CANVASES[ink.canvas].color; }
function sheer() { return !canvasColor(); }
function hapticScale() { return HAPTIC_SCALES[ink.haptic]; }
function buzz(ms) {
  if (!CAN_BUZZ) return;
  const scaled = Math.round(ms * hapticScale());
  if (scaled > 0) { try { navigator.vibrate(scaled); } catch (e) {} }
}
function inkColor() { return PALETTE[ink.family][ink.tone]; }
function inkAlpha() { return ALPHAS[ink.alpha]; }

// Eight steps, from a bead to a grapefruit, as multiples of the base radius.
const SIZES = [0.12, 0.2, 0.3, 0.5, 0.7, 1.0, 1.45, 2.1];
const DEFAULT_SIZE = 5;   // 1.0 — the original ball

const MODES = ["ball", "dial", "bumpers", "paint"];
let mode = "ball";

// The app opens on its own name and a list of what it can do, rather than
// dropping you straight into whichever toy you left running. None of them
// announce themselves from the inside — a field with a ball in it looks the
// same whether or not it will let you paint.
let screen = "title";

// ---- free, or bought once ------------------------------------------------
// The Android build sells this; here it is the reference implementation and
// the demo, so it runs unlocked. Add ?free=1 to see exactly what the free
// tier gets — which is how the paywall gets looked at without a phone.
const FREE_FAMILIES = 3;      // graphite, bone, oxblood
const FREE_CANVASES = 2;      // sheer, and one to draw on
let tier = (typeof location !== "undefined" &&
            new URLSearchParams(location.search).has("free")) ? "free" : "full";
function full() { return tier === "full"; }
function modeLocked(m) { return !full() && m === "paint"; }
function editLocked() { return !full(); }
function familyLocked(i) { return !full() && i >= FREE_FAMILIES; }
function canvasLocked(i) { return !full() && i >= FREE_CANVASES; }

let paywallFrom = "title";
function showPaywall() {
  if (screen === "paywall") return;
  paywallFrom = screen;
  screen = "paywall";
}
function dismissPaywall() { screen = paywallFrom; }
function unlockEverything() {
  tier = "full";
  if (screen === "paywall") dismissPaywall();
}
const PAYWALL_LINES = [
  "paint — the ball leaves ink wherever it goes",
  "arrange the bumper table, and colour every bumper",
  "all thirty-six inks, not three",
  "all seven canvases to sit on",
  "bought once. no subscription, no account, no ads",
];
const PAYWALL_LABELS = ["unlock", "restore", "not now"];
function paywallButtons() {
  const bh = Math.min(H * 0.072, W * 0.145, 56);
  const gap = bh * 0.22;
  const cw = Math.min(W * 0.74, 420);
  const x = (W - cw) / 2;
  const top = H - bh * 0.5 - PAYWALL_LABELS.length * bh - (PAYWALL_LABELS.length - 1) * gap;
  return PAYWALL_LABELS.map((label, i) => ({ i, label, x, y: top + (bh + gap) * i, w: cw, h: bh }));
}
function paywallHit(px, py) {
  for (const c of paywallButtons())
    if (px >= c.x && px <= c.x + c.w && py >= c.y && py <= c.y + c.h) return c.label;
  return null;
}
const MENU = [
  { key: "ball",    label: "ball",         blurb: "throw it and let it ring",   glyph: "circle" },
  { key: "dial",    label: "dial",         blurb: "a knurled wheel that clicks", glyph: "circle" },
  { key: "bumpers", label: "bumpers",      blurb: "a table to bounce through",  glyph: "hexagon" },
  { key: "paint",   label: "paint",        blurb: "a ball that leaves ink",     glyph: "bar" },
  { key: "ink",     label: "ink & canvas", blurb: "colour, sheerness, ground",  glyph: "square" },
];
function menuItems() {
  const items = MENU.slice();
  // Named on the front door rather than sprung on you behind a control.
  if (!full()) items.push({ key: "unlock", label: "unlock everything",
                            blurb: "paint, editing, every colour", glyph: "square" });
  return items;
}
function menuLocked(key) { return key === "paint" && modeLocked("paint"); }
function titleBaseline() { return H * 0.26; }
function menuRowH() { return Math.min(H * 0.082, W * 0.16, 92); }
function menuRows() {
  const rh = menuRowH(), gap = rh * 0.18;
  const cw = Math.min(W * 0.78, 620);
  const x = (W - cw) / 2;
  const top = titleBaseline() + H * 0.075;
  return menuItems().map((item, i) => ({ i, item, x, y: top + (rh + gap) * i, w: cw, h: rh }));
}
function menuHit(px, py) {
  for (const c of menuRows())
    if (px >= c.x && px <= c.x + c.w && py >= c.y && py <= c.y + c.h) return c.item.key;
  return null;
}
function openFromMenu(key) {
  if (key === "unlock") { showPaywall(); return true; }
  if (key === "ink") { screen = "play"; drawerOpen = true; return true; }
  if (!MODES.includes(key)) return false;
  if (modeLocked(key)) { showPaywall(); return true; }
  mode = key; screen = "play"; edit.on = false;
  return true;
}
// A way back, drawn rather than remembered: bottom right, clear of the strip
// and of whatever the host puts at the top of the page.
function menuButton() {
  const w = Math.min(W * 0.2, 96), h = Math.min(H * 0.05, 30);
  const lift = mode === "dial" ? 14 : paint.stripH() + 14;
  return { x: W - w - 14, y: H - lift - h, w, h };
}
function menuButtonHit(px, py) {
  const b = menuButton();
  return px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
}
// Arranging the table was reachable only by a key or a chip the page around
// the canvas happened to be drawing. It is a button now, next to MENU, in the
// mode that has a table.
function editButton() {
  const m = menuButton();
  const w = Math.min(W * 0.16, 74);
  return { x: m.x - w - 8, y: m.y, w, h: m.h };
}
function editButtonHit(px, py) {
  if (mode !== "bumpers") return false;
  const b = editButton();
  return px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
}

let W = 0, H = 0, DPR = 1;

// ---- shapes --------------------------------------------------------------
// One table, shared by the ball and the bumpers. Every entry is a convex
// outline on a unit circumradius, so "size" means the same thing whatever
// shape is wearing it.
function ngon(n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
    pts.push([Math.cos(a), Math.sin(a)]);
  }
  return pts;
}
const SHAPES = ["circle", "triangle", "square", "pentagon", "hexagon", "bar"];
const UNIT = {
  circle: null,
  triangle: ngon(3),
  square: [[-0.707, -0.707], [0.707, -0.707], [0.707, 0.707], [-0.707, 0.707]],
  pentagon: ngon(5),
  hexagon: ngon(6),
  bar: [[-1.35, -0.5], [1.35, -0.5], [1.35, 0.5], [-1.35, 0.5]],
};
// How much ground a shape actually covers, as a fraction of its circumradius
// — the inradius. A bar is long but narrow, and should not ink a stripe as
// wide as it is long.
const COVER = { circle: 1, triangle: 0.5, square: 0.707, pentagon: 0.809,
              hexagon: 0.866, bar: 0.5 };
function inkWidth() { return ballR() * 2 * (COVER[ball.shape] || 1); }

// World-space outline, or null for a circle.
function shapePoints(shape, cx, cy, r, rot) {
  const u = UNIT[shape];
  if (!u) return null;
  const cos = Math.cos(rot), sin = Math.sin(rot);
  return u.map(([x, y]) => {
    const px = x * r, py = y * r;
    return [cx + px * cos - py * sin, cy + px * sin + py * cos];
  });
}

// ---- ball (shared by ball, bumpers, paint) -------------------------------
const ball = {
  x: 0, y: 0,
  vx: 0, vy: 0,
  baseR: 0,
  sizeIndex: DEFAULT_SIZE,
  shape: "circle",
  spin: 0, omega: 0,
  placed: false,
  dragging: false,
  mustCatch: false,      // ball mode only: you have to catch it to throw it
  grabDX: 0, grabDY: 0,
  friction: 0.55,
  restitution: 0.82,
  spinFriction: 0.45,
  samples: [],
};
function ballR() { return ball.baseR * SIZES[ball.sizeIndex]; }
function ballPoints() { return shapePoints(ball.shape, ball.x, ball.y, ballR(), ball.spin); }

// A hit off a surface with normal n spins the ball by the tangential part of
// the blow — the reason a square tumbles instead of sliding.
function impartSpin(nx, ny) {
  // Below the floor it is not worth feeling: a ball settling against an edge
  // should not buzz.
  const speed = Math.hypot(ball.vx, ball.vy);
  if (speed > 200) buzz(9 + 15 * clamp((speed - 200) / 2400, 0, 1));
  const r = Math.max(ballR(), 1);
  const t = ball.vx * -ny + ball.vy * nx;      // velocity along the surface
  ball.omega = clamp(ball.omega + (t / r) * 0.5, -30, 30);
}

// With catching on you have to actually land on the ball. Small balls get a
// bit of slack so a bead is not a pixel-hunt; a big one you simply have to
// hit. Measured against the real outline, so a bar is caught along the bar.
function catchSlack() { return Math.max(0, 20 - ballR() * 0.35); }
function withinCatch(px, py) {
  const pts = ballPoints();
  const slack = catchSlack();
  if (!pts) return Math.hypot(px - ball.x, py - ball.y) <= ballR() + slack;
  if (pointInPoly(px, py, pts)) return true;
  let best = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
    const [qx, qy] = closestOnSegment(px, py, ax, ay, bx, by);
    best = Math.min(best, Math.hypot(px - qx, py - qy));
  }
  return best <= slack;
}
// A missed grab leaves a ring for a moment. No sound, no score — just enough
// to tell you that you reached and the ball was not there.
const miss = { x: 0, y: 0, t: -1e9 };
function catching() { return mode === "ball" && ball.mustCatch && !edit.on; }

// ---- dial ----------------------------------------------------------------
// A knurled wheel coasts. The old friction shed two thirds of its speed
// every second and was still before you had finished letting go of it, which
// is why it never looked like it was spinning at all.
const DIAL_RIBS = 18;
const MAX_DIAL_OMEGA = 14;      // 40 rib passes a second against a 60Hz screen
const DIAL_WINDOW = 120;        // ms of drag a flick is measured over
const dial = {
  angle: 0, omega: 0,
  r: 0,
  grab: false,
  lastAngle: 0, lastTime: 0,
  friction: 0.78,
  samples: [],                  // {d, dt} newest last
  detent: 0, detentIndex: 0,
};

// Every rib crossing the index bumps the count, turning or coasting.
function dialDetents() {
  const step = (2 * Math.PI) / DIAL_RIBS;
  const idx = Math.floor(dial.angle / step);
  if (idx !== dial.detentIndex) {
    dial.detent += Math.abs(idx - dial.detentIndex);
    dial.detentIndex = idx;
    // lighter the faster it goes: forty firm clicks a second is a buzz
    buzz(9 - 5 * dialSpeed());
  }
}
function dialSpeed() { return clamp(Math.abs(dial.omega) / MAX_DIAL_OMEGA, 0, 1); }

/** Turn rate over the last DIAL_WINDOW, rather than over the last sample. */
function dialWindowOmega() {
  let turned = 0, seconds = 0;
  for (const s of dial.samples) { turned += s.d; seconds += s.dt; }
  return seconds <= 0 ? 0 : turned / seconds;
}

// ---- paint ---------------------------------------------------------------
const paint = {
  lastX: 0, lastY: 0, started: false,
  onBumpers: true,          // the ball paints while the bumper table plays
  stripH: () => H * 0.07,
};
// Paint is live in paint mode, and in bumpers mode when it's switched on.
// Never while editing the table — the strip would eat the edit taps.
function painting() {
  if (edit.on) return false;
  return mode === "paint" || (mode === "bumpers" && paint.onBumpers);
}

// ---- bumpers -------------------------------------------------------------
// Each bumper is normalised: nx/ny are fractions of the field, size is a
// fraction of its short edge, so a table survives a resize or a new display.
// Each bumper carries its own ink, from the same thirty-six as everything
// else, and is drawn not quite solid so a painting still shows faintly
// through the table rather than being walled off by it.
const BUMPER_ALPHA = 0.72;
const DEFAULT_BUMPERS = [
  { nx: 0.25, ny: 0.30, size: 0.055, shape: "circle",  rot: 0, family: 2, tone: 2 },
  { nx: 0.75, ny: 0.30, size: 0.055, shape: "circle",  rot: 0, family: 7, tone: 2 },
  { nx: 0.50, ny: 0.50, size: 0.068, shape: "hexagon", rot: 0, family: 4, tone: 2 },
  { nx: 0.25, ny: 0.72, size: 0.055, shape: "bar",     rot: 0, family: 5, tone: 2 },
  { nx: 0.75, ny: 0.72, size: 0.055, shape: "bar",     rot: 0, family: 6, tone: 2 },
];
function bumperColor(b) { return PALETTE[b.family][b.tone]; }
const KICK = 1.06;
const MAX_SPEED = 6000;
const MIN_SIZE = 0.018, MAX_SIZE = 0.30;

let table = loadTable();

const edit = {
  on: false,
  sel: -1,
  drag: null,       // "move" | "resize" | "rotate"
  grabDX: 0, grabDY: 0,
};

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function loadTable() {
  try {
    const raw = localStorage.getItem("nonsense.bumpers") ||
                localStorage.getItem("fidget.bumpers");   // carried over from the old name
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length) return parsed.map(sane);
    }
  } catch (e) { /* private mode, blocked storage — defaults are fine */ }
  return DEFAULT_BUMPERS.map(sane);
}
function saveTable() {
  try { localStorage.setItem("nonsense.bumpers", JSON.stringify(table)); } catch (e) {}
}
function saveBall() {
  try {
    localStorage.setItem("nonsense.ball",
      JSON.stringify({ shape: ball.shape, sizeIndex: ball.sizeIndex,
                       mustCatch: ball.mustCatch }));
  } catch (e) {}
}
function saveInk() {
  try { localStorage.setItem("nonsense.ink", JSON.stringify(ink)); } catch (e) {}
}
function loadInk() {
  try {
    const raw = localStorage.getItem("nonsense.ink") || localStorage.getItem("fidget.ink");
    if (!raw) return;
    const p = JSON.parse(raw);
    ink.family = clamp(p.family | 0, 0, FAMILIES.length - 1);
    ink.tone   = clamp(p.tone   | 0, 0, TONE_MIX.length - 1);
    ink.alpha  = clamp(p.alpha  | 0, 0, ALPHAS.length - 1);
    ink.scrim  = clamp(p.scrim  | 0, 0, SCRIMS.length - 1);
    ink.canvas = clamp(p.canvas | 0, 0, CANVASES.length - 1);
    ink.haptic = clamp(p.haptic == null ? 2 : p.haptic | 0, 0, HAPTICS.length - 1);
  } catch (e) {}
}
function loadBall() {
  try {
    const raw = localStorage.getItem("nonsense.ball") || localStorage.getItem("fidget.ball");
    if (!raw) return;
    const p = JSON.parse(raw);
    if (SHAPES.includes(p.shape)) ball.shape = p.shape;
    if (Number.isInteger(p.sizeIndex) && p.sizeIndex >= 0 && p.sizeIndex < SIZES.length)
      ball.sizeIndex = p.sizeIndex;
    ball.mustCatch = !!p.mustCatch;
  } catch (e) {}
}
function sane(b) {
  return {
    nx: clamp(+b.nx || 0.5, 0, 1),
    ny: clamp(+b.ny || 0.5, 0, 1),
    size: clamp(+b.size || 0.055, MIN_SIZE, MAX_SIZE),
    shape: SHAPES.includes(b.shape) ? b.shape : "circle",
    rot: +b.rot || 0,
    // Tables saved before bumpers had a colour have neither field. They load
    // in graphite: an arrangement is not worth discarding over a new field.
    family: clamp(b.family | 0, 0, FAMILIES.length - 1),
    tone: clamp(b.tone == null ? 2 : b.tone | 0, 0, TONE_MIX.length - 1),
  };
}
loadBall();
loadInk();

// Pixel geometry for a bumper: a circle, or a convex polygon in world space.
function geom(b) {
  const m = Math.min(W, H);
  const cx = b.nx * W, cy = b.ny * H, r = b.size * m;
  const pts = shapePoints(b.shape, cx, cy, r, b.rot);
  return pts ? { kind: "poly", cx, cy, r, pts } : { kind: "circle", cx, cy, r };
}

// ---- convex collision ----------------------------------------------------
function closestOnSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  if (len2 < 1e-9) return [ax, ay];
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / len2, 0, 1);
  return [ax + t * dx, ay + t * dy];
}
function pointInPoly(px, py, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > py) !== (yj > py) &&
        px < ((xj - xi) * (py - yi)) / (yj - yi + 1e-12) + xi) inside = !inside;
  }
  return inside;
}
function pointInBumper(px, py, b) {
  const g = geom(b);
  if (g.kind === "circle") return Math.hypot(px - g.cx, py - g.cy) <= g.r;
  return pointInPoly(px, py, g.pts);
}
function project(pts, nx, ny) {
  let lo = Infinity, hi = -Infinity;
  for (const [x, y] of pts) {
    const d = x * nx + y * ny;
    if (d < lo) lo = d;
    if (d > hi) hi = d;
  }
  return [lo, hi];
}
function centroid(pts) {
  let x = 0, y = 0;
  for (const p of pts) { x += p[0]; y += p[1]; }
  return [x / pts.length, y / pts.length];
}

// Separating-axis test. Returns the shallowest push that frees A from B.
function satPolyPoly(A, B) {
  let depth = Infinity, nx = 0, ny = 0;
  for (const pts of [A, B]) {
    for (let i = 0; i < pts.length; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
      let ex = -(by - ay), ey = bx - ax;
      const len = Math.hypot(ex, ey);
      if (len < 1e-9) continue;
      ex /= len; ey /= len;
      const [aLo, aHi] = project(A, ex, ey);
      const [bLo, bHi] = project(B, ex, ey);
      if (aHi < bLo || bHi < aLo) return null;      // a gap: no contact

  } else if (label === "size +" && b) {
    b.size = clamp(b.size * 1.14, MIN_SIZE, MAX_SIZE);
  } else if (label === "delete" && b) {
    // the drawer cannot stay pointed at a bumper that is going away
    table.splice(edit.sel, 1); edit.sel = -1; closeDrawer();
  } else if (label === "reset") {
    table = DEFAULT_BUMPERS.map(sane); edit.sel = -1; closeDrawer();
  } else if (label === "done") {
    edit.on = false; edit.sel = -1; closeDrawer();
  }
  saveTable();
}

// ---- loop ----------------------------------------------------------------
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (!W || !H) { requestAnimationFrame(frame); return; }
  ctx.clearRect(0, 0, W, H);

  // The sheer scrim. It used to be a CSS background on the body; painting it
  // here instead means one adjustable value, and it behaves the same over a
  // transparent Electron window as it does inside a page.
  // The ground. Sheer paints nothing, so a transparent window keeps showing
  // your desktop through it; any other canvas is laid down solid first. The
  // tint then washes over either one, so it means the same thing in both.
  const ground = canvasColor();
  if (ground) { ctx.fillStyle = ground; ctx.fillRect(0, 0, W, H); }
  if (SCRIMS[ink.scrim] > 0) {
    ctx.fillStyle = "rgba(0,0,0," + SCRIMS[ink.scrim] + ")";
    ctx.fillRect(0, 0, W, H);
  }

  if (screen === "paywall") {
    drawPaywall();
    requestAnimationFrame(frame);
    return;
  }

  if (screen === "title") {
    drawTitle();
    requestAnimationFrame(frame);
    return;
  }

  if (mode === "dial") {
    if (!dial.grab) {
      dial.omega *= Math.pow(dial.friction, dt);
      if (Math.abs(dial.omega) < 0.05) dial.omega = 0;
      dial.angle += dial.omega * dt;
      dialDetents();
    }
    drawDial();
  } else {
    const r = ballR();
    const frozen = edit.on && mode === "bumpers";

    if (!ball.dragging && !frozen) {
      const decay = Math.pow(ball.friction, dt);
      ball.vx *= decay; ball.vy *= decay;
      if (Math.hypot(ball.vx, ball.vy) < 4) { ball.vx = 0; ball.vy = 0; }

      // Substep, so a quick flick can't jump a wall or skip a bumper between
      // frames, and so contacts are caught shallow — a deep one picks its
      // escape direction badly.
      const reach = Math.hypot(ball.vx, ball.vy) * dt;
      const steps = clamp(Math.ceil(reach / Math.max(r * 0.25, 1)), 1, 16);
      const h = dt / steps;
      for (let i = 0; i < steps; i++) {
        ball.spin += ball.omega * h;          // turn first, then resolve
        ball.x += ball.vx * h;
        ball.y += ball.vy * h;
        walls();
        if (mode === "bumpers") for (const b of table) bounce(b);
        if (painting()) layTrail();
      }
      // a stroke is finished once the ball is at rest
      if (strokeLive && ball.vx === 0 && ball.vy === 0) settleStroke();
    } else {
      ball.spin += ball.omega * dt;
    }

    // spin runs down on its own, and stops dead while you're holding it
    if (ball.dragging) ball.omega *= Math.pow(0.02, dt);
    ball.omega *= Math.pow(ball.spinFriction, dt);
    if (Math.abs(ball.omega) < 0.02) ball.omega = 0;

    if (painting()) {
      ctx.drawImage(trailCanvas, 0, 0, W, H);
      if (strokeLive) {
        // the live stroke shows at its translucency until it settles
        ctx.save();
        ctx.globalAlpha = inkAlpha();
        ctx.drawImage(strokeCanvas, 0, 0, W, H);
        ctx.restore();
      }
    }
    if (mode === "bumpers") drawTable();

    ctx.save();
    ctx.globalAlpha = inkAlpha();
    drawShape(ball.shape, ball.x, ball.y, r, ball.spin, inkColor(), false);
    ctx.globalAlpha = Math.max(0.5, inkAlpha());
    drawShape(ball.shape, ball.x, ball.y, r, ball.spin, null, true);
    ctx.restore();

    drawMiss(now);
    if (stripVisible(now)) drawStrip(now);
    if (frozen) drawEditUI();
  }

  if (drawerOpen) drawDrawer();
  else drawMenuButton();

  requestAnimationFrame(frame);
}

// Walls, honouring the ball's real outline rather than a circle around it.
function walls() {
  const pts = ballPoints();
  const r = ballR();
  const e = ball.restitution;
  // Extent of the real outline, which for a tumbling polygon changes every
  // frame. Reflect only when the ball is actually heading into the wall: a
  // corner that rotates back into contact would otherwise flip the velocity
  // a second time and pin the ball to the edge.
  let lo0, hi0, lo1, hi1;
  if (!pts) {
    lo0 = ball.x - r; hi0 = ball.x + r; lo1 = ball.y - r; hi1 = ball.y + r;
  } else {
    lo0 = lo1 = Infinity; hi0 = hi1 = -Infinity;
    for (const [x, y] of pts) {
      if (x < lo0) lo0 = x;
      if (x > hi0) hi0 = x;
      if (y < lo1) lo1 = y;
      if (y > hi1) hi1 = y;
    }
  }
  if (lo0 < 0) { ball.x -= lo0;     if (ball.vx < 0) { ball.vx = -ball.vx * e; impartSpin(1, 0); } }
  if (hi0 > W) { ball.x -= hi0 - W; if (ball.vx > 0) { ball.vx = -ball.vx * e; impartSpin(-1, 0); } }
  if (lo1 < 0) { ball.y -= lo1;     if (ball.vy < 0) { ball.vy = -ball.vy * e; impartSpin(0, 1); } }
  if (hi1 > H) { ball.y -= hi1 - H; if (ball.vy > 0) { ball.vy = -ball.vy * e; impartSpin(0, -1); } }
}

// Reflect the ball off one bumper — any convex shape against any other.
function bounce(b) {
  const g = geom(b);
  const bp = ballPoints();
  const r = ballR();
  let hit;
  if (!bp && g.kind === "circle")      hit = circleVsCircle(ball.x, ball.y, r, g.cx, g.cy, g.r);
  else if (!bp)                        hit = circleVsPoly(ball.x, ball.y, r, g.pts);
  else if (g.kind === "circle") {
    const inv = circleVsPoly(g.cx, g.cy, g.r, bp);      // bumper against ball
    hit = inv && { nx: -inv.nx, ny: -inv.ny, depth: inv.depth };
  } else                               hit = satPolyPoly(bp, g.pts);
  if (!hit) return;

  ball.x += hit.nx * hit.depth;
  ball.y += hit.ny * hit.depth;

  const dot = ball.vx * hit.nx + ball.vy * hit.ny;
  if (dot >= 0) return;
  impartSpin(hit.nx, hit.ny);
  ball.vx = (ball.vx - 2 * dot * hit.nx) * KICK;
  ball.vy = (ball.vy - 2 * dot * hit.ny) * KICK;
  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp > MAX_SPEED) { ball.vx *= MAX_SPEED / sp; ball.vy *= MAX_SPEED / sp; }
}

// ---- drawing -------------------------------------------------------------
function circle(x, y, r, fill, rim) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (rim) { ctx.lineWidth = 2; ctx.strokeStyle = RIM; ctx.stroke(); }
}
function drawShape(shape, cx, cy, r, rot, fill, rim) {
  const pts = shapePoints(shape, cx, cy, r, rot);
  if (!pts) return circle(cx, cy, r, fill, rim);
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (rim) { ctx.lineWidth = 2; ctx.strokeStyle = RIM; ctx.stroke(); }
}
function outline(g, fill, rim) {
  if (g.kind === "circle") return circle(g.cx, g.cy, g.r, fill, rim);
  ctx.beginPath();
  g.pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (rim) { ctx.lineWidth = 2; ctx.strokeStyle = RIM; ctx.stroke(); }
}
function drawTable() {
  table.forEach((b) => {
    ctx.save();
    ctx.globalAlpha = BUMPER_ALPHA;
    outline(geom(b), bumperColor(b), false);
    ctx.globalAlpha = 1;
    outline(geom(b), null, true);
    ctx.restore();
  });
}

function drawEditUI() {
  const b = table[edit.sel];
  if (b) {
    const g = geom(b), hs = handles(b);
    ctx.save();
    ctx.setLineDash([5, 4]);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#702929";
    outline(g, null, false);
    ctx.stroke();
    ctx.restore();
    circle(hs.resize[0], hs.resize[1], 6, "#702929", true);
    if (b.shape !== "circle") {
      // tether the rotate handle so it reads as attached, not adrift
      ctx.save();
      ctx.strokeStyle = "rgba(70,90,120,0.55)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(g.cx, g.cy);
      ctx.lineTo(hs.rotate[0], hs.rotate[1]);
      ctx.stroke();
      ctx.restore();
      circle(hs.rotate[0], hs.rotate[1], 6, "#465a78", true);
    }
  }

  ctx.font = "500 12px ui-monospace, Menlo, Consolas, monospace";
  ctx.textBaseline = "middle";
  for (const t of toolbar()) {
    const live = t.label === "+ add" || t.label === "reset" || t.label === "done" || edit.sel >= 0;
    ctx.fillStyle = "rgba(226,220,205,0.92)";
    ctx.strokeStyle = RIM;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(t.x, t.y, t.w, t.h, 3);
    ctx.fill(); ctx.stroke();
    if (t.label === "ink" && live) {
      const sw = 9, cx = t.x + t.w / 2, cy = t.y + t.h / 2;
      ctx.fillStyle = bumperColor(table[edit.sel]);
      ctx.fillRect(cx - sw, cy - sw, sw * 2, sw * 2);
      ctx.strokeStyle = RIM;
      ctx.strokeRect(cx - sw + 0.5, cy - sw + 0.5, sw * 2 - 1, sw * 2 - 1);
      continue;
    }
    ctx.fillStyle = live ? GRAPHITE : "rgba(58,58,60,0.35)";
    ctx.fillText(t.label, t.x + 10, t.y + t.h / 2 + 1);
  }
  ctx.fillStyle = "rgba(58,58,60,0.75)";
  ctx.fillText(
    edit.sel >= 0
      ? "drag to move · red handle resizes · blue handle rotates · 1-6 shape"
      : "tap a bumper to select it, or + add a new one",
    14, 14 + 30 + 16);
}

// Text that stays readable on a swatch, whatever it is filled with.
function contrastOn(hex, alpha) {
  const c = mix([255, 255, 255], hexToRgb(hex), alpha == null ? 1 : alpha);
  const lum = (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255;
  return lum > 0.55 ? "#3a3a3c" : "#f2efe8";
}

function drawTitle() {
  // On a solid canvas the scene sits straight on it. On a sheer one there is
  // no telling what is behind the window, so the title lays down its own
  // ground — still see-through, but dark enough that the name reads.
  const veil = sheer();
  if (veil) { ctx.fillStyle = "rgba(12,12,14,0.62)"; ctx.fillRect(0, 0, W, H); }
  const fg = veil ? "#eeeae2" : contrastOn(canvasColor(), 1);
  const dark = fg !== "#3a3a3c";
  const cx = W / 2;

  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  let size = Math.min(W * 0.15, 120);
  const spaced = (text, px) => {
    ctx.font = "600 " + px + "px 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif";
    // canvas has no letter-spacing before Chrome 99, so space it by hand
    const gap = px * 0.16;
    const chars = [...text];
    const widths = chars.map(ch => ctx.measureText(ch).width);
    return { chars, widths, total: widths.reduce((a, b) => a + b, 0) + gap * (chars.length - 1), gap };
  };
  let word = spaced("NONSENSE", size);
  const fit = W * 0.8;
  if (word.total > fit) { size *= fit / word.total; word = spaced("NONSENSE", size); }
  ctx.fillStyle = fg;
  ctx.textAlign = "left";
  let x = cx - word.total / 2;
  word.chars.forEach((ch, i) => {
    ctx.fillText(ch, x, titleBaseline());
    x += word.widths[i] + word.gap;
  });

  ctx.textAlign = "center";
  ctx.globalAlpha = 0.55;
  ctx.font = "400 " + Math.min(W * 0.03, 15) + "px 'IBM Plex Mono', ui-monospace, monospace";
  ctx.fillText("something to do with your hands", cx, titleBaseline() + H * 0.032);
  ctx.globalAlpha = 1;

  ctx.textBaseline = "middle";
  for (const c of menuRows()) {
    const round = c.h * 0.24;
    ctx.beginPath();
    ctx.roundRect(c.x, c.y, c.w, c.h, round);
    ctx.fillStyle = dark ? "rgba(255,255,255,0.11)" : "rgba(0,0,0,0.09)";
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = dark ? "rgba(255,255,255,0.2)" : "rgba(0,0,0,0.18)";
    ctx.stroke();

    ctx.textAlign = "left";
    const tx = c.x + c.h * 0.4;
    ctx.fillStyle = fg;
    ctx.font = "500 " + (c.h * 0.28) + "px 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif";
    ctx.fillText(c.item.label.toUpperCase(), tx, c.y + c.h * 0.36);
    ctx.globalAlpha = 0.55;
    // The blurb has to end before the glyph does, and a phone row is narrow
    // enough that at a fixed size it ran off the end of its own row.
    const room = c.w - (tx - c.x) - c.h * 0.95;
    let blurbSize = c.h * 0.2;
    ctx.font = "400 " + blurbSize + "px 'IBM Plex Mono', ui-monospace, monospace";
    const blurbW = ctx.measureText(c.item.blurb).width;
    if (blurbW > room) {
      blurbSize = Math.max(blurbSize * (room / blurbW), 9);
      ctx.font = "400 " + blurbSize + "px 'IBM Plex Mono', ui-monospace, monospace";
    }
    ctx.fillText(c.item.blurb, tx, c.y + c.h * 0.68);
    ctx.globalAlpha = 1;

    const gr = c.h * 0.24, gx = c.x + c.w - c.h * 0.52, gy = c.y + c.h / 2;
    if (menuLocked(c.item.key)) {
      drawLock(gx, gy, gr, dark ? "rgba(238,234,226,0.6)" : "rgba(58,58,60,0.6)");
      continue;
    }
    if (c.item.key === "unlock") {
      drawLock(gx, gy, gr, "#702929");
      continue;
    }
    ctx.save();
    ctx.globalAlpha = c.item.key === "ink" ? 1 : 0.65;
    drawShape(c.item.glyph, gx, gy, gr, 0,
              c.item.key === "ink" ? inkColor() : fg, false);
    ctx.restore();
    if (c.item.key === "dial") {
      ctx.strokeStyle = dark ? "rgba(0,0,0,0.75)" : "rgba(255,255,255,0.85)";
      ctx.lineWidth = Math.max(1, gr * 0.13);
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI) / 4;
        ctx.beginPath();
        ctx.moveTo(gx + Math.cos(a) * gr * 0.45, gy + Math.sin(a) * gr * 0.45);
        ctx.lineTo(gx + Math.cos(a) * gr * 0.95, gy + Math.sin(a) * gr * 0.95);
        ctx.stroke();
      }
    }
  }
  ctx.restore();
}

function cornerButton(b, label, on) {
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(b.x, b.y, b.w, b.h, 3);
  ctx.fillStyle = on ? GRAPHITE : "rgba(255,255,255,0.55)";
  ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = on ? GRAPHITE : "rgba(58,58,60,0.22)";
  ctx.stroke();
  ctx.fillStyle = on ? "#e8e4dc" : "#4a4742";
  ctx.font = "500 10px ui-monospace, Menlo, Consolas, monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 0.5);
  ctx.restore();
}

// A padlock, small enough to sit on a chip.
function drawLock(cx, cy, r, colour) {
  ctx.save();
  ctx.fillStyle = colour;
  ctx.strokeStyle = colour;
  ctx.beginPath();
  ctx.roundRect(cx - r * 0.62, cy - r * 0.1, r * 1.24, r * 0.88, r * 0.18);
  ctx.fill();
  ctx.lineWidth = Math.max(1, r * 0.24);
  ctx.beginPath();
  ctx.arc(cx, cy - r * 0.1, r * 0.38, Math.PI, 0);
  ctx.stroke();
  ctx.restore();
}

/**
 * What the unlock buys, in words. A screen rather than a dialog: it has to
 * say enough to be worth reading, and a fidget toy interrupting you with a
 * modal is a worse thing than a page you chose to open.
 */
function drawPaywall() {
  const veil = sheer();
  if (veil) { ctx.fillStyle = "rgba(12,12,14,0.62)"; ctx.fillRect(0, 0, W, H); }
  const fg = veil ? "#eeeae2" : contrastOn(canvasColor(), 1);
  const dark = fg !== "#3a3a3c";
  const cx = W / 2;

  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = fg;
  ctx.font = "600 " + Math.min(W * 0.062, 34) + "px 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif";
  ctx.fillText("UNLOCK EVERYTHING", cx, H * 0.19);

  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.font = "400 " + Math.min(W * 0.03, 14) + "px 'IBM Plex Mono', ui-monospace, monospace";
  const lx = Math.max(W * 0.16, cx - 230);
  let ly = H * 0.3;
  const step = Math.min(H * 0.055, 34);
  for (const line of PAYWALL_LINES) {
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(lx - 16, ly, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.85;
    ctx.fillText(line, lx, ly);
    ly += step;
  }
  ctx.globalAlpha = 1;

  for (const c of paywallButtons()) {
    const primary = c.label === "unlock";
    ctx.beginPath();
    ctx.roundRect(c.x, c.y, c.w, c.h, c.h * 0.22);
    ctx.fillStyle = primary ? "#702929"
      : dark ? "rgba(255,255,255,0.11)" : "rgba(0,0,0,0.09)";
    ctx.fill();
    if (!primary) {
      ctx.lineWidth = 1;
      ctx.strokeStyle = dark ? "rgba(255,255,255,0.22)" : "rgba(0,0,0,0.2)";
      ctx.stroke();
    }
    ctx.textAlign = "center";
    ctx.fillStyle = primary ? "#f0ece4" : fg;
    ctx.globalAlpha = primary ? 1 : 0.75;
    ctx.font = "500 " + (c.h * 0.3) + "px 'IBM Plex Mono', ui-monospace, monospace";
    ctx.fillText(c.label, c.x + c.w / 2, c.y + c.h / 2);
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }
  ctx.restore();
}

function drawMenuButton() {
  if (mode === "bumpers") cornerButton(editButton(), "EDIT", edit.on);
  cornerButton(menuButton(), "\u2261  MENU", false);
}

/**
 * A knurled wheel. It used to be a plain disc with one dot on it, which is
 * why nothing ever looked like it was turning — there was nothing on it to
 * watch. At speed the ribs are drawn wider and fainter, so a fast spin blurs
 * instead of crawling backwards.
 */
function drawDial() {
  const cx = W / 2, cy = H / 2, r = dial.r;
  const a = inkAlpha();
  const base = hexToRgb(inkColor());
  const fast = dialSpeed();
  ctx.save();
  ctx.globalAlpha = a;
  circle(cx, cy, r, inkColor(), false);

  const step = (2 * Math.PI) / DIAL_RIBS;
  const inner = r * 0.54, outer = r * 0.94;
  ctx.lineCap = "round";
  ctx.lineWidth = r * (0.085 + 0.075 * fast);
  for (let i = 0; i < DIAL_RIBS; i++) {
    const ang = dial.angle + step * i;
    const marked = i === 0;              // so a turn stays countable at speed
    ctx.globalAlpha = a * (marked ? 0.95 : 0.8 - 0.3 * fast);
    ctx.strokeStyle = toHex(mix(base, marked ? [0, 0, 0] : [255, 255, 255], marked ? 0.55 : 0.5));
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * inner, cy + Math.sin(ang) * inner);
    ctx.lineTo(cx + Math.cos(ang) * outer, cy + Math.sin(ang) * outer);
    ctx.stroke();
  }

  ctx.globalAlpha = a;
  circle(cx, cy, r * 0.46, toHex(mix(base, [0, 0, 0], 0.28)), false);
  ctx.globalAlpha = Math.max(0.5, a);
  circle(cx, cy, r * 0.46, null, true);
  circle(cx, cy, r, null, true);

  // the index the ribs click past
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = "#702929";
  const tip = cy - r * 1.02;
  ctx.beginPath();
  ctx.moveTo(cx, tip + r * 0.09);
  ctx.lineTo(cx - r * 0.055, tip - r * 0.02);
  ctx.lineTo(cx + r * 0.055, tip - r * 0.02);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawDrawer() {
  const b = drawerBox();
  ctx.save();
  ctx.font = "500 10px ui-monospace, Menlo, Consolas, monospace";
  ctx.textBaseline = "middle";

  ctx.fillStyle = "rgba(232,228,220,0.97)";
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 6);
  ctx.fill(); ctx.stroke();

  const heading = (text, x, y, right) => {
    ctx.fillStyle = "rgba(58,58,60,0.55)";
    ctx.textAlign = right ? "right" : "left";
    ctx.fillText(text, x, y);
    ctx.textAlign = "left";
  };
  const targeted = targetBumper();
  const selFamily = targeted ? targeted.family : ink.family;
  const selTone = targeted ? targeted.tone : ink.tone;
  const left = (targeted ? "BUMPER  ·  " : "INK  ·  ") + FAMILIES[selFamily].name;
  heading(left, b.gx, b.gy - 9);
  // The hint is the first thing to go: "BUMPER · " is longer than "INK · ",
  // and on a narrow panel the two headings ran straight through each other.
  const hint = targeted
    ? "pick a colour for this bumper · esc closes"
    : "1-4 tone · A translucency · K canvas · T tint · esc closes";
  if (ctx.measureText(left).width + ctx.measureText(hint).width + 24 < b.gridW) {
    heading(hint, b.gx + b.gridW, b.gy - 9, true);
  }

  // the whole palette: a column per family, a row per tone
  PALETTE.forEach((tones, c) => {
    tones.forEach((hex, r) => {
      const x = b.gx + c * b.cell, y = b.gy + r * b.cell;
      const lockedFamily = familyLocked(c);
      ctx.save();
      if (lockedFamily) ctx.globalAlpha = 0.25;
      ctx.fillStyle = hex;
      ctx.fillRect(x + 2, y + 2, b.cell - 4, b.cell - 4);
      ctx.restore();
      if (lockedFamily && r === 0) {
        drawLock(x + b.cell / 2, y + b.cell * 1.5, b.cell * 0.26, "rgba(58,58,60,0.7)");
      }
      // a hairline, or the palest tones dissolve into the panel
      ctx.strokeStyle = "rgba(0,0,0,0.18)";
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 2.5, y + 2.5, b.cell - 5, b.cell - 5);
      if (c === selFamily && r === selTone) {
        ctx.strokeStyle = contrastOn(hex);
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 4, y + 4, b.cell - 8, b.cell - 8);
      }
    });
  });

  const chipRow = (y, items, selected, fill, label) => {
    heading(label, b.gx, y - 9);
    for (const c of drawerChips(y, items.length, b)) {
      ctx.fillStyle = "rgba(255,255,255,0.8)";
      ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 3); ctx.fill();
      fill(c);
      ctx.strokeStyle = c.i === selected ? "#3a3a3c" : "rgba(0,0,0,0.18)";
      ctx.lineWidth = c.i === selected ? 2 : 1;
      ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 3); ctx.stroke();
    }
  };

  const centred = (text, c, colour) => {
    ctx.fillStyle = colour;
    ctx.textAlign = "center";
    ctx.fillText(text, c.x + c.w / 2, c.y + c.h / 2);
    ctx.textAlign = "left";
  };
  const painters = {
    // how solid the ink is
    alpha: (c) => {
      ctx.save();
      ctx.globalAlpha = ALPHAS[c.i];
      ctx.fillStyle = inkColor();
      ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 3); ctx.fill();
      ctx.restore();
      centred(Math.round(ALPHAS[c.i] * 100) + "%", c, contrastOn(inkColor(), ALPHAS[c.i]));
    },
    // what the toy sits on
    canvas: (c) => {
      const col = CANVASES[c.i].color;
      if (col) {
        ctx.save();
        if (canvasLocked(c.i)) ctx.globalAlpha = 0.3;
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 3); ctx.fill();
        ctx.restore();
      } else {
        // sheer has no colour to show, so show the absence of one
        ctx.save();
        ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 3); ctx.clip();
        ctx.strokeStyle = "rgba(58,58,60,0.4)";
        ctx.lineWidth = 1;
        for (let x = c.x - c.h; x < c.x + c.w; x += 7) {
          ctx.beginPath();
          ctx.moveTo(x, c.y + c.h);
          ctx.lineTo(x + c.h, c.y);
          ctx.stroke();
        }
        ctx.restore();
      }
      centred(CANVASES[c.i].name, c,
              canvasLocked(c.i) ? "rgba(58,58,60,0.6)" : col ? contrastOn(col, 1) : "#3a3a3c");
    },
    // how sheer the pane over your screen is
    scrim: (c) => {
      ctx.fillStyle = "rgba(0,0,0," + SCRIMS[c.i] + ")";
      ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 3); ctx.fill();
      centred(Math.round(SCRIMS[c.i] * 100) + "%", c, contrastOn("#000000", SCRIMS[c.i]));
    },
    haptic: (c) => {
      ctx.fillStyle = "rgba(58,58,60," + (0.13 + HAPTIC_SCALES[c.i] * 0.59) + ")";
      ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 3); ctx.fill();
      centred(HAPTICS[c.i], c, contrastOn("#3a3a3c", 0.13 + HAPTIC_SCALES[c.i] * 0.59));
    },
  };
  for (const kind of b.kinds) {
    const row = DRAWER_ROW[kind];
    chipRow(b.rowY[kind], row.items(), row.get(), painters[kind], row.label);
  }

  ctx.restore();
}

function drawMiss(now) {
  const age = (now - miss.t) / 420;
  if (age < 0 || age > 1) return;
  ctx.save();
  ctx.globalAlpha = (1 - age) * 0.45;
  ctx.strokeStyle = inkColor();
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(miss.x, miss.y, 7 + age * 24, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawStrip(now) {
  const sh = paint.stripH();
  const cy = H - sh / 2;
  const chipR = sh * 0.28;
  // the transient version fades out over its last half second
  const fade = painting() ? 1 : clamp((stripFlash - now) / 500, 0, 1);
  ctx.save();
  ctx.globalAlpha = fade;
  for (const z of stripLayout()) {
    const step = (z.x1 - z.x0) / z.items.length;
    z.items.forEach((item, i) => {
      const cx = z.x0 + step * (i + 0.5);
      if (z.kind === "color") {
        const locked = familyLocked(i);
        ctx.save();
        if (locked) ctx.globalAlpha = 0.3;
        circle(cx, cy, chipR, PALETTE[i][ink.tone], i === ink.family);
        ctx.restore();
        if (locked) drawLock(cx, cy, chipR * 0.62, "rgba(58,58,60,0.8)");
      } else if (z.kind === "size") {
        // each chip is the ball at that size, in miniature
        const rr = chipR * (0.3 + 0.85 * (item / SIZES[SIZES.length - 1]));
        drawShape(ball.shape, cx, cy, rr, 0, "rgba(58,58,60,0.55)", i === ball.sizeIndex);
      } else {
        drawShape(item, cx, cy, chipR * 0.92, 0,
                  item === ball.shape ? GRAPHITE : "rgba(58,58,60,0.35)",
                  item === ball.shape);
      }
    });
  }
  ctx.restore();
}

requestAnimationFrame(frame);
</script>
