      ctx.fill("evenodd");
      ctx.globalAlpha = 1;
      ctx.lineWidth = 2;
      ctx.strokeStyle = RIM;
      ctx.stroke();
    } else if (g.kind === "circle") {
      ctx.translate(g.cx, g.cy);
      ctx.rotate(b.rot);
      ctx.scale(b.sx ?? 1, b.sy ?? 1);
      ctx.globalAlpha = BUMPER_ALPHA;
      circle(0, 0, g.r, bumperColor(b), false);
      ctx.globalAlpha = 1;
      circle(0, 0, g.r, null, true);
    } else {
      ctx.globalAlpha = BUMPER_ALPHA;
      outline(g, bumperColor(b), false);
      ctx.globalAlpha = 1;
      outline(g, null, true);
    }
    ctx.restore();
  });
}

function drawEditUI() {
  const b = table[edit.sel];
  if (b) {
    const g = geom(b), hs = handles(b);
    ctx.save();
    ctx.setLineDash([5, 4]);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#702929";
    outline(g, null, false);
    ctx.stroke();
    ctx.restore();
    circle(hs.pull[0], hs.pull[1], 6, "#702929", true);
    // A perfectly round bumper has no orientation to show; a pulled one does,
    // so the turn handle appears the moment it stops being a circle.
    if (b.shape !== "circle" || b.glyph || b.sx !== b.sy) {
      // tether the rotate handle so it reads as attached, not adrift
      ctx.save();
      ctx.strokeStyle = "rgba(70,90,120,0.55)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(g.cx, g.cy);
      ctx.lineTo(hs.rotate[0], hs.rotate[1]);
      ctx.stroke();
      ctx.restore();
      circle(hs.rotate[0], hs.rotate[1], 6, "#465a78", true);
    }
  }

  ctx.font = "500 12px ui-monospace, Menlo, Consolas, monospace";
  ctx.textBaseline = "middle";
  for (const t of toolbar()) {
    const live = t.label === "+ add" || t.label === "reset" || t.label === "done" || edit.sel >= 0;
    ctx.fillStyle = "rgba(226,220,205,0.92)";
    ctx.strokeStyle = RIM;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(t.x, t.y, t.w, t.h, 3);
    ctx.fill(); ctx.stroke();
    if (t.label === "ink" && live) {
      const sw = 9, cx = t.x + t.w / 2, cy = t.y + t.h / 2;
      ctx.fillStyle = bumperColor(table[edit.sel]);
      ctx.fillRect(cx - sw, cy - sw, sw * 2, sw * 2);
      ctx.strokeStyle = RIM;
      ctx.strokeRect(cx - sw + 0.5, cy - sw + 0.5, sw * 2 - 1, sw * 2 - 1);
      continue;
    }
    ctx.fillStyle = live ? GRAPHITE : "rgba(58,58,60,0.35)";
    ctx.fillText(t.label, t.x + 10, t.y + t.h / 2 + 1);
  }
  ctx.fillStyle = "rgba(58,58,60,0.75)";
  ctx.fillText(
    edit.sel >= 0
      ? "drag to move · red handle pulls · blue handle turns · 1-6 shape · shift+A-Z letter"
      : "tap a bumper to select it, or + add a new one",
    14, 14 + 30 + 16);
}

// Text that stays readable on a swatch, whatever it is filled with.
function contrastOn(hex, alpha) {
  const c = mix([255, 255, 255], hexToRgb(hex), alpha == null ? 1 : alpha);
  const lum = (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255;
  return lum > 0.55 ? "#3a3a3c" : "#f2efe8";
}

function drawTitle() {
  // On a solid canvas the scene sits straight on it. On a sheer one there is
  // no telling what is behind the window, so the title lays down its own
  // ground — still see-through, but dark enough that the name reads.
  const veil = sheer();
  if (veil) { ctx.fillStyle = "rgba(12,12,14,0.62)"; ctx.fillRect(0, 0, W, H); }
  const fg = veil ? "#eeeae2" : contrastOn(canvasColor(), 1);
  const dark = fg !== "#3a3a3c";
  const cx = W / 2;

  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  let size = Math.min(W * 0.15, 120);
  const spaced = (text, px) => {
    ctx.font = "600 " + px + "px 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif";
    // canvas has no letter-spacing before Chrome 99, so space it by hand
    const gap = px * 0.16;
    const chars = [...text];
    const widths = chars.map(ch => ctx.measureText(ch).width);
    return { chars, widths, total: widths.reduce((a, b) => a + b, 0) + gap * (chars.length - 1), gap };
  };
  let word = spaced("NONSENSE", size);
  const fit = W * 0.8;
  if (word.total > fit) { size *= fit / word.total; word = spaced("NONSENSE", size); }
  ctx.fillStyle = fg;
  ctx.textAlign = "left";
  let x = cx - word.total / 2;
  word.chars.forEach((ch, i) => {
    ctx.fillText(ch, x, titleBaseline());
    x += word.widths[i] + word.gap;
  });

  ctx.textAlign = "center";
  ctx.globalAlpha = 0.55;
  ctx.font = "400 " + Math.min(W * 0.03, 15) + "px 'IBM Plex Mono', ui-monospace, monospace";
  ctx.fillText("something to do with your hands", cx, titleBaseline() + H * 0.032);
  ctx.globalAlpha = 1;

  ctx.textBaseline = "middle";
  for (const c of menuRows()) {
    const round = c.h * 0.24;
    ctx.beginPath();
    ctx.roundRect(c.x, c.y, c.w, c.h, round);
    ctx.fillStyle = dark ? "rgba(255,255,255,0.11)" : "rgba(0,0,0,0.09)";
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = dark ? "rgba(255,255,255,0.2)" : "rgba(0,0,0,0.18)";
    ctx.stroke();

    ctx.textAlign = "left";
    const tx = c.x + c.h * 0.4;
    ctx.fillStyle = fg;
    ctx.font = "500 " + (c.h * 0.28) + "px 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif";
    ctx.fillText(c.item.label.toUpperCase(), tx, c.y + c.h * 0.36);
    ctx.globalAlpha = 0.55;
    // The blurb has to end before the glyph does, and a phone row is narrow
    // enough that at a fixed size it ran off the end of its own row.
    const room = c.w - (tx - c.x) - c.h * 0.95;
    let blurbSize = c.h * 0.2;
    ctx.font = "400 " + blurbSize + "px 'IBM Plex Mono', ui-monospace, monospace";
    const blurbW = ctx.measureText(c.item.blurb).width;
    if (blurbW > room) {
      blurbSize = Math.max(blurbSize * (room / blurbW), 9);
      ctx.font = "400 " + blurbSize + "px 'IBM Plex Mono', ui-monospace, monospace";
    }
    ctx.fillText(c.item.blurb, tx, c.y + c.h * 0.68);
    ctx.globalAlpha = 1;

    const gr = c.h * 0.24, gx = c.x + c.w - c.h * 0.52, gy = c.y + c.h / 2;
    if (menuLocked(c.item.key)) {
      drawLock(gx, gy, gr, dark ? "rgba(238,234,226,0.6)" : "rgba(58,58,60,0.6)");
      continue;
    }
    if (c.item.key === "unlock") {
      drawLock(gx, gy, gr, "#702929");
      continue;
    }
    ctx.save();
    ctx.globalAlpha = c.item.key === "ink" ? 1 : 0.65;
    if (c.item.glyph === "bolt") drawBoltGlyph(gx, gy, gr, fg);
    else if (c.item.glyph === "glass") drawGlassGlyph(gx, gy, gr, fg);
    else drawShape(c.item.glyph, gx, gy, gr, 0,
                   c.item.key === "ink" ? inkColor() : fg, false);
    ctx.restore();
    if (c.item.key === "dial") {
      ctx.strokeStyle = dark ? "rgba(0,0,0,0.75)" : "rgba(255,255,255,0.85)";
      ctx.lineWidth = Math.max(1, gr * 0.13);
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI) / 4;
        ctx.beginPath();
        ctx.moveTo(gx + Math.cos(a) * gr * 0.45, gy + Math.sin(a) * gr * 0.45);
        ctx.lineTo(gx + Math.cos(a) * gr * 0.95, gy + Math.sin(a) * gr * 0.95);
        ctx.stroke();
      }
    }
  }
  ctx.restore();
}

function cornerButton(b, label, on) {
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(b.x, b.y, b.w, b.h, 3);
  ctx.fillStyle = on ? GRAPHITE : "rgba(255,255,255,0.55)";
  ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = on ? GRAPHITE : "rgba(58,58,60,0.22)";
  ctx.stroke();
  ctx.fillStyle = on ? "#e8e4dc" : "#4a4742";
  ctx.font = "500 10px ui-monospace, Menlo, Consolas, monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 0.5);
  ctx.restore();
}

// A padlock, small enough to sit on a chip.
function drawLock(cx, cy, r, colour) {
  ctx.save();
  ctx.fillStyle = colour;
  ctx.strokeStyle = colour;
  ctx.beginPath();
  ctx.roundRect(cx - r * 0.62, cy - r * 0.1, r * 1.24, r * 0.88, r * 0.18);
  ctx.fill();
  ctx.lineWidth = Math.max(1, r * 0.24);
  ctx.beginPath();
  ctx.arc(cx, cy - r * 0.1, r * 0.38, Math.PI, 0);
  ctx.stroke();
  ctx.restore();
}

/**
 * What the unlock buys, in words. A screen rather than a dialog: it has to
 * say enough to be worth reading, and a fidget toy interrupting you with a
 * modal is a worse thing than a page you chose to open.
 */
function drawPaywall() {
  const veil = sheer();
  if (veil) { ctx.fillStyle = "rgba(12,12,14,0.62)"; ctx.fillRect(0, 0, W, H); }
  const fg = veil ? "#eeeae2" : contrastOn(canvasColor(), 1);
  const dark = fg !== "#3a3a3c";
  const cx = W / 2;

  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = fg;
  ctx.font = "600 " + Math.min(W * 0.062, 34) + "px 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif";
  ctx.fillText("UNLOCK EVERYTHING", cx, H * 0.19);

  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  // Measured, not assumed: at a fixed size the longer promises ran off the
  // right edge of a 390px phone, which is a poor advertisement for care.
  const lx = Math.max(W * 0.16, cx - 230);
  const room = W - lx - Math.max(W * 0.06, 16);
  let lineSize = Math.min(W * 0.03, 14);
  const measure = (px) => {
    ctx.font = "400 " + px + "px 'IBM Plex Mono', ui-monospace, monospace";
    return Math.max(...PAYWALL_LINES.map(l => ctx.measureText(l).width));
  };
  const widest = measure(lineSize);
  if (widest > room) lineSize = Math.max(lineSize * (room / widest), 8);
  ctx.font = "400 " + lineSize + "px 'IBM Plex Mono', ui-monospace, monospace";

  const top = paywallButtons()[0].y;
  const step = Math.min(lineSize * 2.4, (top - H * 0.28) / PAYWALL_LINES.length);
  let ly = H * 0.28 + step * 0.5;
  for (const line of PAYWALL_LINES) {
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(lx - lineSize * 0.9, ly, Math.max(2, lineSize * 0.17), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.85;
    ctx.fillText(line, lx, ly);
    ly += step;
  }
  ctx.globalAlpha = 1;

  // The terms, above the buttons: what it costs, how often, and that it
  // renews — the honest thing to do, and what App Review looks for.
  const prompt = codePromptCell();
  ctx.textAlign = "center";
  const termSize = Math.min(W * 0.028, 12);
  ctx.font = "400 " + termSize + "px 'IBM Plex Mono', ui-monospace, monospace";
  const terms = subscriptionTerms();
  let ty = prompt.y - prompt.h * 0.5 - termSize * terms.length * 1.35;
  for (const line of terms) {
    ctx.globalAlpha = 0.6;
    ctx.fillText(line, cx, ty);
    ty += termSize * 1.35;
  }
  ctx.globalAlpha = 0.7;
  ctx.font = "500 " + Math.min(prompt.h * 0.45, 14) +
             "px 'IBM Plex Mono', ui-monospace, monospace";
  ctx.fillText(CODE_PROMPT, cx, prompt.y + prompt.h / 2);
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";

  for (const c of paywallButtons()) {
    const primary = c.label === "subscribe";
    ctx.beginPath();
    ctx.roundRect(c.x, c.y, c.w, c.h, c.h * 0.22);
    ctx.fillStyle = primary ? "#702929"
      : dark ? "rgba(255,255,255,0.11)" : "rgba(0,0,0,0.09)";
    ctx.fill();
    if (!primary) {
      ctx.lineWidth = 1;
      ctx.strokeStyle = dark ? "rgba(255,255,255,0.22)" : "rgba(0,0,0,0.2)";
      ctx.stroke();
    }
    ctx.textAlign = "center";
    ctx.fillStyle = primary ? "#f0ece4" : fg;
    ctx.globalAlpha = primary ? 1 : 0.75;
    ctx.font = "500 " + (c.h * 0.3) + "px 'IBM Plex Mono', ui-monospace, monospace";
    ctx.fillText(primary ? unlockLabel() : c.label, c.x + c.w / 2, c.y + c.h / 2);
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }
  ctx.restore();
}

/** The keypad, which replaces the buttons once the code row is tapped. */
function drawKeypad() {
  const veil = sheer() ? 0.62 : 0;
  if (veil > 0) { ctx.fillStyle = "rgba(12,12,14," + veil + ")"; ctx.fillRect(0, 0, W, H); }
  const fg = sheer() ? "#eeeae2" : contrastOn(canvasColor(), 1);
  const dark = fg !== "#3a3a3c";
  const cx = W / 2;
  ctx.save();
  ctx.fillStyle = fg;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "600 " + Math.min(W * 0.062, 26) + "px 'IBM Plex Sans', system-ui, sans-serif";
  ctx.fillText(code.wrong ? "NOT THAT ONE" : "ENTER THE CODE", cx, H * 0.19);

  // One dot per digit, filled as they are typed: a row of dots says how long
  // the code is without a field that needs a cursor.
  const cells = keypadCells();
  const r = Math.min(W * 0.014, 7);
  const gap = r * 3.4;
  const dotsY = cells[0].y - r * 6;
  const x0 = cx - ((CODE_LENGTH - 1) * gap) / 2;
  for (let i = 0; i < CODE_LENGTH; i++) {
    ctx.globalAlpha = i < code.entry.length ? 0.9 : 0.25;
    ctx.beginPath();
    ctx.arc(x0 + gap * i, dotsY, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const c of cells) {
    if (!c.label) continue;
    ctx.beginPath();
    ctx.roundRect(c.x, c.y, c.w, c.h, c.h * 0.22);
    ctx.fillStyle = dark ? "rgba(255,255,255,0.11)" : "rgba(0,0,0,0.09)";
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = dark ? "rgba(255,255,255,0.22)" : "rgba(0,0,0,0.2)";
    ctx.stroke();
    ctx.fillStyle = fg;
    ctx.globalAlpha = 0.82;
    ctx.font = "500 " + (c.h * (c.label === "del" ? 0.3 : 0.42)) +
               "px 'IBM Plex Mono', ui-monospace, monospace";
    ctx.fillText(c.label === "del" ? "back" : c.label, c.x + c.w / 2, c.y + c.h / 2);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawMenuButton() {
  if (mode === "bumpers") cornerButton(editButton(), "EDIT", edit.on);
  cornerButton(menuButton(), "\u2261  MENU", false);
}

/**
 * A knurled wheel. It used to be a plain disc with one dot on it, which is
 * why nothing ever looked like it was turning — there was nothing on it to
 * watch. At speed the ribs are drawn wider and fainter, so a fast spin blurs
 * instead of crawling backwards.
 */
function drawDial() {
  const cx = W / 2, cy = H / 2, r = dial.r;
  const a = inkAlpha();
  const base = hexToRgb(inkColor());
  const fast = dialSpeed();
  ctx.save();
  ctx.globalAlpha = a;
  circle(cx, cy, r, inkColor(), false);

  const step = (2 * Math.PI) / DIAL_RIBS;
  const inner = r * 0.54, outer = r * 0.94;
  ctx.lineCap = "round";
  ctx.lineWidth = r * (0.085 + 0.075 * fast);
  for (let i = 0; i < DIAL_RIBS; i++) {
    const ang = dial.angle + step * i;
    const marked = i === 0;              // so a turn stays countable at speed
    ctx.globalAlpha = a * (marked ? 0.95 : 0.8 - 0.3 * fast);
    ctx.strokeStyle = toHex(mix(base, marked ? [0, 0, 0] : [255, 255, 255], marked ? 0.55 : 0.5));
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * inner, cy + Math.sin(ang) * inner);
    ctx.lineTo(cx + Math.cos(ang) * outer, cy + Math.sin(ang) * outer);
    ctx.stroke();
  }

  ctx.globalAlpha = a;
  circle(cx, cy, r * 0.46, toHex(mix(base, [0, 0, 0], 0.28)), false);
  ctx.globalAlpha = Math.max(0.5, a);
  circle(cx, cy, r * 0.46, null, true);
  circle(cx, cy, r, null, true);

  // the index the ribs click past
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = "#702929";
  const tip = cy - r * 1.02;
  ctx.beginPath();
  ctx.moveTo(cx, tip + r * 0.09);
  ctx.lineTo(cx - r * 0.055, tip - r * 0.02);
  ctx.lineTo(cx + r * 0.055, tip - r * 0.02);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawDrawer() {
  const b = drawerBox();
  ctx.save();
  ctx.font = "500 10px ui-monospace, Menlo, Consolas, monospace";
  ctx.textBaseline = "middle";

  ctx.fillStyle = "rgba(232,228,220,0.97)";
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 6);
  ctx.fill(); ctx.stroke();

  const heading = (text, x, y, right) => {
    ctx.fillStyle = "rgba(58,58,60,0.55)";
    ctx.textAlign = right ? "right" : "left";
    ctx.fillText(text, x, y);
    ctx.textAlign = "left";
  };
  const targeted = targetBumper();
  const selFamily = targeted ? targeted.family : ink.family;
  const selTone = targeted ? targeted.tone : ink.tone;
  const left = (targeted ? "BUMPER  ·  " : "INK  ·  ") + FAMILIES[selFamily].name;
  heading(left, b.gx, b.gy - 9);
  // The hint is the first thing to go: "BUMPER · " is longer than "INK · ",
  // and on a narrow panel the two headings ran straight through each other.
  const hint = targeted
    ? "pick a colour for this bumper · esc closes"
    : "1-4 tone · A translucency · K canvas · T tint · esc closes";
  if (ctx.measureText(left).width + ctx.measureText(hint).width + 24 < b.gridW) {
    heading(hint, b.gx + b.gridW, b.gy - 9, true);
  }

  // the whole palette: a column per family, a row per tone
  PALETTE.forEach((tones, c) => {
    tones.forEach((hex, r) => {
      const x = b.gx + c * b.cell, y = b.gy + r * b.cell;
      const lockedFamily = familyLocked(c);
      ctx.save();
      if (lockedFamily) ctx.globalAlpha = 0.25;
      ctx.fillStyle = hex;
      ctx.fillRect(x + 2, y + 2, b.cell - 4, b.cell - 4);
      ctx.restore();
      if (lockedFamily && r === 0) {
        drawLock(x + b.cell / 2, y + b.cell * 1.5, b.cell * 0.26, "rgba(58,58,60,0.7)");
      }
      // a hairline, or the palest tones dissolve into the panel
      ctx.strokeStyle = "rgba(0,0,0,0.18)";
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 2.5, y + 2.5, b.cell - 5, b.cell - 5);
      if (c === selFamily && r === selTone) {
        ctx.strokeStyle = contrastOn(hex);
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 4, y + 4, b.cell - 8, b.cell - 8);
      }
    });
  });

  const chipRow = (y, items, selected, fill, label) => {
    heading(label, b.gx, y - 9);
    for (const c of drawerChips(y, items.length, b)) {
      ctx.fillStyle = "rgba(255,255,255,0.8)";
      ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 3); ctx.fill();
      fill(c);
      ctx.strokeStyle = c.i === selected ? "#3a3a3c" : "rgba(0,0,0,0.18)";
      ctx.lineWidth = c.i === selected ? 2 : 1;
      ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 3); ctx.stroke();
    }
  };

  const centred = (text, c, colour) => {
    ctx.fillStyle = colour;
    ctx.textAlign = "center";
    ctx.fillText(text, c.x + c.w / 2, c.y + c.h / 2);
    ctx.textAlign = "left";
  };
  const painters = {
    // how solid the ink is
    alpha: (c) => {
      ctx.save();
      ctx.globalAlpha = ALPHAS[c.i];
      ctx.fillStyle = inkColor();
      ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 3); ctx.fill();
      ctx.restore();
      centred(Math.round(ALPHAS[c.i] * 100) + "%", c, contrastOn(inkColor(), ALPHAS[c.i]));
    },
    // what the toy sits on
    canvas: (c) => {
      const col = CANVASES[c.i].color;
      if (col) {
        ctx.save();
        if (canvasLocked(c.i)) ctx.globalAlpha = 0.3;
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 3); ctx.fill();
        ctx.restore();
      } else {
        // sheer has no colour to show, so show the absence of one
        ctx.save();
        ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 3); ctx.clip();
        ctx.strokeStyle = "rgba(58,58,60,0.4)";
        ctx.lineWidth = 1;
        for (let x = c.x - c.h; x < c.x + c.w; x += 7) {
          ctx.beginPath();
          ctx.moveTo(x, c.y + c.h);
          ctx.lineTo(x + c.h, c.y);
          ctx.stroke();
        }
        ctx.restore();
      }
      centred(CANVASES[c.i].name, c,
              canvasLocked(c.i) ? "rgba(58,58,60,0.6)" : col ? contrastOn(col, 1) : "#3a3a3c");
    },
    // how sheer the pane over your screen is
    scrim: (c) => {
      ctx.fillStyle = "rgba(0,0,0," + SCRIMS[c.i] + ")";
      ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 3); ctx.fill();
      centred(Math.round(SCRIMS[c.i] * 100) + "%", c, contrastOn("#000000", SCRIMS[c.i]));
    },
    haptic: (c) => {
      ctx.fillStyle = "rgba(58,58,60," + (0.13 + HAPTIC_SCALES[c.i] * 0.59) + ")";
      ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 3); ctx.fill();
      centred(HAPTICS[c.i], c, contrastOn("#3a3a3c", 0.13 + HAPTIC_SCALES[c.i] * 0.59));
    },
  };
  for (const kind of b.kinds) {
    const row = DRAWER_ROW[kind];
    chipRow(b.rowY[kind], row.items(), row.get(), painters[kind], row.label);
  }

  ctx.restore();
}

function drawMiss(now) {
  const age = (now - miss.t) / 420;
  if (age < 0 || age > 1) return;
  ctx.save();
  ctx.globalAlpha = (1 - age) * 0.45;
  ctx.strokeStyle = inkColor();
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(miss.x, miss.y, 7 + age * 24, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawStrip(now) {
  const sh = paint.stripH();
  const cy = H - sh / 2;
  // On a phone the strip is the only way to reach size and shape, and on a
  // phone the cells are half as wide as they are on a laptop: a chip sized
  // off the strip's height alone overlapped its neighbours and ran off the
  // left edge. It gets whichever is smaller.
  const chipCap = sh * 0.28;
  // Graphite chips on the ink canvas are a hole rather than a control. Sheer
  // is left alone: what is behind the window is anyone's guess.
  const chipInk = sheer() ? [58, 58, 60] : hexToRgb(contrastOn(canvasColor(), 1));
  const rgba = (a) => `rgba(${chipInk[0]},${chipInk[1]},${chipInk[2]},${a})`;
  // the transient version fades out over its last half second
  // The strip is a fixture now rather than a reminder that flashes after a
  // key press, so there is nothing left to fade.
  const fade = 1;
  ctx.save();
  ctx.globalAlpha = fade;
  for (const z of stripLayout()) {
    const step = (z.x1 - z.x0) / z.items.length;
    const chipR = Math.min(chipCap, step * 0.42);
    z.items.forEach((item, i) => {
      const cx = z.x0 + step * (i + 0.5);
      if (z.kind === "color") {
        const locked = familyLocked(i);
        ctx.save();
        if (locked) ctx.globalAlpha = 0.3;
        circle(cx, cy, chipR, PALETTE[i][ink.tone], i === ink.family);
        ctx.restore();
        if (locked) drawLock(cx, cy, chipR * 0.62, "rgba(58,58,60,0.8)");
      } else if (z.kind === "size") {
        // each chip is the ball at that size, in miniature
        const rr = chipR * (0.3 + 0.85 * (item / SIZES[SIZES.length - 1]));
        drawShape(ball.shape, cx, cy, rr, 0, rgba(0.55), i === ball.sizeIndex);
      } else {
        drawShape(item, cx, cy, chipR * 0.92, 0,
                  rgba(item === ball.shape ? 1 : 0.35), item === ball.shape);
      }
    });
  }
  ctx.restore();
}

requestAnimationFrame(frame);
</script>
