<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;   /* the scrim is painted by the canvas now */
    cursor: default;
    user-select: none;
  }
  canvas { display: block; position: fixed; inset: 0; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Nonsense desktop renderer — five toys.
//   BALL    : click-drag anywhere and release to flick; bounces off edges.
//             G turns on catching — then you have to land on the ball to
//             grab it, and it stays where you caught it.
//   DIAL    : drag around center to spin, or scroll wheel from anywhere.
//   BUMPERS : the ball plus a table of bumpers that kick it back. The table
//             is editable (E) — move, pull, turn, reshape (outlines and the
//             alphabet), add, delete —
//             and the ball can paint while it plays (P).
//   PAINT   : the ball leaves a trail; colour, size and shape along the
//             bottom, C clears the canvas.
// The ball has eight sizes and six shapes, live in every mode: [ and ] resize
// it, S cycles its shape, the wheel resizes it in ball and bumpers. A
// non-round ball tumbles — impacts impart spin.
// The palette drawer (,) holds fifty-six inks, five levels of translucency
// for the ink, and the screen tint — how sheer the whole pane is.
// Tab cycles modes. 1-4 jumps to a mode. Esc quits.

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// Persistent trail layer, plus a scratch layer for the stroke being laid down
// right now. Translucent ink has to be composited once per stroke: stroking
// segment by segment at low alpha makes every round cap overlap the last and
// re-darken it, so a 15% trail comes out looking solid and beaded.
const trailCanvas = document.createElement("canvas");
const trailCtx = trailCanvas.getContext("2d");
const strokeCanvas = document.createElement("canvas");
const strokeCtx = strokeCanvas.getContext("2d");
let strokeLive = false;

const GRAPHITE = "#3a3a3c";
const OXBLOOD = "#702929";
const RIM = "rgba(0,0,0,0.35)";

// ---- the palette ---------------------------------------------------------
// Nine families, four tones each. The middle tone of each family is a hand
// picked colour — the original six are still in here, in their own columns —
// and the rest are mixed toward white or black from it, so a family holds its
// hue across the range and nothing turns garish.
const FAMILIES = [
  { name: "graphite", base: "#3a3a3c" },
  { name: "bone",     base: "#c9c0ab" },
  { name: "oxblood",  base: "#702929" },
  { name: "rust",     base: "#9c5b3c" },
  { name: "ochre",    base: "#b08940" },
  { name: "moss",     base: "#5c6e4a" },
  { name: "teal",     base: "#3f6b68" },
  { name: "slate",    base: "#465a78" },
  { name: "plum",     base: "#5c3f5e" },
  // Five more. The first nine keep their places: a saved ink is an index, and
  // appending is the only change that does not quietly repaint a bumper table
  // somebody built.
  { name: "cobalt",   base: "#2f4a86" },
  { name: "rose",     base: "#a9596b" },
  { name: "fern",     base: "#3f8248" },
  { name: "umber",    base: "#6d4c33" },
  { name: "ink",      base: "#1d2530" },
];
const TONE_MIX = [0.58, 0.28, 0, -0.38];   // + toward white, - toward black
function hexToRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mix(rgb, target, amount) {
  return rgb.map((v, i) => Math.round(v + (target[i] - v) * amount));
}
function toHex(rgb) {
  return "#" + rgb.map(v => clamp(v, 0, 255).toString(16).padStart(2, "0")).join("");
}
const PALETTE = FAMILIES.map(f => {
  const base = hexToRgb(f.base);
  return TONE_MIX.map(m =>
    toHex(m >= 0 ? mix(base, [255, 255, 255], m) : mix(base, [0, 0, 0], -m)));
});

// How solid the ink is, and how sheer the whole pane is. Both are the point of
// the app rather than decoration: Fidget is a sheer thing over your screen.
const ALPHAS = [0.15, 0.3, 0.5, 0.75, 1];
const SCRIMS = [0, 0.06, 0.12, 0.18, 0.25, 0.34];

// What the toy sits on. Sheer is no ground at all — over a transparent
// Electron window your desktop shows through, which is the reason the thing
// exists. The rest are solid, for a screen that cannot float an app over its
// home screen, or for when you just want a colour to draw on.
const CANVASES = [
  { name: "sheer", color: null },
  { name: "paper", color: "#f4f1ea" },
  { name: "linen", color: "#e2d9c6" },
  { name: "sage",  color: "#b9c0ab" },
  { name: "slate", color: "#59636d" },
  { name: "ink",   color: "#23262b" },
  { name: "black", color: "#0b0c0e" },
];

// A browser can buzz a phone but not a laptop, so the control only appears
// where it would do something. Desktop Chrome has navigator.vibrate and does
// nothing with it, so the presence of the function is not enough on its own —
// it has to be a touch screen as well. That leaves the row hidden on a laptop
// and hidden on an iPhone, where Safari has no vibrate at all.
const CAN_BUZZ = typeof navigator !== "undefined" &&
  typeof navigator.vibrate === "function" && (navigator.maxTouchPoints || 0) > 0;
const HAPTICS = ["off", "soft", "firm"];
const HAPTIC_SCALES = [0, 0.55, 1];

// Paper, not sheer and no longer slate. The see-through window is what the
// desktop build is for, but it is not what most of the toys look best on, and
// a ground you can see is a better first impression than one you cannot.
// Slate was the first answer to that and it was the wrong one: it turned the
// warm palette grey, which is the first thing the design pass called out.
const DEFAULT_CANVAS = 1;
// Slate: the ground the app used to open on, and free because of it. It stays
// free so that changing the default takes nothing away from anyone who had
// already chosen it.
const WAS_DEFAULT_CANVAS = 4;
// voice: on out of the box. It started silent, on the reasoning that a toy
// making noise the moment you open it is one you put down — but a sound you
// have to find at the bottom of a drawer is one nobody learns exists.
// scrim: none out of the box. A screen tint is there for the sheer window,
// where the toy floats over whatever is behind it; on a solid ground it only
// greys the paper down, which is half of why the app read grey and generic.
const ink = { family: 0, tone: 2, alpha: 4, scrim: 0, canvas: DEFAULT_CANVAS, haptic: 2,
              voice: 2 };
function canvasColor() { return CANVASES[ink.canvas].color; }
function sheer() { return !canvasColor(); }
function hapticScale() { return HAPTIC_SCALES[ink.haptic]; }
function buzz(ms) {
  if (!CAN_BUZZ) return;
  const scaled = Math.round(ms * hapticScale());
  if (scaled > 0) { try { navigator.vibrate(scaled); } catch (e) {} }
}

// Beats in a knock, at the hardest. A single buzz at full strength is only
// longer than a soft one; what a hard hit feels like is several things
// arriving at once, so the harder it lands the more of them there are.
const BUMPS_MAX = 4;
// Close enough together to read as one event with texture rather than as taps
// you could count; further apart and a hard hit turns into a stutter.
const BUMP_GAP_MS = 17;
// The burst falls away rather than repeating flat, which is what a thing
// settling does.
const BUMP_FALLOFF = 0.45;

/**
 * How many beats a hit of this strength is felt as, and how hard each one is.
 * A wall gets one beat fewer than a bumper: it is a flat thing to hit, and a
 * bumper throws the ball back.
 */
function impactBumps(hit, wall) {
  if (hit <= 0) return 0;
  const most = wall ? BUMPS_MAX - 1 : BUMPS_MAX;
  return clamp(1 + Math.floor(hit * most), 1, most);
}
function bumpLevel(hit, wall, i) {
  const n = impactBumps(hit, wall);
  if (n <= 0 || i < 0 || i >= n) return 0;
  if (n === 1) return hit;
  return hit * (1 - (1 - BUMP_FALLOFF) * (i / (n - 1)));
}

/**
 * A landing, felt. `vibrate` takes a pattern — on, off, on, off — so the whole
 * burst goes to the actuator in one call rather than as timers this page would
 * have to keep.
 */
function bumpBuzz(hit, wall) {
  if (!CAN_BUZZ) return;
  const n = impactBumps(hit, wall);
  if (n <= 0) return;
  const scale = hapticScale();
  if (scale <= 0) return;
  const pattern = [];
  for (let i = 0; i < n; i++) {
    if (i > 0) pattern.push(BUMP_GAP_MS);
    pattern.push(Math.max(1, Math.round((9 + 15 * bumpLevel(hit, wall, i)) * scale)));
  }
  try { navigator.vibrate(pattern); } catch (e) {}
}
// ---- sound ---------------------------------------------------------------
// The toy decides what is played and renders it; the browser only pushes the
// buffer at a speaker. The arithmetic is the same as the Kotlin and the Swift,
// which is why the three builds sound like the same instrument.
//
// Off first, because a fidget toy that makes noise the moment it is opened is
// a fidget toy you put down.
const VOICES = ["off", "organ", "keys", "drum", "bell", "pluck"];
const OFF = 0, ORGAN = 1, KEYS = 2, DRUM = 3, BELL = 4, PLUCK = 5;

// A minor pentatonic, in semitones. Any two notes of it played together are
// consonant, which is the whole reason a toy that picks its pitches from what
// the ball happens to hit does not sound like a wrong-number tone.
const SCALE = [0, 3, 5, 7, 10];
// Four, counting upward from the root — one more than there was. It tops out
// where three from A3 did, so nothing that used to be reachable is gone; what
// is new is underneath.
const OCTAVES = 4;
// A2. It was A3, 220Hz, so every note the toy could play lived between 220
// and about 1760Hz — and physical mass is heard at 60–160Hz, where there was
// nothing at all. The single largest reason a hit had no weight to it.
const ROOT_HZ = 110;
const NOTE_ATTACK = 0.004;
// How much faster a high partial dies than the fundamental. Zero is one
// envelope over every partial, which holds a note's brightness constant for
// its whole tail and is the single largest cause of "tinny"; one is very dark
// very fast. At 0.65 the fourth partial's tail is about 40% of the
// fundamental's. Worth auditioning between 0.4 and 0.9.
const PARTIAL_DECAY = 0.65;
// The click of contact: how loud, and how fast it is gone. Impact is a
// wideband click a few milliseconds long, layered under the tone. Only the
// drum had anything like it; every other voice began with a 4ms ramp into a
// steady tone, which reads as a beep starting rather than a thing being
// struck.
function voiceStrike(voice) {
  switch (voice) {
    case ORGAN: return 0.10;   // air, not impact
    case KEYS:  return 0.30;   // hammer felt
    case DRUM:  return 0.45;   // stick on head
    case BELL:  return 0.35;   // metal on metal
    default:    return 0.28;
  }
}
const STRIKE_TIME = 0.006;
// Where the sustained noise is rolled off. randUnit is full-band white, and
// unfiltered white has most of its energy above 5kHz — hiss, which works
// against mass rather than for it. Glass is the exception and gets the top of
// this range: it is mostly noise by design, and the drum's cutoff dulls the
// one thing it is meant to sound like. A note carries its own extra grit, so
// the cutoff rides that rather than needing a voice of its own.
const NOISE_HZ = 1400;
const NOISE_HZ_GRIT = 3500;
// What the filter costs in level, put back.
const NOISE_MAKEUP = 1.8;
// How far the pitch falls as the first deformation relaxes, and over how long.
// Any struck object does this; only the drum used to.
function voiceDrop(voice) { return voice === DRUM ? DRUM_DROP : 0.06; }
function voiceDropTime(voice) { return voice === DRUM ? DRUM_DROP_TIME : 0.012; }
// Raised, now that the sum of everything above is louder than what it
// replaced — and safe to raise because the clamp is soft.
const NOTE_HEADROOM = 0.38;
const DRUM_DROP = 0.55, DRUM_DROP_TIME = 0.035;
const MAX_NOTES = 8;

function semitone(step) {
  const span = SCALE.length * OCTAVES;
  const n = ((step % span) + span) % span;
  return SCALE[n % SCALE.length] + 12 * Math.floor(n / SCALE.length);
}
function noteHz(step) { return ROOT_HZ * Math.pow(2, semitone(step) / 12); }

// An organ is the harmonics of a pipe, keys a struck string's first two, a
// bell deliberately inharmonic — 2.76 and 5.40 are the tuning of a real one,
// and are why it rings rather than hums — and a pluck a thinned sawtooth.
function partials(voice) {
  switch (voice) {
    // The half-multiple is a sub an octave below the fundamental: a pipe and
    // a struck string both have real energy down there, and it is the cheapest
    // body there is. The upper partials come down as it goes in, so the
    // balance moves downward rather than the note simply getting louder.
    case ORGAN: return [[0.5, 0.30], [1, 0.55], [2, 0.20], [3, 0.09], [4, 0.03]];
    case KEYS:  return [[0.5, 0.22], [1, 0.70], [2, 0.16], [5, 0.03]];
    case DRUM:  return [[1, 0.9]];
    case BELL:  return [[1, 0.5], [2.76, 0.3], [5.40, 0.16], [8.93, 0.06]];
    default:    return [[1, 0.5], [2, 0.25], [3, 0.16], [4, 0.12], [5, 0.1]];
  }
}
function voiceDecay(voice) {
  switch (voice) {
    case ORGAN: return 0.42;
    case KEYS:  return 0.55;
    case DRUM:  return 0.20;
    case BELL:  return 1.35;
    default:    return 0.70;
  }
}
/** How much of a note is noise rather than pitch. */
function voiceGrit(voice) {
  return voice === DRUM ? 0.55 : voice === PLUCK ? 0.12 : 0.02;
}
function noteSamples(note, rate) {
  return clamp(Math.floor(rate * voiceDecay(note.voice) * note.hold * 1.05), 1, rate * 3);
}
/** Fills `out` with the note; returns how many samples were written. */
function renderNote(note, rate, out) {
  const n = Math.min(noteSamples(note, rate), out.length);
  if (note.voice === OFF || n <= 0) return 0;
  const f0 = noteHz(note.step);
  const parts = partials(note.voice);
  const decay = voiceDecay(note.voice) * note.hold;
  const grit = clamp(voiceGrit(note.voice) + note.grit, 0, 1);
  const gain = clamp(note.gain, 0, 1) * NOTE_HEADROOM;
  let seed = note.seed;
  // One pole of lowpass on the sustained noise, and its state.
  let lp = 0;
  const cut = NOISE_HZ + (NOISE_HZ_GRIT - NOISE_HZ) * clamp(note.grit, 0, 1);
  const lpA = 1 - Math.exp((-2 * Math.PI * cut) / rate);
  for (let i = 0; i < n; i++) {
    const t = i / rate;
    // A short attack so a hit is a hit and not a click. The tail is
    // per-partial now rather than one envelope over the lot.
    const env = t < NOTE_ATTACK ? t / NOTE_ATTACK : 1;
    // A struck thing starts sharp and settles: the deformation of the strike
    // relaxes and the pitch comes down to where it belongs.
    //
    // The bend is integrated into the phase rather than multiplied into t.
    // Multiplying scales the whole elapsed phase by a factor that is still
    // moving, which is not a pitch dip at all — it leaves the note
    // permanently detuned by the size of the drop once the exponential has
    // settled. Integrating gives the dip and then hands the pitch back.
    const dr = voiceDrop(note.voice);
    const tau = voiceDropTime(note.voice);
    const phase = t + dr * tau * (1 - Math.exp(-t / tau));
    let v = 0;
    for (const [mult, amp] of parts) {
      // Higher partials die first, which is what a struck thing does: bright
      // at the strike, warm a tenth of a second later. One envelope across
      // all of them held the brightness constant for the whole tail, and
      // that is what "tinny" is.
      const d = decay / Math.pow(Math.max(mult, 0.5), PARTIAL_DECAY);
      v += amp * Math.sin(2 * Math.PI * f0 * mult * phase) * Math.exp((-4 * t) / d);
    }
    v *= 1 - grit;
    if (grit > 0) {
      seed = nextRand(seed);
      // The noise keeps the plain tail: it has no partials to shed, and
      // giving it the fundamental's decay is what makes a drum still sound
      // like one.
      lp += lpA * (randUnit(seed) - lp);
      v += grit * lp * NOISE_MAKEUP * Math.exp((-4 * t) / decay);
    }
    // The contact click, on the front of every voice. Scaled by how hard the
    // hit was rather than only made louder by it: a hard hit should be
    // *sharper*, and that relationship is most of what "physical" means. Left
    // unfiltered on purpose — a click is wideband, and the contrast between a
    // bright click and a dark body is most of the realism.
    const st = voiceStrike(note.voice);
    if (st > 0 && t < STRIKE_TIME * 6) {
      seed = nextRand(seed);
      v += st * randUnit(seed) * Math.exp(-t / STRIKE_TIME) * (0.5 + 0.5 * note.gain);
    }
    // Soft, not hard: a clamp that squares off the peaks of a chord is harsh
    // in exactly the way that reads as cheap.
    out[i] = Math.tanh(v * env * gain * 1.15);
  }
  return n;
}

let noteSeed = 0x7c9d;
const notes = [];
function say(step, gain, grit = 0, hold = 1) {
  if (ink.voice === OFF || gain <= 0.02 || notes.length >= MAX_NOTES) return;
  noteSeed = nextRand(noteSeed);
  notes.push({ voice: ink.voice, step, gain, grit, hold, seed: noteSeed });
}
/**
 * Where on the field a hit was, as a degree of the scale: up the screen is up
 * the scale, which is the mapping anyone expects without being told.
 */
function stepAt(px, py) {
  const range = SCALE.length * OCTAVES;
  const up = 1 - clamp(py / Math.max(H, 1), 0, 1);
  const across = clamp(px / Math.max(W, 1), 0, 1);
  return clamp(Math.floor(up * (range - 1) + (across - 0.5) * 1.5), 0, range - 1);
}
/**
 * A bumper's note: the bigger it is the lower it sounds, which is what a
 * bigger thing does, and its tone nudges it within that so two bumpers of a
 * size are not in unison.
 */
function bumperStep(b) {
  const range = SCALE.length * OCTAVES;
  const big = clamp((b.size - MIN_SIZE) / (MAX_SIZE - MIN_SIZE), 0, 1);
  return clamp(Math.floor((1 - big) * (range - 3) + b.tone), 0, range - 1);
}

// The speaker. Built on the first note rather than at load, because a browser
// will not let a page make a sound until somebody has touched it.
const AUDIO_RATE = 22050;
let audioCtx = null;
let scratch = null;
function playNotes() {
  if (!notes.length) return;
  const batch = notes.splice(0, notes.length);
  if (ink.voice === OFF) return;
  try {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audioCtx = new Ctx({ sampleRate: AUDIO_RATE });
      scratch = new Float32Array(AUDIO_RATE * 3);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    for (const note of batch) {
      const n = renderNote(note, audioCtx.sampleRate, scratch);
      if (!n) continue;
      const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
      buf.copyToChannel(scratch.subarray(0, n), 0);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      src.start();
    }
  } catch (e) { /* no audio here — the toy still works */ }
}

function inkColor() { return PALETTE[ink.family][ink.tone]; }
function inkAlpha() { return ALPHAS[ink.alpha]; }

// Eight steps, from a bead to a grapefruit, as multiples of the base radius.
const SIZES = [0.12, 0.2, 0.3, 0.5, 0.7, 1.0, 1.45, 2.1];
const DEFAULT_SIZE = 5;   // 1.0 — the original ball

const MODES = ["ball", "dial", "bumpers", "bolt", "glass", "paint"];
let mode = "ball";

// The app opens on its own name and a list of what it can do, rather than
// dropping you straight into whichever toy you left running. None of them
// announce themselves from the inside — a field with a ball in it looks the
// same whether or not it will let you paint.
let screen = "title";

// ---- free, or bought once ------------------------------------------------
// The Android build sells this; here it is the reference implementation and
// the demo, so it runs unlocked. Add ?free=1 to see exactly what the free
// tier gets — which is how the paywall gets looked at without a phone.
const FREE_FAMILIES = 3;      // graphite, bone, oxblood
const FREE_CANVASES = 2;      // sheer, and one to draw on
let tier = (typeof location !== "undefined" &&
            new URLSearchParams(location.search).has("free")) ? "free" : "full";
function full() { return tier === "full"; }
// The ball is the free toy. Everything else — the dial, the table,
// lightning, paint — is the unlock.
function modeLocked(m) { return !full() && m !== "ball"; }
function editLocked() { return !full(); }
function familyLocked(i) { return !full() && i >= FREE_FAMILIES; }
// The ground the app opens on is free whatever tier you are on: a default
// nobody can use is not a default.
function canvasLocked(i) {
  return !full() && i >= FREE_CANVASES && i !== DEFAULT_CANVAS
         && i !== WAS_DEFAULT_CANVAS;
}

let paywallFrom = "title";
function showPaywall() {
  if (screen === "paywall") return;
  paywallFrom = screen;
  screen = "paywall";
}
function dismissPaywall() { screen = paywallFrom; }
function unlockEverything() {
  tier = "full";
  if (screen === "paywall") dismissPaywall();
}
const PAYWALL_LINES = [
  "the dial, the bumper table and lightning",
  "paint — the ball leaves ink wherever it goes",
  "arrange the table, and colour every bumper",
  "all fifty-six inks and all seven canvases",
  "no account, no ads, nothing collected",
];
const PAYWALL_LABELS = ["subscribe", "restore", "not now"];
const PRICE_FALLBACK = "$1.99";
// There is no store behind a web page, so the price is only ever the list
// one here. On a phone it comes from Play or StoreKit, localised.
let priceText = null;
function unlockLabel() { return "subscribe  ·  " + (priceText || PRICE_FALLBACK) + "/mo"; }
const CODE_PROMPT = "have a code?";
// The unlock code, stored as a hash rather than as itself, so reading this
// file does not hand it over. Obfuscation and not security: four digits is
// ten thousand guesses and the gate is a client-side boolean either way. It
// exists so a code can be handed to a tester without handing over the app.
const CODE_HASH = 553159795;
const CODE_LENGTH = 4;
function codeHash(entry) {
  let h = -2128831035;
  const t = "nonsense/" + entry;
  for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h | 0;
}
const code = { open: false, entry: "", wrong: false };
function openCode() { code.open = true; code.entry = ""; code.wrong = false; }
function closeCode() { code.open = false; code.entry = ""; code.wrong = false; }
function typeCode(key) {
  code.wrong = false;
  if (key === "del") { code.entry = code.entry.slice(0, -1); return false; }
  if (code.entry.length >= CODE_LENGTH) return false;
  code.entry += key;
  if (code.entry.length < CODE_LENGTH) return false;
  if (codeHash(code.entry) === CODE_HASH) { closeCode(); unlockEverything(); return true; }
  code.wrong = true;
  code.entry = "";
  return false;
}
const KEYPAD_KEYS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "del"];
function keypadCells() {
  const cw = Math.min(W * 0.74, 420);
  const gap = cw * 0.04;
  const bw = (cw - gap * 2) / 3;
  const bh = Math.min(bw * 0.62, H * 0.082, 56);
  const x = (W - cw) / 2;
  const top = H - bh * 0.5 - 4 * bh - 3 * gap;
  return KEYPAD_KEYS.map((label, i) => ({
    i, label, x: x + (bw + gap) * (i % 3), y: top + (bh + gap) * Math.floor(i / 3),
    w: bw, h: bh,
  }));
}
function keypadHit(px, py) {
  for (const c of keypadCells())
    if (c.label && px >= c.x && px <= c.x + c.w && py >= c.y && py <= c.y + c.h) return c.label;
  return null;
}
function codePromptCell() {
  const b = paywallButtons()[0];
  const h = Math.min(H * 0.05, b.h * 0.7);
  return { x: b.x, y: b.y - h - h * 0.35, w: b.w, h };

  pentagon: ngon(5),

// ---- ball (shared by ball, bumpers, paint) -------------------------------

    if (glyphHit(p.x, p.y) === "outside") closeGlyphs(); else buzz(10);
    return;
  }

  if (drawerOpen) {
    if (drawerHit(p.x, p.y) === "outside") closeDrawer();
    return;
  }

  if (editButtonHit(p.x, p.y)) {
    if (editLocked()) { showPaywall(); return; }
    edit.on = !edit.on;
    edit.sel = -1;
    if (!edit.on) closeDrawer();
    return;
  }

  // The dock is over the field, so it answers first.
  if (inDock(p.x, p.y)) {
    const what = dockHit(p.x, p.y);
    if (what && what !== "panel") {
      const did = tapDock(what);
      if (did === "clear") { clearTrail(); clearEtched(); breaks.length = 0; }
      if (did !== "panel") buzz(did === "tool" ? 14 : 10);
    }
    return;
  }

  if (edit.on && mode === "bumpers") {
    const hit = toolbarHit(p.x, p.y);
    if (hit) { doToolbar(hit.label); return; }
    if (edit.sel >= 0 && table[edit.sel]) {
      const hs = handles(table[edit.sel]);
      if (Math.hypot(p.x - hs.pull[0], p.y - hs.pull[1]) < 14) { edit.drag = "pull"; return; }
      if (Math.hypot(p.x - hs.rotate[0], p.y - hs.rotate[1]) < 14) { edit.drag = "rotate"; return; }
    }

        edit.grabDX = p.x - table[i].nx * W;

    // because glass does not wait to see whether you meant it.
    breakGlass(p.x, p.y);

    // sample window, which already exists to measure a flick.
    ball.samples = [{ x: p.x, y: p.y, t: performance.now() }];

    ball.grabDY = caught ? ball.y - p.y : 0;
    ball.dragging = true;
    if (!caught) { ball.x = p.x; ball.y = p.y; }
    ball.vx = 0; ball.vy = 0;
    ball.omega = 0;
    ball.samples = [{ x: p.x, y: p.y, t: performance.now() }];
    if (painting()) {
      paint.lastX = ball.x; paint.lastY = ball.y; paint.started = true;

  }
});

let boltAiming = false;

canvas.addEventListener("pointermove", (e) => {
  if (screen !== "play") return;
  const p = local(e);

  if (mode === "bolt") {
    if (!boltAiming) return;
    const now = performance.now();
    ball.samples.push({ x: p.x, y: p.y, t: now });
    while (ball.samples.length > 2 && now - ball.samples[0].t > 100) ball.samples.shift();
    return;
  }

  if (edit.on && mode === "bumpers") {
    const b = table[edit.sel];
    if (!b || !edit.drag) return;
    if (edit.drag === "move") {
      b.nx = clamp((p.x - edit.grabDX) / W, 0, 1);
      b.ny = clamp((p.y - edit.grabDY) / H, 0, 1);
    } else if (edit.drag === "pull") {
      pullTo(b, p.x, p.y);
    } else if (edit.drag === "rotate") {
      b.rot = Math.atan2(p.y - b.ny * H, p.x - b.nx * W) - Math.PI / 2;

    return;
  }

    if (!dial.grab) return;
    const a = angleTo(p.x, p.y);

    while (d > Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;

    const dt = Math.max(now - dial.lastTime, 1) / 1000;
    dial.angle += d;
    dial.lastAngle = a;
    dial.lastTime = now;
    // A finger nearly always stalls for a frame before it lifts, so reading
    // the last sample alone handed a hard flick back a wheel at rest.
    dial.samples.push({ d, dt });
    let held = dial.samples.reduce((t, s) => t + s.dt, 0);
    while (held > DIAL_WINDOW / 1000 && dial.samples.length > 1)
      held -= dial.samples.shift().dt;
    dial.omega = clamp(dialWindowOmega(), -MAX_DIAL_OMEGA, MAX_DIAL_OMEGA);
    dialDetents();

    ball.x = p.x + ball.grabDX; ball.y = p.y + ball.grabDY;
    const now = performance.now();
    ball.samples.push({ x: p.x, y: p.y, t: now });
    while (ball.samples.length > 2 && now - ball.samples[0].t > 100)
      ball.samples.shift();

  }
});

canvas.addEventListener("pointerup", () => {
  if (screen !== "play") return;

  if (mode === "bolt") {
    boltAiming = false;
    const s = ball.samples;
    if (s.length >= 2) {
      const a = s[0], b = s[s.length - 1];
      const dt = Math.max(b.t - a.t, 1) / 1000;
      fireBolt(b.x, b.y, (b.x - a.x) / dt, (b.y - a.y) / dt);
    }
    return;
  }

  if (edit.on) { if (edit.drag) saveTable(); edit.drag = null; return; }
  if (mode !== "dial" && ball.dragging) {
    ball.dragging = false;
    const s = ball.samples;
    if (s.length >= 2) {
      const a = s[0], b = s[s.length - 1];
      const dt = Math.max(b.t - a.t, 1) / 1000;
      ball.vx = (b.x - a.x) / dt;
      ball.vy = (b.y - a.y) / dt;
      // a flick sets it turning, the way a thrown object does
      ball.omega = clamp(ball.omega + (ball.vx / Math.max(ballR(), 1)) * 0.25, -30, 30);
    }
  }
  if (dial.grab) {
    // letting go of a moving wheel throws it, rather than handing it back
    dial.omega = clamp(dialWindowOmega() * 1.4, -MAX_DIAL_OMEGA, MAX_DIAL_OMEGA);
    dial.samples.length = 0;
  }
  dial.grab = false;
});

window.addEventListener("wheel", (e) => {
  if (screen !== "play") return;
  if (mode === "dial") {
    dial.omega = clamp(dial.omega + e.deltaY * 0.02, -MAX_DIAL_OMEGA, MAX_DIAL_OMEGA);
    return;
  }
  if (edit.on) return;
  // the wheel resizes the ball wherever the ball is the toy
  const dir = e.deltaY > 0 ? -1 : 1;
  ball.sizeIndex = clamp(ball.sizeIndex + dir, 0, SIZES.length - 1);
  stripFlash = performance.now() + 2200;
  saveBall();
});

window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();

  if (screen === "paywall") {
    if (code.open) {
      if (e.key === "Escape") closeCode();
      else if (e.key === "Backspace") typeCode("del");
      else if (/^[0-9]$/.test(e.key)) typeCode(e.key);
      return;
    }
    if (e.key === "Escape") dismissPaywall();
    return;
  }

  if (screen === "title") {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= MODES.length) { openFromMenu(MODES[n - 1]); return; }
    if (e.key === "Enter" || e.key === " ") { openFromMenu("ball"); return; }
    if (e.key === "Escape") { window.nonsense ? window.nonsense.quit() : window.close(); }
    return;
  }

  if (e.key === "Escape") {
    if (glyphOpen) { closeGlyphs(); return; }
    if (drawerOpen) { closeDrawer(); return; }
    if (edit.on) { edit.on = false; edit.sel = -1; return; }
    // Out to the menu first. Escape only leaves once there is nowhere left.
    settleStroke();
    screen = "title";
    return;
  }
  if (e.key === ",") { drawerOpen = !drawerOpen; if (drawerOpen) closeGlyphs(); return; }
  if (e.key === "." && edit.on && mode === "bumpers") {
    glyphOpen = !glyphOpen;
    if (glyphOpen) closeDrawer();
    return;
  }
  if (glyphOpen) {
    // While the sheet is up a key is the glyph it prints, digits included —
    // which is the one thing a keyboard does better than a grid of cells.
    const b = table[edit.sel];
    const up = e.key.length === 1 ? e.key.toUpperCase() : "";
    if (b && GLYPHS.includes(up)) { b.glyph = up; saveTable(); }
    return;
  }
  if (drawerOpen) {
    // while the drawer is up the number keys pick a tone
    const t = parseInt(e.key, 10);
    if (t >= 1 && t <= TONE_MIX.length) { settleStroke(); ink.tone = t - 1; saveInk(); }
    if (k === "a") { settleStroke(); ink.alpha = (ink.alpha + 1) % ALPHAS.length; saveInk(); }
    if (k === "t") { ink.scrim = (ink.scrim + 1) % SCRIMS.length; saveInk(); }
    if (k === "k") { ink.canvas = (ink.canvas + 1) % CANVASES.length; saveInk(); }
    return;
  }
  if (e.key === "Tab") {
    e.preventDefault();
    edit.on = false;
    // Skip past anything locked: being ambushed by a shop mid-fidget is
    // worse than having three toys in the rotation.
    let next = mode;
    for (let i = 0; i < MODES.length; i++) {
      next = MODES[(MODES.indexOf(next) + 1) % MODES.length];
      if (!modeLocked(next)) { mode = next; break; }
    }
  }

  const n = parseInt(e.key, 10);
  if (edit.on && mode === "bumpers") {
    // while editing, the number keys pick a bumper shape instead of a mode
    if (n >= 1 && n <= SHAPES.length && table[edit.sel]) {
      table[edit.sel].shape = SHAPES[n - 1];
      table[edit.sel].glyph = "";      // a number picks an outline, not a letter
      saveTable();
    }
    // Shift and a letter sets that letter, because plain "a" is already add
    // and a keyboard is the one place a whole alphabet can be reached at once.
    if (e.shiftKey && GLYPHS.includes(e.key) && table[edit.sel]) {
      table[edit.sel].glyph = e.key; saveTable();
    }
    if (k === "a" && !e.shiftKey) doToolbar("+ add");
    if (e.key === "Delete" || e.key === "Backspace") doToolbar("delete");
    if (k === "r") doToolbar("rotate");
    if (k === "[") doToolbar("size -");
    if (k === "]") doToolbar("size +");
  } else {
    if (n >= 1 && n <= MODES.length) {
      if (modeLocked(MODES[n - 1])) showPaywall(); else mode = MODES[n - 1];
    }
    // the ball's own size and shape, live in every mode
    if (k === "[" || k === "]") {
      ball.sizeIndex = clamp(ball.sizeIndex + (k === "]" ? 1 : -1), 0, SIZES.length - 1);
      stripFlash = performance.now() + 2200;
      saveBall();
    }
    if (k === "g" && mode === "ball") { ball.mustCatch = !ball.mustCatch; saveBall(); }
    if (k === "a") {
      settleStroke();
      ink.alpha = (ink.alpha + (e.shiftKey ? -1 : 1) + ALPHAS.length) % ALPHAS.length;
      saveInk();
    }
    if (k === "t") {
      ink.scrim = (ink.scrim + (e.shiftKey ? -1 : 1) + SCRIMS.length) % SCRIMS.length;
      saveInk();
    }
    if (k === "s") {
      const step = e.shiftKey ? -1 : 1;
      ball.shape = SHAPES[(SHAPES.indexOf(ball.shape) + step + SHAPES.length) % SHAPES.length];
      ball.spin = 0;
      stripFlash = performance.now() + 2200;
      saveBall();
    }
  }

  if (k === "e" && mode === "bumpers") {
    if (editLocked()) showPaywall();
    else { edit.on = !edit.on; edit.sel = -1; }
  }
  if (k === "p" && mode === "bumpers") { paint.onBumpers = !paint.onBumpers; }
  if (k === "c") {
    if (painting()) clearTrail();
    if (mode === "bolt") clearEtched();
    if (mode === "glass") clearGlass();
  }
});

// ---- edit toolbar --------------------------------------------------------
// Drawn on the canvas rather than in the DOM: it can't be covered by whatever
// chrome is hosting the page, and it works the same in Electron and a browser.
const TOOLBAR_LABELS =
  ["+ add", "shape", "rotate", "size -", "size +", "ink", "delete", "reset", "done"];

/**
 * The edit ribbon, measured to the text and then shrunk until the whole row
 * fits the window. Nine buttons at a fixed size are 560-odd pixels, so on a
 * phone the last three ran off the right edge — drawn, and unreachable, which
 * is the worst of both. It scales rather than wraps: two rows of buttons over
 * the toy is more of the screen gone than a smaller row is hard to hit.
 */
function toolbar() {
  const edge = 14;
  const gap = 6;
  let size = 12, pad = 10, h = 30;
  let widths = [], total = 0;
  for (let i = 0; i < 14; i++) {
    ctx.font = "500 " + size + "px ui-monospace, Menlo, Consolas, monospace";
    widths = TOOLBAR_LABELS.map((l) => ctx.measureText(l).width + pad * 2);
    total = widths.reduce((a, b) => a + b, 0) + gap * (TOOLBAR_LABELS.length - 1);
    if (total <= W - edge * 2) break;
    // Trim the padding first — it buys width without costing legibility —
    // and only then the type.
    if (pad > 4) pad -= 1; else { size -= 0.5; h = Math.max(22, h - 1); }
    if (size <= 7) break;
  }
  const y = 14 + INSET_TOP;
  let x = edge;
  return TOOLBAR_LABELS.map((label, i) => {
    const r = { label, x, y, w: widths[i], h, size, pad };
    x += widths[i] + gap;
    return r;
  });
}
function toolbarHit(px, py) {
  return toolbar().find(b => px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h);
}
/**
 * The two handles, in the bumper's own frame. The red one sits on the corner
 * of the stretched box and pulls both axes at once, so making a bar long and
 * thin needs no third handle and no modifier key — neither of which a phone
 * has anywhere to put.
 */
function handles(b) {
  const g = geom(b);
  const cos = Math.cos(b.rot), sin = Math.sin(b.rot);
  const hx = g.r * (b.sx ?? 1), hy = g.r * (b.sy ?? 1);
  const reach = Math.max(hx, hy) + Math.min(W, H) * 0.06;
  return {
    pull: [g.cx + hx * cos - hy * sin, g.cy + hx * sin + hy * cos],
    rotate: [g.cx - reach * sin, g.cy + reach * cos],

}

/**
 * Pull the bumper to a point: the drag is taken into the bumper's own frame,
 * so the axis you pull along is the axis that grows however far round the
 * thing has been turned.
 */
function pullTo(b, px, py) {
  const r = Math.max(b.size * Math.min(W, H), 1e-4);
  const cos = Math.cos(-b.rot), sin = Math.sin(-b.rot);
  const dx = px - b.nx * W, dy = py - b.ny * H;
  b.sx = clamp(Math.abs(dx * cos - dy * sin) / r, MIN_STRETCH, MAX_STRETCH);
  b.sy = clamp(Math.abs(dx * sin + dy * cos) / r, MIN_STRETCH, MAX_STRETCH);
}

/**
 * Everything a bumper can be cut into, laid out at once.
 *
 * This used to be one button that stepped forward: six outlines, then A, then
 * B, and so on. Thirty-two taps to get back where you started, and — worse —
 * nothing on screen ever said the letters were there at all, so for most
 * people they were not. The palette had exactly this problem and was fixed by
 * showing the whole thing; this is the same fix, and it is what makes the
 * digits worth adding rather than ten more taps to bury.
 */
let glyphOpen = false;
const GLYPH_COLS = 7;
function closeGlyphs() { glyphOpen = false; }
function glyphCount() { return SHAPES.length + GLYPHS.length; }

function glyphTextAt(i) { return i < SHAPES.length ? "" : GLYPHS[i - SHAPES.length]; }

}
function glyphSheet() {

  const pad = 18, label = 15;
  const cell = Math.min((w - pad * 2) / GLYPH_COLS, 58);
  const h = pad + label + cell * rows + pad;
  const x = (W - w) / 2, y = clamp(H - h - 14, 8, H);

    w: s.cell, h: s.cell,

/**
 * A cell drawn as the bumper it would make, so the sheet is a preview and not
 * a legend: the same outline code, the same ink, the same everything but
 * where it sits.

function glyphSample(i, cx, cy, r) {
  const sel = table[edit.sel];
  return sane({
    nx: cx / W, ny: cy / H, size: r / Math.min(W, H),
    shape: glyphShapeAt(i), rot: 0,

function glyphHit(px, py) {

  const b = table[edit.sel];
  if (!b) return "panel";
  for (const c of glyphCells()) {
    if (px < c.x || px > c.x + c.w || py < c.y || py > c.y + c.h) continue;
    // A glyph covers whatever outline is under it, so leave that alone: pick
    // B over a hexagon, then pick the hexagon back.
    if (c.i < SHAPES.length) { b.shape = SHAPES[c.i]; b.glyph = ""; }

function doToolbar(label) {

    table.push(sane({ nx: 0.5, ny: 0.4, size: 0.06, shape: "circle", rot: 0 }));
    edit.sel = table.length - 1;
  } else if (label === "shape" && b) {
    // The whole set at once. It was a step-forward button and the letters may
    // as well not have existed; see the glyph sheet.
    glyphOpen = !glyphOpen;
    if (glyphOpen) closeDrawer();
    return;

    b.rot += Math.PI / 12;
  } else if (label === "ink" && b) {

    // when the whole palette already exists.
    drawerOpen = true; drawerTarget = "bumper"; closeGlyphs();
    return;
  } else if (label === "size -" && b) {
    b.size = clamp(b.size * 0.88, MIN_SIZE, MAX_SIZE);
  } else if (label === "size +" && b) {
    b.size = clamp(b.size * 1.14, MIN_SIZE, MAX_SIZE);
  } else if (label === "delete" && b) {
    // the drawer cannot stay pointed at a bumper that is going away
    table.splice(edit.sel, 1); edit.sel = -1; closeDrawer(); closeGlyphs();
  } else if (label === "reset") {
    table = DEFAULT_BUMPERS.map(sane); edit.sel = -1; closeDrawer(); closeGlyphs();
  } else if (label === "done") {
    edit.on = false; edit.sel = -1; closeDrawer(); closeGlyphs();
  }

// ---- loop ----------------------------------------------------------------
let last = performance.now();
function frame(now) {

  playNotes();
  ctx.clearRect(0, 0, W, H);

  // The sheer scrim. It used to be a CSS background on the body; painting it
  // here instead means one adjustable value, and it behaves the same over a
  // transparent Electron window as it does inside a page.
  // The ground. Sheer paints nothing, so a transparent window keeps showing
  // your desktop through it; any other canvas is laid down solid first. The
  // tint then washes over either one, so it means the same thing in both.
  const ground = canvasColor();
  if (ground) { ctx.fillStyle = ground; ctx.fillRect(0, 0, W, H); }

    ctx.fillStyle = "rgba(0,0,0," + SCRIMS[ink.scrim] + ")";
    ctx.fillRect(0, 0, W, H);

    if (code.open) drawKeypad(); else drawPaywall();
    requestAnimationFrame(frame);
    return;
  }

    requestAnimationFrame(frame);
    return;

      ctx.drawImage(trailCanvas, 0, 0, W, H);
      if (strokeLive) {
        // the live stroke shows at its translucency until it settles
        ctx.save();
        ctx.globalAlpha = inkAlpha();
        ctx.drawImage(strokeCanvas, 0, 0, W, H);
        ctx.restore();
      }
    }
    if (mode === "bumpers") drawTable();

    ctx.save();
    ctx.globalAlpha = inkAlpha();
    drawShape(ball.shape, ball.x, ball.y, r, ball.spin, inkColor(), false);
    ctx.globalAlpha = Math.max(0.5, inkAlpha());
    drawShape(ball.shape, ball.x, ball.y, r, ball.spin, null, true);
    ctx.restore();

    drawMiss(now);
    if (frozen) drawEditUI();
  }

  drawDock();
  if (glyphOpen) drawGlyphs();
  if (drawerOpen) drawDrawer();

  requestAnimationFrame(frame);
}

// Walls, honouring the ball's real outline rather than a circle around it.
function walls() {
  const pts = ballPoints();
  const r = ballR();
  const e = ball.restitution;
  // Extent of the real outline, which for a tumbling polygon changes every
  // frame. Reflect only when the ball is actually heading into the wall: a
  // corner that rotates back into contact would otherwise flip the velocity
  // a second time and pin the ball to the edge.
  let lo0, hi0, lo1, hi1;
  if (!pts) {
    lo0 = ball.x - r; hi0 = ball.x + r; lo1 = ball.y - r; hi1 = ball.y + r;
  } else {
    lo0 = lo1 = Infinity; hi0 = hi1 = -Infinity;
    for (const [x, y] of pts) {
      if (x < lo0) lo0 = x;
      if (x > hi0) hi0 = x;
      if (y < lo1) lo1 = y;
      if (y > hi1) hi1 = y;
    }
  }
  if (lo0 < 0) { ball.x -= lo0;     if (ball.vx < 0) { ball.vx = -ball.vx * e; impartSpin(1, 0); } }
  if (hi0 > W) { ball.x -= hi0 - W; if (ball.vx > 0) { ball.vx = -ball.vx * e; impartSpin(-1, 0); } }
  if (lo1 < 0) { ball.y -= lo1;     if (ball.vy < 0) { ball.vy = -ball.vy * e; impartSpin(0, 1); } }
  const floor = fieldH();
  if (hi1 > floor) {
    ball.y -= hi1 - floor;
    if (ball.vy > 0) { ball.vy = -ball.vy * e; impartSpin(0, -1); }
  }
}

// Reflect the ball off one bumper — any convex shape against any other.
/** A round bumper, and a round one pulled out of round. */
function isRound(b) { return !b.glyph && b.shape === "circle"; }

/**
 * How much of a bounce a hit gets, from none at a graze to all of it once it
 * is square enough. Eased at both ends, because a hard edge between following
 * the curve and coming off it is a thing you can feel.
 */
function grip(dot) {
  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp < 1e-4) return 1;
  const t = clamp(Math.abs(dot) / sp / CURVE_BITE, 0, 1);
  return t * t * (3 - 2 * t);
}

function bounce(b) {
  const g = geom(b);
  const bp = ballPoints();
  const r = ballR();
  let hit;
  if (g.kind === "circle") {
    if (!bp) hit = circleVsCircle(ball.x, ball.y, r, g.cx, g.cy, g.r);
    else {
      const inv = circleVsPoly(g.cx, g.cy, g.r, bp);      // bumper against ball
      hit = inv && { nx: -inv.nx, ny: -inv.ny, depth: inv.depth };
    }
  } else {
    // A letter is several convex parts, and the deepest contact is the one
    // that counts.
    const parts = g.kind === "letter" ? g.parts : [g.pts];
    for (const pts of parts) {
      const one = bp ? satPolyPoly(bp, pts) : circleVsPoly(ball.x, ball.y, r, pts);
      if (one && (!hit || one.depth > hit.depth)) hit = one;
    }
  }
  if (!hit) return;

  ball.x += hit.nx * hit.depth;
  ball.y += hit.ny * hit.depth;

  const dot = ball.vx * hit.nx + ball.vy * hit.ny;
  if (dot >= 0) return;
  // The bumper about to be struck names the note; the impact plays it.
  nextStep = bumperStep(b);
  impartSpin(hit.nx, hit.ny, false);
  // A flat side is a flat side: it reflects. A round one is followed when it
  // is barely touched, and reflects when it is hit squarely.
  const curve = isRound(b) ? grip(dot) : 1;
  const keep = 1 + (KICK - 1) * curve;      // along the surface
  const give = KICK * curve;                // into it
  const nx = dot * hit.nx, ny = dot * hit.ny;
  ball.vx = (ball.vx - nx) * keep - nx * give;
  ball.vy = (ball.vy - ny) * keep - ny * give;
  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp > MAX_SPEED) { ball.vx *= MAX_SPEED / sp; ball.vy *= MAX_SPEED / sp; }
}

// ---- drawing -------------------------------------------------------------
function circle(x, y, r, fill, rim, line) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (rim) {
    if (!line) ctx.lineWidth = 2;
    ctx.strokeStyle = line || RIM;
    ctx.stroke();
  }
}
// Lightning gets a stroke rather than an outline: a triangle said nothing
// about what the row does, and every other glyph is the thing itself.
const BOLT_GLYPH = [[-0.5, -0.9], [0.3, -0.3], [-0.3, 0.3], [0.5, 0.9]];
// A pane with a break in it: a square, and three cracks leaving one point.
const GLASS_GLYPH = [[-0.75, -0.55], [0.8, 0.3], [-0.2, 0.85]];
function drawGlassGlyph(cx, cy, r, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = r * 0.16;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.strokeRect(cx - r * 0.85, cy - r * 0.85, r * 1.7, r * 1.7);
  ctx.beginPath();
  for (const [x, y] of GLASS_GLYPH) {
    ctx.moveTo(cx - r * 0.1, cy - r * 0.05);
    ctx.lineTo(cx + x * r, cy + y * r);
  }
  ctx.stroke();
  ctx.restore();
}

function drawBoltGlyph(cx, cy, r, color) {
  ctx.save();
  ctx.beginPath();
  BOLT_GLYPH.forEach(([x, y], i) =>
    (i ? ctx.lineTo(cx + x * r, cy + y * r) : ctx.moveTo(cx + x * r, cy + y * r)));
  ctx.strokeStyle = color;
  ctx.lineWidth = r * 0.3;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.stroke();
  ctx.restore();
}

/**
 * `line` overrides the rim's colour and leaves its width alone, which is what
 * the front door's 1.4px line glyphs need; everything else still gets the
 * default 2px dark rim.
 */
function drawShape(shape, cx, cy, r, rot, fill, rim, line) {
  const pts = shapePoints(shape, cx, cy, r, rot);
  if (!pts) return circle(cx, cy, r, fill, rim, line);
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (rim) {
    if (!line) ctx.lineWidth = 2;
    ctx.strokeStyle = line || RIM;
    ctx.stroke();
  }
}
function outline(g, fill, rim) {
  if (g.kind === "circle") return circle(g.cx, g.cy, g.r, fill, rim);
  // A letter has no closed loop to fill: it is a stroke, drawn with a pen.
  if (g.kind === "letter") return penStroke(g, fill || RIM);
  ctx.beginPath();
  for (const [x, y] of [g.pts[0]]) ctx.moveTo(x, y);
  g.pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (rim) { ctx.lineWidth = 2; ctx.strokeStyle = RIM; ctx.stroke(); }
}
/**
 * A letter, drawn with a round pen: one path, stroked once, which is why the
 * joints of a Z meet cleanly and an A has no seam.
 */
function penStroke(g, colour) {
  ctx.save();
  ctx.beginPath();
  for (const line of g.lines) {
    line.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  }
  ctx.lineWidth = LETTER_STROKE * g.r;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = colour;
  ctx.stroke();
  ctx.restore();
}

function drawTable() {
  table.forEach(paintBumper);
}

/** One bumper, wherever it is: the table's, or a sample in the glyph sheet. */
function paintBumper(b) {
  {
    const g = geom(b);
    ctx.save();
    if (g.kind === "letter") {
      ctx.globalAlpha = BUMPER_ALPHA;
      penStroke(g, bumperColor(b));
      ctx.globalAlpha = 1;
    } else if (g.kind === "circle") {
      ctx.translate(g.cx, g.cy);
      ctx.rotate(b.rot);
      ctx.scale(b.sx ?? 1, b.sy ?? 1);
      ctx.globalAlpha = BUMPER_ALPHA;
      circle(0, 0, g.r, bumperColor(b), false);
      ctx.globalAlpha = 1;
      circle(0, 0, g.r, null, true);
    } else {
      ctx.globalAlpha = BUMPER_ALPHA;
      outline(g, bumperColor(b), false);
      ctx.globalAlpha = 1;
      outline(g, null, true);
    }
    ctx.restore();
  }
}

function drawEditUI() {
  const b = table[edit.sel];
  if (b) {
    const g = geom(b), hs = handles(b);
    ctx.save();
    ctx.setLineDash([5, 4]);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#702929";
    outline(g, null, false);
    ctx.stroke();
    ctx.restore();
    circle(hs.pull[0], hs.pull[1], 6, "#702929", true);
    // A perfectly round bumper has no orientation to show; a pulled one does,
    // so the turn handle appears the moment it stops being a circle.
    if (b.shape !== "circle" || b.glyph || b.sx !== b.sy) {
      // tether the rotate handle so it reads as attached, not adrift
      ctx.save();
      ctx.strokeStyle = "rgba(70,90,120,0.55)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(g.cx, g.cy);
      ctx.lineTo(hs.rotate[0], hs.rotate[1]);
      ctx.stroke();
      ctx.restore();
      circle(hs.rotate[0], hs.rotate[1], 6, "#465a78", true);
    }
  }

  ctx.textBaseline = "middle";
  for (const t of toolbar()) {
    ctx.font = "500 " + t.size + "px ui-monospace, Menlo, Consolas, monospace";
    const live = t.label === "+ add" || t.label === "reset" || t.label === "done" || edit.sel >= 0;
    const held = t.label === "shape" && glyphOpen;
    ctx.fillStyle = held ? "rgba(58,58,60,0.92)" : "rgba(226,220,205,0.92)";
    ctx.strokeStyle = RIM;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(t.x, t.y, t.w, t.h, 3);
    ctx.fill(); ctx.stroke();
    if (t.label === "ink" && live) {
      const sw = 9, cx = t.x + t.w / 2, cy = t.y + t.h / 2;
      ctx.fillStyle = bumperColor(table[edit.sel]);
      ctx.fillRect(cx - sw, cy - sw, sw * 2, sw * 2);
      ctx.strokeStyle = RIM;
      ctx.strokeRect(cx - sw + 0.5, cy - sw + 0.5, sw * 2 - 1, sw * 2 - 1);
      continue;
    }
    ctx.fillStyle = held ? "#e8e4dc" : live ? GRAPHITE : "rgba(58,58,60,0.35)";
    ctx.fillText(t.label, t.x + t.pad, t.y + t.h / 2 + 1);
  }
  ctx.fillStyle = "rgba(58,58,60,0.75)";
  ctx.fillText(
    edit.sel >= 0
      ? "drag to move · red handle pulls · blue handle turns · shape opens A-Z and 0-9"
      : "tap a bumper to select it, or + add a new one",
    14, INSET_TOP + 14 + 30 + 16);
}

// Text that stays readable on a swatch, whatever it is filled with.
function contrastOn(hex, alpha) {
  const c = mix([255, 255, 255], hexToRgb(hex), alpha == null ? 1 : alpha);
  const lum = (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255;
  return lum > 0.55 ? "#3a3a3c" : "#f2efe8";
}

/**
 * The front door, per the design handoff: a hairline-ruled list rather than
 * seven grey cards. Cards gave every item the same heavy weight and ate the
 * gutter; rules let the type carry the hierarchy.
 */
function drawTitle() {
  // On a solid canvas the scene sits straight on it. On a sheer one there is
  // no telling what is behind the window, so the title lays down its own
  // ground — still see-through, but dark enough that the name reads.
  const veil = sheer();
  if (veil) { ctx.fillStyle = "rgba(12,12,14,0.62)"; ctx.fillRect(0, 0, W, H); }
  const fg = veil ? "#eeeae2" : contrastOn(canvasColor(), 1);
  const dark = fg !== "#3a3a3c";
  const cx = W / 2;
  // The design's ink, and its inversions for the dark grounds the app also
  // ships. Naming them once keeps the two cases from drifting apart.
  const soft = dark ? "rgba(238,234,226,0.62)" : "#6d685f";
  const hair = dark ? "rgba(238,234,226,0.16)" : "rgba(58,58,60,0.13)";
  const glyphInk = dark ? "rgba(238,234,226,0.55)" : "#8a8378";
  const numeral = dark ? "rgba(238,234,226,0.5)" : OXBLOOD;

  ctx.save();
  ctx.textBaseline = "alphabetic";

  // Wordmark: mono, widely tracked. Canvas had no letter-spacing until
  // Chrome 99, so it is spaced by hand and centred on the spaced total.
  const size = Math.min(du(30), W * 0.09);
  const track = size * 0.34;
  ctx.font = "400 " + size + "px 'IBM Plex Mono', ui-monospace, monospace";
  const chars = [..."NONSENSE"];
  const widths = chars.map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + track * (chars.length - 1);
  ctx.fillStyle = fg;
  ctx.textAlign = "left";
  let x = cx - total / 2;
  chars.forEach((ch, i) => { ctx.fillText(ch, x, titleBaseline()); x += widths[i] + track; });

  // The oxblood rule, and the tagline in italic sans — the one italic on the
  // screen, which is what makes it read as annotation and not as a control.
  ctx.fillStyle = dark ? "rgba(238,234,226,0.45)" : OXBLOOD;
  ctx.fillRect(cx - du(17), titleRuleY(), du(34), Math.max(1, du(2)));
  ctx.textAlign = "center";
  ctx.fillStyle = soft;
  ctx.font = "italic 400 " + du(13) + "px 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif";
  ctx.fillText("something to do with your hands", cx, taglineBaseline());

  const rows = menuRows();
  for (const c of rows) {
    const col = menuCols(c);
    // A rule above every row, and one under the last, so the list is closed.
    ctx.fillStyle = hair;
    ctx.fillRect(c.x, c.y, c.w, 1);
    if (c.i === rows.length - 1) ctx.fillRect(c.x, c.y + c.h, c.w, 1);

    ctx.textBaseline = "middle";
    ctx.textAlign = "center";
    ctx.fillStyle = numeral;
    ctx.font = "400 " + du(12) + "px 'IBM Plex Mono', ui-monospace, monospace";
    ctx.fillText(String(c.i + 1), col.numX, c.y + c.h / 2);

    ctx.textAlign = "left";
    ctx.fillStyle = fg;
    const nameSize = du(15);
    ctx.font = "500 " + nameSize + "px 'IBM Plex Mono', ui-monospace, monospace";
    ctx.letterSpacing = (nameSize * 0.09) + "px";
    ctx.fillText(c.item.label.toUpperCase(), col.textX, c.y + c.h * 0.40);
    ctx.letterSpacing = "0px";

    ctx.fillStyle = soft;
    ctx.font = "italic 400 " + du(12.5) + "px 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif";
    ctx.fillText(c.item.blurb, col.textX, c.y + c.h * 0.68);

    const gx = col.glyphX, gy = c.y + c.h / 2, gr = col.glyphR;
    if (menuLocked(c.item.key)) { drawLock(gx, gy, gr, glyphInk); continue; }
    if (c.item.key === "unlock") { drawLock(gx, gy, gr, OXBLOOD); continue; }
    ctx.save();
    ctx.lineWidth = Math.max(1, du(1.4));
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    const line = c.item.key === "ink" ? inkColor() : glyphInk;
    if (c.item.glyph === "bolt") drawBoltGlyph(gx, gy, gr, line);
    else if (c.item.glyph === "glass") drawGlassGlyph(gx, gy, gr, line);
    else drawShape(c.item.glyph, gx, gy, gr, 0, null, true, line);
    if (c.item.key === "dial") {
      ctx.strokeStyle = line;
      ctx.lineWidth = Math.max(1, du(1.2));
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI) / 4;
        ctx.beginPath();
        ctx.moveTo(gx + Math.cos(a) * gr * 0.4, gy + Math.sin(a) * gr * 0.4);
        ctx.lineTo(gx + Math.cos(a) * gr * 1.05, gy + Math.sin(a) * gr * 1.05);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // Which build this is, quiet enough to ignore and there when the question
  // is whether what you are looking at is the newest one.
  if (BUILD) {
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.globalAlpha = 0.35;
    ctx.font = "400 " + Math.min(W * 0.026, 13) + "px ui-monospace, Menlo, monospace";
    ctx.fillStyle = fg;
    ctx.fillText(BUILD, cx, H - H * 0.014);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function cornerButton(b, label, on) {
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(b.x, b.y, b.w, b.h, 3);
  ctx.fillStyle = on ? GRAPHITE : "rgba(255,255,255,0.55)";
  ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = on ? GRAPHITE : "rgba(58,58,60,0.22)";
  ctx.stroke();
  ctx.fillStyle = on ? "#e8e4dc" : "#4a4742";
  ctx.font = "500 10px ui-monospace, Menlo, Consolas, monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 0.5);
  ctx.restore();
}

// A padlock, small enough to sit on a chip.
function drawLock(cx, cy, r, colour) {
  ctx.save();
  ctx.fillStyle = colour;
  ctx.strokeStyle = colour;
  ctx.beginPath();
  ctx.roundRect(cx - r * 0.62, cy - r * 0.1, r * 1.24, r * 0.88, r * 0.18);
  ctx.fill();
  ctx.lineWidth = Math.max(1, r * 0.24);
  ctx.beginPath();
  ctx.arc(cx, cy - r * 0.1, r * 0.38, Math.PI, 0);
  ctx.stroke();
  ctx.restore();
}

/**
 * What the unlock buys, in words. A screen rather than a dialog: it has to
 * say enough to be worth reading, and a fidget toy interrupting you with a
 * modal is a worse thing than a page you chose to open.
 */
function drawPaywall() {
  const veil = sheer();
  if (veil) { ctx.fillStyle = "rgba(12,12,14,0.62)"; ctx.fillRect(0, 0, W, H); }
  const fg = veil ? "#eeeae2" : contrastOn(canvasColor(), 1);
  const dark = fg !== "#3a3a3c";
  const cx = W / 2;

  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = fg;
  ctx.font = "600 " + Math.min(W * 0.062, 34) + "px 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif";
  ctx.fillText("UNLOCK EVERYTHING", cx, H * 0.19);

  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  // Measured, not assumed: at a fixed size the longer promises ran off the
  // right edge of a 390px phone, which is a poor advertisement for care.
  const lx = Math.max(W * 0.16, cx - 230);
  const room = W - lx - Math.max(W * 0.06, 16);
  let lineSize = Math.min(W * 0.03, 14);
  const measure = (px) => {
    ctx.font = "400 " + px + "px 'IBM Plex Mono', ui-monospace, monospace";
    return Math.max(...PAYWALL_LINES.map(l => ctx.measureText(l).width));
  };
  const widest = measure(lineSize);
  if (widest > room) lineSize = Math.max(lineSize * (room / widest), 8);
  ctx.font = "400 " + lineSize + "px 'IBM Plex Mono', ui-monospace, monospace";

  const top = paywallButtons()[0].y;
  const step = Math.min(lineSize * 2.4, (top - H * 0.28) / PAYWALL_LINES.length);
  let ly = H * 0.28 + step * 0.5;
  for (const line of PAYWALL_LINES) {
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(lx - lineSize * 0.9, ly, Math.max(2, lineSize * 0.17), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.85;
    ctx.fillText(line, lx, ly);
    ly += step;
  }
  ctx.globalAlpha = 1;

  // The terms, above the buttons: what it costs, how often, and that it
  // renews — the honest thing to do, and what App Review looks for.
  const prompt = codePromptCell();
  ctx.textAlign = "center";
  const termSize = Math.min(W * 0.028, 12);
  ctx.font = "400 " + termSize + "px 'IBM Plex Mono', ui-monospace, monospace";
  const terms = subscriptionTerms();
  let ty = prompt.y - prompt.h * 0.5 - termSize * terms.length * 1.35;
  for (const line of terms) {
    ctx.globalAlpha = 0.6;
    ctx.fillText(line, cx, ty);
    ty += termSize * 1.35;
  }
  ctx.globalAlpha = 0.7;
  ctx.font = "500 " + Math.min(prompt.h * 0.45, 14) +
             "px 'IBM Plex Mono', ui-monospace, monospace";
  ctx.fillText(CODE_PROMPT, cx, prompt.y + prompt.h / 2);
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";

  for (const c of paywallButtons()) {
    const primary = c.label === "subscribe";
    ctx.beginPath();
    ctx.roundRect(c.x, c.y, c.w, c.h, c.h * 0.22);
    ctx.fillStyle = primary ? "#702929"
      : dark ? "rgba(255,255,255,0.11)" : "rgba(0,0,0,0.09)";
    ctx.fill();
    if (!primary) {
      ctx.lineWidth = 1;
      ctx.strokeStyle = dark ? "rgba(255,255,255,0.22)" : "rgba(0,0,0,0.2)";
      ctx.stroke();
    }
    ctx.textAlign = "center";
    ctx.fillStyle = primary ? "#f0ece4" : fg;
    ctx.globalAlpha = primary ? 1 : 0.75;
    ctx.font = "500 " + (c.h * 0.3) + "px 'IBM Plex Mono', ui-monospace, monospace";
    ctx.fillText(primary ? unlockLabel() : c.label, c.x + c.w / 2, c.y + c.h / 2);
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }
  ctx.restore();
}

/** The keypad, which replaces the buttons once the code row is tapped. */
function drawKeypad() {
  const veil = sheer() ? 0.62 : 0;
  if (veil > 0) { ctx.fillStyle = "rgba(12,12,14," + veil + ")"; ctx.fillRect(0, 0, W, H); }
  const fg = sheer() ? "#eeeae2" : contrastOn(canvasColor(), 1);
  const dark = fg !== "#3a3a3c";
  const cx = W / 2;
  ctx.save();
  ctx.fillStyle = fg;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "600 " + Math.min(W * 0.062, 26) + "px 'IBM Plex Sans', system-ui, sans-serif";
  ctx.fillText(code.wrong ? "NOT THAT ONE" : "ENTER THE CODE", cx, H * 0.19);

  // One dot per digit, filled as they are typed: a row of dots says how long
  // the code is without a field that needs a cursor.
  const cells = keypadCells();
  const r = Math.min(W * 0.014, 7);
  const gap = r * 3.4;
  const dotsY = cells[0].y - r * 6;
  const x0 = cx - ((CODE_LENGTH - 1) * gap) / 2;
  for (let i = 0; i < CODE_LENGTH; i++) {
    ctx.globalAlpha = i < code.entry.length ? 0.9 : 0.25;
    ctx.beginPath();
    ctx.arc(x0 + gap * i, dotsY, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const c of cells) {
    if (!c.label) continue;
    ctx.beginPath();
    ctx.roundRect(c.x, c.y, c.w, c.h, c.h * 0.22);
    ctx.fillStyle = dark ? "rgba(255,255,255,0.11)" : "rgba(0,0,0,0.09)";
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = dark ? "rgba(255,255,255,0.22)" : "rgba(0,0,0,0.2)";
    ctx.stroke();
    ctx.fillStyle = fg;
    ctx.globalAlpha = 0.82;
    ctx.font = "500 " + (c.h * (c.label === "del" ? 0.3 : 0.42)) +
               "px 'IBM Plex Mono', ui-monospace, monospace";
    ctx.fillText(c.label === "del" ? "back" : c.label, c.x + c.w / 2, c.y + c.h / 2);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawMenuButton() {
  if (mode === "bumpers") cornerButton(editButton(), "EDIT", edit.on);
  cornerButton(menuButton(), "\u2261  MENU", false);
}

/**
 * A knurled wheel. It used to be a plain disc with one dot on it, which is
 * why nothing ever looked like it was turning — there was nothing on it to
 * watch. At speed the ribs are drawn wider and fainter, so a fast spin blurs
 * instead of crawling backwards.
 */
function drawDial() {
  const cx = W / 2, cy = H / 2, r = dial.r;
  const a = inkAlpha();
  const base = hexToRgb(inkColor());
  const fast = dialSpeed();
  ctx.save();
  ctx.globalAlpha = a;
  circle(cx, cy, r, inkColor(), false);

  const step = (2 * Math.PI) / DIAL_RIBS;
  const inner = r * 0.54, outer = r * 0.94;
  ctx.lineCap = "round";
  ctx.lineWidth = r * (0.085 + 0.075 * fast);
  for (let i = 0; i < DIAL_RIBS; i++) {
    const ang = dial.angle + step * i;
    const marked = i === 0;              // so a turn stays countable at speed
    ctx.globalAlpha = a * (marked ? 0.95 : 0.8 - 0.3 * fast);
    ctx.strokeStyle = toHex(mix(base, marked ? [0, 0, 0] : [255, 255, 255], marked ? 0.55 : 0.5));
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * inner, cy + Math.sin(ang) * inner);
    ctx.lineTo(cx + Math.cos(ang) * outer, cy + Math.sin(ang) * outer);
    ctx.stroke();
  }

  ctx.globalAlpha = a;
  circle(cx, cy, r * 0.46, toHex(mix(base, [0, 0, 0], 0.28)), false);
  ctx.globalAlpha = Math.max(0.5, a);
  circle(cx, cy, r * 0.46, null, true);
  circle(cx, cy, r, null, true);

  // the index the ribs click past
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = "#702929";
  const tip = cy - r * 1.02;
  ctx.beginPath();
  ctx.moveTo(cx, tip + r * 0.09);
  ctx.lineTo(cx - r * 0.055, tip - r * 0.02);
  ctx.lineTo(cx + r * 0.055, tip - r * 0.02);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/**
 * The glyph sheet: every outline, letter and digit a bumper can be, drawn as
 * the bumper it would make rather than as a name. It is the same painter the
 * table uses, on a throwaway bumper placed in the cell, so what you tap is
 * exactly what you get — including its ink.
 */
function drawGlyphs() {
  const s = glyphSheet();
  ctx.save();
  ctx.font = "500 10px ui-monospace, Menlo, Consolas, monospace";
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";

  ctx.fillStyle = "rgba(232,228,220,0.97)";
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(s.x, s.y, s.w, s.h, 6);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = "rgba(58,58,60,0.55)";
  ctx.fillText("SHAPE", s.gx, s.gy - 9);

  const sel = table[edit.sel];
  const here = sel ? glyphIndexOf(sel) : -1;
  for (const c of glyphCells()) {
    if (c.i === here) {
      ctx.fillStyle = "rgba(58,58,60,0.10)";
      ctx.strokeStyle = "rgba(58,58,60,0.75)";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(c.x + 2, c.y + 2, c.w - 4, c.h - 4, 4);
      ctx.fill(); ctx.stroke();
    }
    paintBumper(glyphSample(c.i, c.x + c.w / 2, c.y + c.h / 2, c.w * 0.33));
  }
  ctx.restore();
}

/**
 * The dock: one panel, three tiers. Tool selection is the loudest thing on
 * it, the held tool's options are quieter, and the inks are a ribbon rather
 * than a row of buttons.
 */
function drawDock() {
  const d = dockBox();
  ctx.save();
  ctx.textBaseline = "middle";
  ctx.textAlign = "center";

  ctx.save();
  ctx.shadowColor = "rgba(58,58,60,0.13)";
  ctx.shadowBlur = du(28);
  ctx.shadowOffsetY = du(10);
  ctx.beginPath();
  ctx.roundRect(d.x, d.y, d.w, d.h, du(6));
  ctx.fillStyle = "rgba(240,238,233,0.94)";
  ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.roundRect(d.x, d.y, d.w, d.h, du(6));
  ctx.strokeStyle = "rgba(58,58,60,0.14)";
  ctx.lineWidth = 1;
  ctx.stroke();

  const chip = (c, on, r) => {
    ctx.beginPath();
    ctx.roundRect(c.x, c.y, c.w, c.h, r);
    ctx.fillStyle = on ? GRAPHITE : "#e8e4dc";
    ctx.fill();
    ctx.strokeStyle = on ? GRAPHITE : "rgba(58,58,60,0.16)";
    ctx.lineWidth = 1;
    ctx.stroke();
  };

  // Tier one: the tools. Numeral above name, selected filled in graphite.
  for (const c of dockTiles()) {
    const on = mode === c.key;
    chip(c, on, du(3));
    const locked = modeLocked(c.key);
    ctx.globalAlpha = locked ? 0.4 : 1;
    ctx.fillStyle = on ? "#e8e4dc" : "#4a4742";
    ctx.font = "400 " + du(9) + "px 'IBM Plex Mono', ui-monospace, monospace";
    ctx.globalAlpha *= on ? 0.72 : 0.62;
    ctx.fillText(String(c.i + 1), c.x + c.w / 2, c.y + c.h * 0.34);
    ctx.globalAlpha = locked ? 0.4 : 1;
    ctx.font = "500 " + du(10) + "px 'IBM Plex Mono', ui-monospace, monospace";
    ctx.letterSpacing = (du(10) * 0.05) + "px";
    ctx.fillText(c.key.toUpperCase(), c.x + c.w / 2, c.y + c.h * 0.66);
    ctx.letterSpacing = "0px";
    ctx.globalAlpha = 1;
  }

  // Tier two: what the held tool can do.
  for (const c of dockOptionChips()) {
    const on = (c.key === "palette" && drawerOpen) ||
               (c.key === "edit" && edit.on) ||
               (c.key === "catch" && ball.mustCatch) ||
               (c.key === "paint here" && paint.onBumpers);
    chip(c, on, du(3));
    ctx.fillStyle = on ? "#e8e4dc" : "#4a4742";
    let size = du(10.5);
    const label = dockOptionLabel(c.key).toUpperCase();
    // Nothing wraps and nothing is clipped: a chip shrinks its type until
    // its own label fits inside it.
    for (let i = 0; i < 12; i++) {
      ctx.font = "400 " + size + "px 'IBM Plex Mono', ui-monospace, monospace";
      if (ctx.measureText(label).width <= c.w - du(10) || size < du(6)) break;
      size -= 0.5;
    }
    ctx.fillText(label, c.x + c.w / 2, c.y + c.h / 2 + 1);
  }

  // The menu, demoted out of the chip flow: it is not a tool.
  const m = dockMenuChip();
  ctx.beginPath();
  ctx.roundRect(m.x, m.y, m.w, m.h, du(3));
  ctx.fillStyle = GRAPHITE;
  ctx.fill();
  ctx.fillStyle = "#e8e4dc";
  ctx.font = "400 " + du(15) + "px 'IBM Plex Mono', ui-monospace, monospace";
  ctx.fillText("\u2261", m.x + m.w / 2, m.y + m.h / 2 + 1);

  // Tier three: the inks, flush.
  const d2 = dockBox();
  ctx.fillStyle = "rgba(58,58,60,0.1)";
  ctx.fillRect(d2.x + d2.pad, d2.ruleY, d2.w - d2.pad * 2, 1);
  for (const c of dockInkCells()) {
    ctx.fillStyle = PALETTE[c.i][ink.tone];
    ctx.fillRect(c.x, c.y, c.w + 0.5, c.h);
    if (familyLocked(c.i)) {
      ctx.fillStyle = "rgba(240,238,233,0.62)";
      ctx.fillRect(c.x, c.y, c.w + 0.5, c.h);
    }
    if (c.i === ink.family) {
      // A double inset ring, which reads on light and dark inks alike.
      ctx.strokeStyle = "#e8e4dc";
      ctx.lineWidth = 2;
      ctx.strokeRect(c.x + 1, c.y + 1, c.w - 2, c.h - 2);
      ctx.strokeStyle = GRAPHITE;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(c.x + 2.75, c.y + 2.75, c.w - 5.5, c.h - 5.5);
    }
  }
  ctx.restore();
}

/**
 * The drawer, as a sheet: a grab handle, the ink you are holding named at the
 * top, the whole palette as a grid, and the settings in ruled groups under it.
 */
function drawDrawer() {
  const b = drawerBox();
  const u = b.u;
  ctx.save();
  ctx.textBaseline = "middle";

  // The panel, rounded at the top corners only — it is anchored to the
  // bottom edge, so the bottom corners are not on screen to round.
  ctx.save();
  ctx.shadowColor = "rgba(58,58,60,0.16)";
  ctx.shadowBlur = 40 * u;
  ctx.shadowOffsetY = -14 * u;
  ctx.beginPath();
  ctx.roundRect(b.x, b.y, b.w, b.h, [10 * u, 10 * u, 0, 0]);
  ctx.fillStyle = "#f0eee9";
  ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.moveTo(b.x, b.y + 0.5);
  ctx.lineTo(b.x + b.w, b.y + 0.5);
  ctx.strokeStyle = "rgba(58,58,60,0.16)";
  ctx.lineWidth = 1;
  ctx.stroke();

  // The grab handle: what says this is a sheet and can be put away.
  ctx.beginPath();
  ctx.roundRect(b.x + b.w / 2 - 19 * u, b.handleY, 38 * u, 4 * u, 2 * u);
  ctx.fillStyle = "rgba(58,58,60,0.2)";
  ctx.fill();

  const targeted = targetBumper();
  // The grid lights whichever cell the thing being painted is wearing.
  const selFamily = targeted ? targeted.family : ink.family;
  const selTone = targeted ? targeted.tone : ink.tone;

  // The ink header, baseline-aligned: what this is on the left, and what you
  // are holding on the right.
  ctx.textAlign = "left";
  ctx.fillStyle = "#6d685f";
  ctx.font = "500 " + (10 * u) + "px 'IBM Plex Mono', ui-monospace, monospace";
  ctx.letterSpacing = (10 * u * 0.18) + "px";
  ctx.fillText(targeted ? "BUMPER" : "INK", b.gx, b.headerY);
  ctx.letterSpacing = "0px";
  const chipW = 13 * u;
  ctx.fillStyle = PALETTE[selFamily][selTone];
  ctx.beginPath();
  ctx.roundRect(b.gx + b.gridW - chipW, b.headerY - chipW / 2, chipW, chipW, 2 * u);
  ctx.fill();
  ctx.strokeStyle = "rgba(58,58,60,0.2)";
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.textAlign = "right";
  ctx.fillStyle = GRAPHITE;
  ctx.font = "400 " + (12 * u) + "px 'IBM Plex Mono', ui-monospace, monospace";
  ctx.fillText(FAMILIES[selFamily].name, b.gx + b.gridW - chipW - 8 * u, b.headerY);

  // The palette itself.
  for (let f = 0; f < b.cols; f++) {
    for (let t = 0; t < b.rows; t++) {
      const x = b.gx + f * b.cell;
      const y = b.gy + t * b.cell;
      const cw = b.cell - b.gridGap;
      const locked = familyLocked(f);
      ctx.beginPath();
      ctx.roundRect(x, y, cw, cw, 2 * u);
      ctx.fillStyle = PALETTE[f][t];
      ctx.globalAlpha = locked ? 0.3 : 1;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "rgba(58,58,60,0.12)";
      ctx.lineWidth = 1;
      ctx.stroke();
      if (f === selFamily && t === selTone) {
        ctx.beginPath();
        ctx.roundRect(x - 1, y - 1, cw + 2, cw + 2, 3 * u);
        ctx.strokeStyle = GRAPHITE;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      if (locked && t === 0) {
        drawLock(x + cw / 2, y + cw * 1.6, cw * 0.3, "rgba(58,58,60,0.6)");
      }
    }
  }

  // The settings, in ruled groups.
  for (const kind of b.kinds) {
    const row = DRAWER_ROW[kind];
    const y = b.rowY[kind];
    ctx.fillStyle = "rgba(58,58,60,0.11)";
    ctx.fillRect(b.gx, y - b.labelDrop, b.gridW, 1);
    ctx.textAlign = "left";
    ctx.fillStyle = "#6d685f";
    ctx.font = "500 " + (9.5 * u) + "px 'IBM Plex Mono', ui-monospace, monospace";
    ctx.letterSpacing = (9.5 * u * 0.18) + "px";
    ctx.fillText(row.label, b.gx, y - 8 * u - 9.5 * u * 0.5);
    ctx.letterSpacing = "0px";
    ctx.textAlign = "center";

    const items = row.items();
    for (const c of drawerChips(y, items.length, b)) {
      const on = row.get() === c.i;
      const locked = kind === "canvas" && canvasLocked(c.i);
      ctx.beginPath();
      ctx.roundRect(c.x, c.y, c.w, c.h, 3 * u);
      ctx.fillStyle = on ? GRAPHITE : "#e8e4dc";
      ctx.fill();
      ctx.strokeStyle = on ? GRAPHITE : "rgba(58,58,60,0.16)";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = on ? "#e8e4dc" : "#4a4742";
      ctx.globalAlpha = locked ? 0.45 : 1;
      let size = 10.5 * u;
      const label = drawerChipLabel(kind, c.i);
      for (let i = 0; i < 12; i++) {
        ctx.font = "400 " + size + "px 'IBM Plex Mono', ui-monospace, monospace";
        if (ctx.measureText(label).width <= c.w - 8 * u || size < 6) break;
        size -= 0.5;
      }
      ctx.fillText(label, c.x + c.w / 2, c.y + c.h / 2);
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

/** What one settings chip reads. */
function drawerChipLabel(kind, i) {
  switch (kind) {
    case "alpha": return Math.round(ALPHAS[i] * 100) + "%";
    case "canvas": return CANVASES[i].name;
    case "scrim": return Math.round(SCRIMS[i] * 100) + "%";
    case "haptic": return HAPTICS[i];
    default: return VOICES[i];
  }
}

function drawMiss(now) {
  const age = (now - miss.t) / 420;
  if (age < 0 || age > 1) return;
  ctx.save();
  ctx.globalAlpha = (1 - age) * 0.45;
  ctx.strokeStyle = inkColor();
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(miss.x, miss.y, 7 + age * 24, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawStrip(now) {
  const sh = paint.stripH();
  const cy = H - sh / 2;
  // On a phone the strip is the only way to reach size and shape, and on a
  // phone the cells are half as wide as they are on a laptop: a chip sized
  // off the strip's height alone overlapped its neighbours and ran off the
  // left edge. It gets whichever is smaller.
  const chipCap = sh * 0.28;
  // Graphite chips on the ink canvas are a hole rather than a control. Sheer
  // is left alone: what is behind the window is anyone's guess.
  const chipInk = sheer() ? [58, 58, 60] : hexToRgb(contrastOn(canvasColor(), 1));
  const rgba = (a) => `rgba(${chipInk[0]},${chipInk[1]},${chipInk[2]},${a})`;
  // the transient version fades out over its last half second
  // The strip is a fixture now rather than a reminder that flashes after a
  // key press, so there is nothing left to fade.
  const fade = 1;
  ctx.save();
  ctx.globalAlpha = fade;
  for (const z of stripLayout()) {
    const step = (z.x1 - z.x0) / z.items.length;
    const chipR = Math.min(chipCap, step * 0.42);
    z.items.forEach((item, i) => {
      const cx = z.x0 + step * (i + 0.5);
      if (z.kind === "color") {
        const locked = familyLocked(i);
        ctx.save();
        if (locked) ctx.globalAlpha = 0.3;
        circle(cx, cy, chipR, PALETTE[i][ink.tone], i === ink.family);
        ctx.restore();
        if (locked) drawLock(cx, cy, chipR * 0.62, "rgba(58,58,60,0.8)");
      } else if (z.kind === "size") {
        // each chip is the ball at that size, in miniature
        const rr = chipR * (0.3 + 0.85 * (item / SIZES[SIZES.length - 1]));
        drawShape(ball.shape, cx, cy, rr, 0, rgba(0.55), i === ball.sizeIndex);
      } else {
        drawShape(item, cx, cy, chipR * 0.92, 0,
                  rgba(item === ball.shape ? 1 : 0.35), item === ball.shape);
      }
    });
  }
  ctx.restore();
}

requestAnimationFrame(frame);
</script>
</body>
