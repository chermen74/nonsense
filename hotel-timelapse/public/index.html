<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel Timelapse</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="app" hidden>

  <header class="masthead">
    <div class="ident">
      <h1 id="property-name">&nbsp;</h1>
      <p class="sub"><span id="property-locale"></span> &middot; <span id="property-rooms"></span> &middot; <span id="period-label"></span></p>
    </div>
    <p class="badge" id="synthetic-badge" hidden>Demo data</p>
  </header>

  <section class="readout" aria-live="polite">
    <div class="day">
      <p class="day-dow" id="day-dow"></p>
      <p class="day-date" id="day-date"></p>
    </div>
    <div class="hero">
      <p class="hero-label" id="hero-label"></p>
      <p class="hero-value" id="hero-value"></p>
    </div>
    <dl class="alongside" id="alongside"></dl>
  </section>

  <section class="chart-block">
    <div class="chart-head">
      <h2 id="chart-title"></h2>
      <div class="series-switch" role="group" aria-label="Metric"></div>
    </div>
    <div class="chart-wrap" id="chart-wrap">
      <svg id="chart" role="img"></svg>
      <div class="tooltip" id="tooltip" hidden></div>
    </div>
    <p class="annotations" id="annotations"></p>
  </section>

  <section class="transport">
    <div class="buttons">
      <button type="button" id="btn-prev" class="icon" title="Previous day (left arrow)" aria-label="Previous day">&#9664;&#9612;</button>
      <button type="button" id="btn-play" class="icon play" title="Play / pause (space)" aria-label="Play">&#9654;</button>
      <button type="button" id="btn-next" class="icon" title="Next day (right arrow)" aria-label="Next day">&#9612;&#9654;</button>
    </div>
    <input type="range" id="scrub" min="0" max="0" step="1" value="0" aria-label="Day of period">
    <div class="speeds" role="group" aria-label="Playback speed"></div>
  </section>

  <section class="mtd">
    <h2>Month to date</h2>
    <dl id="mtd-list"></dl>
  </section>

  <section class="table-block">
    <button type="button" id="btn-table" aria-expanded="false" aria-controls="table-panel">Show data table</button>
    <div id="table-panel" hidden>
      <table id="data-table">
        <caption id="table-caption"></caption>
        <thead><tr><th scope="col">Date</th><th scope="col">Day</th><th scope="col">Rooms sold</th><th scope="col">Occupancy</th><th scope="col">ADR</th><th scope="col">RevPAR</th><th scope="col">Room revenue</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <footer class="foot" id="foot"></footer>
</div>

<div class="failure" id="failure" hidden>
  <h1>This didn&rsquo;t load</h1>
  <p id="failure-what"></p>
  <p class="failure-source" id="failure-source"></p>
  <p class="failure-hint" id="failure-hint"></p>
</div>

<script src="property.demo.js"></script>
<script src="app.js"></script>
</body>
</html>
