# XcodeGen spec rather than a checked-in .xcodeproj.
#
# A pbxproj is a wall of generated UUIDs that no human should hand-write and
# no diff should ever have to show. This file is the same information in
# fifteen readable lines:
#
#   brew install xcodegen
#   cd ios && xcodegen && open Nonsense.xcodeproj
#
name: Nonsense
options:
  bundleIdPrefix: com.nonsense
  deploymentTarget:
    iOS: "16.0"
packages:
  NonsenseCore:
    path: .
targets:
  Nonsense:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: NonsenseCore
        product: NonsenseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nonsense
        # Without this there is no Info.plist in the bundle at all, and the
        # packaging step fails looking for one. Xcode synthesises it from the
        # INFOPLIST_KEY_* settings below, which is why there is no plist file
        # checked in anywhere.
        GENERATE_INFOPLIST_FILE: YES
        # His face, with an aura around it, from App/Assets.xcassets. One
        # 1024 and no alpha in it: iOS rounds the corners itself and rejects
        # an icon that has already been rounded.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Portrait only. The table and the strip are laid out for a phone held
        # upright, and a fidget toy that reflows mid-flick is a worse thing
        # than one that does not rotate.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ENABLE_USER_SCRIPT_SANDBOXING: YES
